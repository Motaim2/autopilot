<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>مصطفى — المعالج</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0d13;--ink:#e8edf4;--dim:#8b96a8;--line:#1c2430;--panel:#111722;--panel2:#0d121b;
  --accent:#e94f37;--gold:#e0a92e;--green:#3ec96a;--red:#e8455f;--blue:#4a9eda}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:'Rubik',sans-serif;min-height:100vh;padding-bottom:20px}
.top{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:10}
.top h1{font-size:15px;font-weight:900;color:var(--gold)}
.steps{display:flex;gap:4px;margin-inline-start:auto}
.steps .st{width:26px;height:26px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--dim);font-weight:700}
.steps .st.on{background:var(--gold);color:#2a1e00;border-color:var(--gold)}
.steps .st.done{background:var(--green);color:#04240f;border-color:var(--green)}
.wrap{max-width:1080px;margin:0 auto;padding:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.card h2{font-size:14px;color:var(--gold);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.card h2 .tag{margin-inline-start:auto;font-size:11px;color:var(--dim);font-weight:400}
#camWrap{position:relative;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:9/16;touch-action:none;max-height:430px;margin:0 auto}
#video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
#ovl{position:absolute;inset:0;width:100%;height:100%}
#camMsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:var(--dim);font-size:13px;text-align:center;padding:24px}
.btn{border:none;border-radius:10px;font-family:inherit;font-weight:700;font-size:14px;padding:11px 18px;cursor:pointer;color:#fff;background:linear-gradient(180deg,#f0603f,var(--accent));box-shadow:0 3px 0 #a82f1c}
.btn:active{transform:translateY(2px)}
.btn.ghost{background:transparent;color:var(--gold);border:1px solid var(--line);box-shadow:none}
.btn.small{font-size:12px;padding:7px 13px}
.btn.gold{background:linear-gradient(180deg,#f0c860,var(--gold));color:#2a1e00;box-shadow:0 3px 0 #8a6a1a}
.btn.green{background:linear-gradient(180deg,#5ce88a,var(--green));color:#04240f;box-shadow:0 3px 0 #1e7a3e}
.btn.blue{background:linear-gradient(180deg,#6ab8ea,var(--blue));color:#04182a;box-shadow:0 3px 0 #2a6a9a}
.btn.big{font-size:15px;padding:13px;width:100%}
.btn:disabled{opacity:.35;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
.live2{display:grid;grid-template-columns:1fr;gap:8px;margin-top:8px}
.live2 .bx{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.live2 .bx .l{font-size:9px;color:var(--dim)}.live2 .bx .v{font-size:19px;font-weight:900;color:var(--blue);direction:ltr}
.live2 .bx.f .v{font-size:14px;color:var(--gold)}
.stageMsg{text-align:center;font-size:13px;padding:10px;border-radius:10px;margin-top:8px;background:var(--panel2);border:1px solid var(--line);line-height:1.7}
.stageMsg.ok{border-color:var(--green);color:var(--green)}
.stageMsg.hot{border-color:var(--gold);color:var(--gold);font-weight:700}
/* شبكة معاينة الفواكه */
.fr8{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:8px}
.fr8 .f8{text-align:center}
.fr8 .f8 canvas{width:100%;aspect-ratio:1;border-radius:6px;background:#000;border:1.5px solid var(--line);display:block}
.fr8 .f8.ok canvas{border-color:var(--green)}
.fr8 .f8 span{font-size:8px;color:var(--dim)}
.fr8 .f8.ok span{color:var(--green)}
/* منبثق التعليم */
#pop{display:none;background:var(--panel2);border:1.5px solid var(--gold);border-radius:12px;padding:12px;margin-top:10px;text-align:center}
#popImg{max-width:100%;border-radius:10px;border:2px solid var(--gold);background:#000;margin:0 auto 8px;display:block}
#popImg.small{width:88px;height:88px}
.fbtns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.fbtns button{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.fbtns button:active{background:var(--line)}
.fbtns button.did{opacity:.35}
.fbtns .em{font-size:21px}.fbtns .nm{font-size:9px;color:var(--dim)}
/* اللعب */
.playGrid{display:block}
@media(min-width:940px){.playGrid{display:grid;grid-template-columns:1.45fr 380px;gap:12px;align-items:start}}
#camWrap.playBig{max-height:82vh}
.strip .lbl{font-size:12px;color:var(--gold);font-weight:700;margin-bottom:6px;display:flex;gap:6px}
.strip .lbl .cnt{margin-inline-start:auto;font-size:10px;color:var(--dim);font-weight:400}
.sScroll{display:flex;gap:5px;overflow-x:auto;padding:8px;background:var(--panel2);border:1px solid var(--line);border-radius:11px;direction:rtl;min-height:60px}
.sScroll::-webkit-scrollbar{height:5px}.sScroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.dcol{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--panel);border:1.5px solid var(--line);border-radius:9px;padding:4px 5px;min-width:42px}
.dcol.hit{border-color:var(--blue)}.dcol.miss{border-color:var(--red)}
.dcol .rep{font-size:10px;font-weight:900;color:var(--gold);line-height:1}
.dcol .mk{font-size:12px;font-weight:900;line-height:1}
.dcol .s24{font-size:12px;line-height:1;opacity:.9}
.dcol .sr{font-size:21px;line-height:1}
.dcol .rnd{font-size:9px;color:var(--ink);line-height:1.1;font-weight:600}
.absGrid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.absGrid .ab{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 1px;text-align:center}
.absGrid .ab .e{font-size:17px;line-height:1.1}
.absGrid .ab .nm{font-size:9px;font-weight:700;line-height:1.2}
.absGrid .ab .g{font-size:13px;font-weight:900;color:var(--gold);line-height:1.2}
.absGrid .ab .mx{font-size:7px;color:var(--dim)}
.chip{flex:none;width:31px;height:31px;border-radius:7px;background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:17px;position:relative}
.chip.newest{border-color:var(--green)}
.field{display:flex;gap:8px}.field .f{flex:1}.field label{font-size:10px;color:var(--dim);display:block;margin-bottom:3px}
.field input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:9px;color:var(--ink);font-family:inherit;font-weight:700;font-size:14px;padding:8px;text-align:center;outline:none}
.hide{display:none!important}
.mini{font-size:10px;color:var(--dim)}
</style>
</head>
<body>
<div class="top">
  <h1>🎩 مصطفى</h1>
  <div class="steps" id="steps"></div>
</div>

<div class="wrap">
  <!-- الفيديو (يتنقل بين المراحل) -->
  <div class="card" id="camCard">
    <h2 id="stageTitle">المرحلة ١ — تحديد الشبكة</h2>
    <div id="camWrap">
      <video id="video" playsinline muted></video>
      <canvas id="ovl"></canvas>
      <div id="camMsg">
        <div>التقط شاشة LDPlayer أولاً</div>
        <button class="btn" id="startCap">🖥️ التقاط الشاشة</button>
      </div>
    </div>
    <div class="row" style="margin-top:8px" id="stageBtns"></div>
    <div class="live2">
      <div class="bx"><div class="l">العدّاد</div><div class="v" id="cVal">--</div></div>
    </div>
    <div class="stageMsg" id="stageMsg">شغّل الالتقاط</div>
    <div id="pop">
      <div style="font-size:12px;color:var(--dim);margin-bottom:8px" id="popQ"></div>
      <canvas id="popImg" width="88" height="88" class="small"></canvas>
      <div class="fbtns" id="popBtns"></div>
      <button class="btn small ghost" id="popSkip" style="margin-top:8px">تخطّي / غلط</button>
    </div>
    <div class="fr8" id="fr8"></div>
    <button class="btn green big" id="confirmStage" style="margin-top:10px" disabled>✅ تأكيد المرحلة</button>
  </div>

  <!-- شاشة اللعب -->
  <div id="playPhase" class="hide">
    <div class="playGrid">
      <div>
        <div class="card">
          <h2>▶️ الرصد <span class="tag"><button class="btn small ghost" id="backBtn" style="padding:3px 9px">⚙️</button> <button class="btn small ghost" id="expBtn" style="padding:3px 9px">⬇ تصدير الإعداد</button></span></h2>
          <div id="playCamHolder"></div>
          <div class="live2">
            <div class="bx"><div class="l">العدّاد</div><div class="v" id="cVal2">--</div></div>
          </div>
          <div class="stageMsg" id="playMsg">بانتظار الـ24...</div>
        </div>
      </div>
      <div>
        <div class="card"><div class="strip">
          <div class="lbl" style="color:var(--blue)">🎯 سجل الـ24 <span class="cnt">✔<span id="hitN">0</span> · <span id="accN">0</span>٪</span></div>
          <div class="sScroll" id="dualStrip"></div>
        </div></div>
        <div class="card"><div class="strip">
          <div class="lbl">📊 كل الضربات <span class="cnt"><span id="resN">0</span> جولة</span></div>
          <div class="sScroll" id="logStrip"></div>
        </div></div>
        <div class="card">
          <div style="font-size:12px;color:var(--gold);font-weight:700;margin-bottom:6px">⏳ غياب الفواكه <span style="font-size:9px;color:var(--dim);font-weight:400">كم جولة ما جت · أقصى غياب</span></div>
          <div class="absGrid" id="absGrid"></div>
        </div>
        <div class="card">
          <div class="row">
            <button class="btn small ghost" id="expAll">⬇ تصدير الكل</button>
            <button class="btn small ghost" id="clrLog">مسح السجل</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- استيراد -->
  <div class="card" id="importCard">
    <div class="row">
      <button class="btn small ghost" id="impBtn">⬆ استيراد إعداد محفوظ</button>
      <input type="file" id="impFile" accept=".json" style="display:none">
      <span class="mini">لو عندك ملف مصدّر من قبل — يوفّر عليك كل المراحل</span>
    </div>
  </div>
</div>

<script>
const FRUITS=[
 {id:'apple',em:'🍎',name:'تفاح',m:5},{id:'melon',em:'🍉',name:'بطيخ',m:45},{id:'cherry',em:'🍒',name:'كرز',m:25},
 {id:'banana',em:'🍌',name:'موز',m:5},{id:'grape',em:'🍇',name:'عنب',m:15},{id:'orange',em:'🍊',name:'برتقال',m:5},
 {id:'mango',em:'🥭',name:'مانجو',m:5},{id:'pine',em:'🍍',name:'أناناس',m:10}];
const F=Object.fromEntries(FRUITS.map(f=>[f.id,f]));
const GRID=[['apple','melon','cherry'],['banana',null,'grape'],['orange','mango','pine']];
const opp=id=>{for(let r=0;r<3;r++)for(let c=0;c<3;c++)if(GRID[r][c]===id)return GRID[2-r][2-c];return null};
const CELLS=[];for(let r=0;r<3;r++)for(let c=0;c<3;c++)if(GRID[r][c])CELLS.push({r,c,id:GRID[r][c]});
const SHP={
 apple:'<circle cx="12" cy="14" r="8" fill="#ff2b2b" stroke="#6d0000" stroke-width="1.2"/><rect x="11.2" y="3.5" width="1.8" height="5" rx=".9" fill="#7a4a21"/><ellipse cx="15.8" cy="5.2" rx="3" ry="1.6" fill="#3ddc84" transform="rotate(28 15.8 5.2)"/>',
 melon:'<path d="M3 9 A9 9 0 0 1 21 9 L12 21 Z" fill="#ff4d5e" stroke="#0a7a3d"/><path d="M3 9 A9 9 0 0 1 21 9" fill="none" stroke="#0a9a4d" stroke-width="3.4"/><circle cx="10" cy="11" r="1" fill="#222"/><circle cx="14.5" cy="10.5" r="1" fill="#222"/><circle cx="12" cy="14.5" r="1" fill="#222"/>',
 cherry:'<path d="M12 3 C10.5 7 8.5 9 7.3 12 M12 3 C13.5 7 15.5 9 16.7 12" stroke="#5a7a1a" stroke-width="1.6" fill="none"/><ellipse cx="13" cy="3.6" rx="3" ry="1.5" fill="#3ddc84"/><circle cx="7" cy="15.5" r="4.6" fill="#e11d3c" stroke="#5a0010"/><circle cx="17" cy="15.5" r="4.6" fill="#b1002e" stroke="#5a0010"/>',
 banana:'<path d="M4.5 5.5 C4.5 14 10 19.5 19.5 19.5 C21 20.5 18.5 22 15.5 22 C7.5 22 2 16 2 8.5 C2 5.8 3.8 4.3 4.5 5.5 Z" fill="#ffe14d" stroke="#8a6d00"/><circle cx="4.4" cy="5.6" r="1.2" fill="#7a4a21"/><circle cx="20" cy="20" r="1" fill="#7a4a21"/>',
 grape:'<rect x="11.2" y="2.5" width="1.6" height="4" rx=".8" fill="#7a4a21"/><circle cx="12" cy="8" r="3.1" fill="#a55eea" stroke="#4a1a7a"/><circle cx="8.4" cy="12" r="3.1" fill="#9a4ae0" stroke="#4a1a7a"/><circle cx="15.6" cy="12" r="3.1" fill="#9a4ae0" stroke="#4a1a7a"/><circle cx="10" cy="16.5" r="3.1" fill="#8a3ad0" stroke="#4a1a7a"/><circle cx="14" cy="16.5" r="3.1" fill="#8a3ad0" stroke="#4a1a7a"/><circle cx="12" cy="20.4" r="2.9" fill="#7a2ac0" stroke="#4a1a7a"/>',
 orange:'<circle cx="12" cy="13" r="9" fill="#ff8a1e" stroke="#b34700" stroke-width="1.2"/><circle cx="12" cy="13" r="6.3" fill="#ffd9a6"/><line x1="12" y1="6.7" x2="12" y2="19.3" stroke="#ff7a00" stroke-width="1.4"/><line x1="12" y1="6.7" x2="12" y2="19.3" stroke="#ff7a00" stroke-width="1.4" transform="rotate(60 12 13)"/><line x1="12" y1="6.7" x2="12" y2="19.3" stroke="#ff7a00" stroke-width="1.4" transform="rotate(120 12 13)"/><circle cx="12" cy="13" r="1.4" fill="#ff7a00"/>',
 mango:'<ellipse cx="12" cy="13.5" rx="8.6" ry="6.4" transform="rotate(-24 12 13.5)" fill="#ffb020" stroke="#9a5c00" stroke-width="1.2"/><ellipse cx="8.6" cy="10.4" rx="3.6" ry="2.4" transform="rotate(-24 8.6 10.4)" fill="#ff5e3a" opacity=".85"/><path d="M17.5 6.5 C19.5 5 21.5 5.5 21.5 5.5 C21 7.5 19 8.3 17.5 7.8 Z" fill="#0a9a4d"/>',
 pine:'<path d="M12 1.5 L9 6.5 M12 1.5 L12 6.5 M12 1.5 L15 6.5" stroke="#0a9a4d" stroke-width="1.8" fill="none"/><ellipse cx="12" cy="15" rx="6.6" ry="8" fill="#f5c451" stroke="#8a6a1a" stroke-width="1.2"/><line x1="6.5" y1="10.5" x2="17.5" y2="19.5" stroke="#c8922e"/><line x1="6" y1="14.5" x2="15" y2="21.8" stroke="#c8922e"/><line x1="8.5" y1="8.6" x2="18" y2="15.8" stroke="#c8922e"/><line x1="17.5" y1="10.5" x2="6.5" y2="19.5" stroke="#c8922e"/><line x1="18" y1="14.5" x2="9" y2="21.8" stroke="#c8922e"/><line x1="15.5" y1="8.6" x2="6" y2="15.8" stroke="#c8922e"/>'
};
const FSVG=(id,s)=>'<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" style="display:block;flex:none">'+(SHP[id]||'')+'</svg>';
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
const fmt=n=>Math.round(n).toLocaleString('en');
const VN=24;

/* الحالة المحفوظة */
let CFG=JSON.parse(localStorage.getItem('mustafaPro_cfg')||'null')||{
  stage:1, gridBox:null, newBox:null,
  fruits:{},        // id -> vec (المرحلة ٢)
  handDone:{},      // id -> true (المرحلة ٣: أكّدنا اليد على هالفاكهة)
  resultsDone:{},   // id -> vec النتيجة (المرحلة ٤)
};
let DB=JSON.parse(localStorage.getItem('mustafaPro_db')||'null')||{results:[],t24:[],bankroll:100000,unit:1000};
function saveCFG(){localStorage.setItem('mustafaPro_cfg',JSON.stringify(CFG))}
function saveDB(){localStorage.setItem('mustafaPro_db',JSON.stringify(DB))}

const video=$('#video'),ovl=$('#ovl'),octx=ovl.getContext('2d');
const work=document.createElement('canvas'),wctx=work.getContext('2d',{willReadFrequently:true});
let stream=null,running=false,editGrid=false,editNew=false,grabbed=null,playing=false;

/* ===== الالتقاط ===== */
async function attach(st){stream=st;video.srcObject=st;await video.play();
  const fix=()=>{if(video.videoWidth){$('#camWrap').style.aspectRatio=video.videoWidth+'/'+video.videoHeight;setTimeout(fitOvl,80)}};
  video.onloadedmetadata=fix;fix();st.getVideoTracks()[0].onended=()=>{running=false};
  $('#camMsg').style.display='none';running=true;loop();refreshStage()}
$('#startCap').onclick=async()=>{if(!navigator.mediaDevices?.getDisplayMedia){$('#camMsg').firstElementChild.textContent='افتح من كروم/إيدج على الكمبيوتر';return}
  try{await attach(await navigator.mediaDevices.getDisplayMedia({video:{frameRate:15}}))}catch(e){$('#camMsg').firstElementChild.textContent=e.message}};
function fitOvl(){const r=$('#camWrap').getBoundingClientRect();ovl.width=r.width;ovl.height=r.height}
addEventListener('resize',fitOvl);setTimeout(fitOvl,300);

/* ===== سحب الشبكة/النتيجة ===== */
let drag=null;
ovl.addEventListener('pointerdown',e=>{
  const r=ovl.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
  const which=editGrid?'grid':editNew?'new':null;
  if(!which)return;
  const B=which==='grid'?(CFG.gridBox||(CFG.gridBox={x:.12,y:.25,w:.76,h:.5})):(CFG.newBox||(CFG.newBox={x:.72,y:.9,w:.12,h:.06}));
  const minW=which==='new'?.04:.2,minH=which==='new'?.03:.2;
  if(Math.hypot(x-(B.x+B.w),y-(B.y+B.h))<.06)drag={which,t:'s',minW,minH};
  else if(x>B.x-.04&&x<B.x+B.w+.04&&y>B.y-.04&&y<B.y+B.h+.04)drag={which,t:'m',dx:x-B.x,dy:y-B.y};
  if(drag)ovl.setPointerCapture(e.pointerId)});
ovl.addEventListener('pointermove',e=>{if(!drag)return;const r=ovl.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
  const B=drag.which==='grid'?CFG.gridBox:CFG.newBox;
  if(drag.t==='m'){B.x=Math.min(Math.max(x-drag.dx,0),1-B.w);B.y=Math.min(Math.max(y-drag.dy,0),1-B.h)}
  else{B.w=Math.min(Math.max(x-B.x,drag.minW),1-B.x);B.h=Math.min(Math.max(y-B.y,drag.minH),1-B.y)}});
ovl.addEventListener('pointerup',()=>{if(drag){saveCFG();refreshStage()}drag=null});

/* ===== أدوات الصورة ===== */
function cellRect(r,c){const B=CFG.gridBox;return {x:B.x+B.w*c/3,y:B.y+B.h*r/3,w:B.w/3,h:B.h/3}}
function tplOf(x,y,w,h){const W=work.width,H=work.height;const t=document.createElement('canvas');t.width=VN;t.height=VN;const g=t.getContext('2d',{willReadFrequently:true});
  const mx=w*W*.12,my=h*H*.12;g.drawImage(work,x*W+mx,y*H+my,w*W-2*mx,h*H-2*my,0,0,VN,VN);
  const d=g.getImageData(0,0,VN,VN).data,v=[];let mr=0,mg=0,mb=0;for(let i=0;i<d.length;i+=4){mr+=d[i];mg+=d[i+1];mb+=d[i+2]}const n=d.length/4;mr/=n;mg/=n;mb/=n;
  for(let i=0;i<d.length;i+=4)v.push(Math.round(d[i]-mr),Math.round(d[i+1]-mg),Math.round(d[i+2]-mb));return v}
function distV(a,b){let s=0;for(let i=0;i<a.length;i++){const d=a[i]-b[i];s+=d*d}return s/a.length}
function classifyResult(vec){const keys=Object.keys(CFG.resultsDone);if(!keys.length)return null;
  let best=null,bd=1e18,sec=1e18;
  for(const id of keys){const d=distV(vec,CFG.resultsDone[id]);if(d<bd){sec=bd;bd=d;best=id}else if(d<sec)sec=d}
  const conf=Math.max(0,Math.min(1,(sec-bd)/(sec+1)));
  return conf>0.06?best:null}

/* ===== قراءة العدّاد ===== */
const SEG=[[.5,.10],[.20,.28],[.80,.28],[.5,.5],[.20,.72],[.80,.72],[.5,.90]];
const SMAP={'1110111':0,'0010010':1,'1011101':2,'1011011':3,'0111010':4,'1101011':5,'1101111':6,'1010010':7,'1111111':8,'1111011':9};
function digitCore(){if(!CFG.gridBox)return null;const B=CFG.gridBox,cx=B.x+B.w/3,cy=B.y+B.h/3,cw=B.w/3,ch=B.h/3,W=work.width,H=work.height;
  const bx=Math.round((cx+cw*.18)*W),by=Math.round((cy+ch*.18)*H),bw=Math.round(cw*.64*W),bh=Math.round(ch*.64*H);if(bw<8||bh<8)return null;
  const img=wctx.getImageData(bx,by,bw,bh),d=img.data;const mask=new Uint8Array(bw*bh);let cnt=0,blue=0,x1=bw,x2=0,y1=bh,y2=0;
  for(let y=0;y<bh;y++)for(let x=0;x<bw;x++){const i=(y*bw+x)*4,r=d[i],g=d[i+1],b=d[i+2];
    if(r>120&&g>110&&(r-b)>25&&(g-b)>15){mask[y*bw+x]=1;cnt++;if(x<x1)x1=x;if(x>x2)x2=x;if(y<y1)y1=y;if(y>y2)y2=y}else if(b>90&&b>r+15&&b>g)blue++}
  const tot=bw*bh;if(cnt<10||cnt/tot>0.62||blue/tot<0.07)return null;return{mask,bw,bh,x1,y1,x2,y2}}
function readSegD(m,bw,bh,x0,y0,w,hh){let b='';for(const[sx,sy]of SEG){const px=Math.round(x0+w*sx),py=Math.round(y0+hh*sy),rx=Math.max(1,Math.round(w*.1)),ry=Math.max(1,Math.round(hh*.06));
  let on=0,n=0;for(let dy=-ry;dy<=ry;dy++)for(let dx=-rx;dx<=rx;dx++){const yy=py+dy,xx=px+dx;if(yy>=0&&yy<bh&&xx>=0&&xx<bw){n++;if(m[yy*bw+xx])on++}}b+=(n&&on/n>0.3)?'1':'0'}
  if(b==='0000000')return null;if(b in SMAP)return SMAP[b];let bd=9,bv=null;for(const k in SMAP){let dd=0;for(let i=0;i<7;i++)if(k[i]!==b[i])dd++;if(dd<bd){bd=dd;bv=SMAP[k]}}return bd<=1?bv:null}
function readTimer(){const core=digitCore();if(!core)return null;const{mask,bw,bh,x1,y1,x2,y2}=core;const w=x2-x1,hh=y2-y1;if(w<5||hh<9)return null;
  if(w>hh*0.62){const half=w/2;const d1=readSegD(mask,bw,bh,x1,y1,half*.92,hh),d2=readSegD(mask,bw,bh,x1+half*1.08,y1,half*.92,hh);
    if(d1===null&&d2===null)return null;if(d1===null)return d2;return d1*10+(d2===null?0:d2)}
  return readSegD(mask,bw,bh,x1,y1,w,hh)}

function findHandCell(){ // الخانة الأبعد عن مرجعها النظيف = عليها اليد (+ نستأنس بلقطات المرحلة ٣)
  if(Object.keys(CFG.fruits).length<8)return null;
  let best=null,bs=-1e18;
  for(const cell of CELLS){const cl=cellRect(cell.r,cell.c);const cur=tplOf(cl.x,cl.y,cl.w,cl.h);
    let score=distV(cur,CFG.fruits[cell.id]);
    if(CFG.handVec&&CFG.handVec[cell.id])score-=distV(cur,CFG.handVec[cell.id]);
    if(score>bs){bs=score;best=cell}}
  return best}

const STAGES=[

    $('#stageMsg').className='stageMsg'+(n>=8?' ok':'');
  }
  else if(CFG.stage===3){

    $('#stageMsg').innerHTML=n>=8?'✅ أكّدنا اليد على الثمانية — أكّد المرحلة':

    $('#stageMsg').className='stageMsg'+(n>=8?' ok':' hot');

    $('#bNew').onclick=()=>{editNew=!editNew;editGrid=false;if(editNew&&!CFG.newBox)CFG.newBox={x:.72,y:.9,w:.12,h:.06};refreshStage()};
    const remaining=FRUITS.filter(f=>!CFG.resultsDone[f.id]).map(f=>f.em).join(' ');
    $('#stageMsg').innerHTML=!CFG.newBox?'حدّد مربع النتيجة (فاكهة NEW) أولاً':
      n>=8?'✅ حفظنا الثمان نتائج — أكّد المرحلة':
      'كل ما تطلع نتيجة جديدة ألتقطها وأسألك.<br>باقي: '+remaining+' ('+n+'/8)';

$('#confirmStage').onclick=()=>{if(!STAGES[CFG.stage-1].check())return;CFG.stage++;saveCFG();editGrid=false;editNew=false;$('#pop').style.display='none';refreshStage()};

function renderFr8(){

  if(CFG.stage===3){ // نعرض حالة التأكيد
    $('#fr8').innerHTML=FRUITS.map(f=>`<div class="f8 ${CFG.handDone[f.id]?'ok':''}"><div style="font-size:20px;padding:4px 0;border:1.5px solid ${CFG.handDone[f.id]?'var(--green)':'var(--line)'};border-radius:6px;background:#000">${f.em}</div><span>${f.name}${CFG.handDone[f.id]?' ✓':''}</span></div>`).join('');
    return}
  $('#fr8').innerHTML=FRUITS.map(f=>`<div class="f8 ${src&&src[f.id]?'ok':''}"><canvas width="${VN}" height="${VN}" id="f8_${f.id}"></canvas><span>${f.name}${src&&src[f.id]?' ✓':''}</span></div>`).join('');
  if(src)for(const f of FRUITS){if(!src[f.id])continue;const cv=$('#f8_'+f.id);if(!cv)continue;const g=cv.getContext('2d');const im=g.createImageData(VN,VN);const t=src[f.id];
    for(let i=0,j=0;i<t.length;i+=3,j+=4){im.data[j]=Math.max(0,Math.min(255,t[i]+128));im.data[j+1]=Math.max(0,Math.min(255,t[i+1]+128));im.data[j+2]=Math.max(0,Math.min(255,t[i+2]+128));im.data[j+3]=255}g.putImageData(im,0,0)}
}

/* ===== المرحلة ٢: تدريب الفواكه ===== */
let fq=[],fqi=0;
function startFruitTrain(){if(!running||!CFG.gridBox)return;
  fq=CELLS.filter(c=>!CFG.fruits[c.id]);fqi=0;nextFruit()}
function nextFruit(){if(fqi>=fq.length){$('#pop').style.display='none';refreshStage();return}
  work.width=video.videoWidth;work.height=video.videoHeight;wctx.drawImage(video,0,0);
  const cell=fq[fqi];grabbed={type:'fruit',vec:tplOf(...Object.values(cellRect(cell.r,cell.c)))};
  showPop(cellRect(cell.r,cell.c),'خانة '+(fqi+1)+'/'+fq.length+' — وش الفاكهة؟',false)}
function showPop(cl,q,full){
  const W=work.width,H=work.height;
  const pi=$('#popImg');
  if(full){pi.classList.remove('small');pi.width=280;pi.height=Math.round(280*cl.h*H/(cl.w*W));
    const g=pi.getContext('2d');g.imageSmoothingEnabled=false;g.clearRect(0,0,pi.width,pi.height);
    g.drawImage(work,cl.x*W,cl.y*H,cl.w*W,cl.h*H,0,0,pi.width,pi.height)}
  else{pi.classList.add('small');pi.width=88;pi.height=88;
    const mx=cl.w*W*.12,my=cl.h*H*.12;const g=pi.getContext('2d');g.imageSmoothingEnabled=false;g.clearRect(0,0,88,88);
    g.drawImage(work,cl.x*W+mx,cl.y*H+my,cl.w*W-2*mx,cl.h*H-2*my,0,0,88,88)}
  $('#popQ').textContent=q;
  $('#pop').style.display='block';buildPopBtns();
}
function buildPopBtns(){
  const doneSet=grabbed?.type==='hand'?CFG.handDone:grabbed?.type==='result'?CFG.resultsDone:CFG.fruits;
  $('#popBtns').innerHTML=FRUITS.map(f=>`<button data-id="${f.id}" class="${doneSet[f.id]?'did':''}"><span class="em">${f.em}</span><span class="nm">${f.name}${doneSet[f.id]?' ✓':''}</span></button>`).join('');
  $$('#popBtns button').forEach(b=>b.onclick=()=>answerPop(b.dataset.id))}
function answerPop(id){
  if(!grabbed)return;
  if(grabbed.type==='fruit'){CFG.fruits[id]=grabbed.vec;fqi++;saveCFG();renderFr8();nextFruit();return}
  if(grabbed.type==='hand'){CFG.handDone[id]=true;CFG.handVec=CFG.handVec||{};if(grabbed.cellVecs&&grabbed.cellVecs[id])CFG.handVec[id]=grabbed.cellVecs[id];saveCFG();$('#pop').style.display='none';grabbed=null;refreshStage();return}
  if(grabbed.type==='result'){CFG.resultsDone[id]=grabbed.vec;saveCFG();$('#pop').style.display='none';grabbed=null;refreshStage();return}
}
$('#popSkip').onclick=()=>{grabbed=null;$('#pop').style.display='none';if(fq.length&&fqi<fq.length){fqi++;nextFruit()}};

/* ===== اللوب ===== */
let curT=null,armed=true,t24F=null,t24O=null,resBuf=[],lastResVec=null,seq='wait24',old24Id=null,jumpSeen=false,jumpAt=0,roundEnd=false,base=null,inTrans=false,need24Vec=false;
function loop(){if(!running)return;requestAnimationFrame(loop);
  if(video.videoWidth===0)return;work.width=video.videoWidth;work.height=video.videoHeight;wctx.drawImage(video,0,0);
  octx.clearRect(0,0,ovl.width,ovl.height);drawBoxes();
  if(!CFG.gridBox)return;
  const t=readTimer();lastTimerOk=(t!==null);
  const cT=t===null?'--':(t<10?'0'+t:t);$('#cVal').textContent=cT;$('#cVal2').textContent=cT;

  if(t!==null){
    if(curT!==null&&t>curT+5){armed=true;
      if(seq==='waitres'&&!jumpSeen){jumpSeen=true;jumpAt=performance.now()}} // بدأت جولة = الشريط اكتمل أكيد
    if(t===0&&seq==='waitres')roundEnd=true;
    curT=t;
    if(armed&&t===24){armed=false;
      if(CFG.stage===3){ // مرحلة تأكيد اليد: لقطة كاملة + نحفظ خانات اللحظة
        work.width=video.videoWidth;work.height=video.videoHeight;wctx.drawImage(video,0,0);
        const cv={};for(const cell of CELLS){const cl=cellRect(cell.r,cell.c);cv[cell.id]=tplOf(cl.x,cl.y,cl.w,cl.h)}
        grabbed={type:'hand',cellVecs:cv};
        showPop(CFG.gridBox,'🎯 الـ24! هذي الشبكة كاملة — اليد على أي فاكهة؟',true);
      }else if(playing){ // ① الـ24: نقفل أي دورة قديمة عالقة ونبدأ نظيف
        if(seq!=='wait24'){if(DB.t24[0]&&DB.t24[0].pending){delete DB.t24[0].pending;saveDB()}t24F=null;t24O=null;resBuf.length=0}
        const hc=findHandCell();
        if(hc){t24F=GRID[hc.r][hc.c];t24O=opp(t24F);
          DB.t24.unshift({f24:t24F,opp:t24O,res:null,hit:null,pending:true,at:Date.now()});saveDB();renderLog();
          need24Vec=true;jumpSeen=false;roundEnd=false;inTrans=false;base=null;seq='waitres'; // ② نراقب أي تغيّر بالشريط لحظياً
          $('#playMsg').className='stageMsg hot';$('#playMsg').innerHTML='🎯 الـ24 على '+F[t24F].name+' + المقابل '+(t24O?F[t24O].name:'')+' — ننتظر النتيجة'}}
    }
    if(playing&&seq==='wait24'&&t>24){$('#playMsg').className='stageMsg';$('#playMsg').textContent='العدّاد '+t+' — بانتظار الـ24'}
  }else if(curT!==null&&curT<=3&&seq==='waitres')roundEnd=true; // وصل الصفر
  // المرحلة ٤ + اللعب: النتيجة
  if(CFG.newBox&&(CFG.stage===4||playing)){
    const vec=tplOf(CFG.newBox.x,CFG.newBox.y,CFG.newBox.w,CFG.newBox.h);
    if(CFG.stage===4&&!grabbed){ // تعليم النتائج: لو تغيّرت النتيجة، اسأل
      if(lastResVec===null||distV(vec,lastResVec)>800){lastResVec=vec;
        grabbed={type:'result',vec};
        showPop(CFG.newBox,'نتيجة جديدة ظهرت — وش هي؟',false)}
    }
    if(playing){
      if(need24Vec){base=vec;old24Id=classifyResult(vec);need24Vec=false} // بصمة وهوية اللي معروض قبل النتيجة
      if(seq==='waitres'){ // ③ راصد لحظي: أي تغيّر بالشريط ننقض عليه
        const d=base?distV(vec,base):1e9;
        if(!inTrans&&d>600){inTrans=true;resBuf.length=0} // بدأ التغيّر
        if(inTrans){
          const id=classifyResult(vec);
          if(id){resBuf.push(id);if(resBuf.length>4)resBuf.shift();
            if(resBuf.length===4&&resBuf.every(x=>x===id)){
              if(id!==old24Id||roundEnd||jumpSeen)finalizeResult(id); // جديدة فعلاً (أو تكرار مؤكد بنهاية الجولة)
              else{inTrans=false;resBuf.length=0} // وميض كاذب رجع لنفس القديمة قبل نهاية الجولة
            }}
          else resBuf.length=0;
        }else if(jumpSeen&&performance.now()-jumpAt>1500){ // احتياط: جولة جديدة بدأت وما مسكنا الحركة
          const id=classifyResult(vec);
          if(id){resBuf.push(id);if(resBuf.length>4)resBuf.shift();
            if(resBuf.length===4&&resBuf.every(x=>x===id))finalizeResult(id)}
          else resBuf.length=0;
        }
      }
    }
  }
}
function finalizeResult(id){
  if(DB.t24[0]&&DB.t24[0].pending){DB.t24[0].res=id;DB.t24[0].hit=(id===t24F||id===t24O);delete DB.t24[0].pending}
  DB.results.unshift({id,at:Date.now()});if(DB.results.length>1000000)DB.results.pop(); // ④ تحت في كل الضربات
  t24F=null;t24O=null;old24Id=null;jumpSeen=false;roundEnd=false;inTrans=false;base=null;resBuf.length=0;
  seq='wait24'; // ⑤ قفل — ننتظر 24 جديدة
  $('#playMsg').className='stageMsg';$('#playMsg').textContent='✔ سُجّلت — بانتظار الـ24 التالية';
  renderLog();saveDB()}

function drawBoxes(){
  if(CFG.gridBox){const B=CFG.gridBox,x=B.x*ovl.width,y=B.y*ovl.height,w=B.w*ovl.width,h=B.h*ovl.height;
    octx.strokeStyle=editGrid?'#4a9eda':'#e0a92e';octx.lineWidth=editGrid?2.5:1.5;octx.setLineDash(editGrid?[6,4]:[]);octx.strokeRect(x,y,w,h);octx.setLineDash([]);
    octx.strokeStyle='rgba(224,169,46,.3)';octx.lineWidth=1;
    for(let i=1;i<3;i++){octx.beginPath();octx.moveTo(x+w*i/3,y);octx.lineTo(x+w*i/3,y+h);octx.stroke();octx.beginPath();octx.moveTo(x,y+h*i/3);octx.lineTo(x+w,y+h*i/3);octx.stroke()}
    if(editGrid){octx.fillStyle='#4a9eda';octx.beginPath();octx.arc(x+w,y+h,8,0,7);octx.fill()}}
  if(CFG.newBox){const B=CFG.newBox,x=B.x*ovl.width,y=B.y*ovl.height,w=B.w*ovl.width,h=B.h*ovl.height;
    octx.strokeStyle=editNew?'#3ec96a':'#e0a92e';octx.lineWidth=editNew?2.5:1.5;octx.setLineDash(editNew?[6,4]:[]);octx.strokeRect(x,y,w,h);octx.setLineDash([]);
    octx.fillStyle=editNew?'#3ec96a':'#e0a92e';octx.font='700 10px Rubik';octx.fillText('النتيجة',x+2,y-4);
    if(editNew){octx.fillStyle='#3ec96a';octx.beginPath();octx.arc(x+w,y+h,7,0,7);octx.fill()}}
}

function renderLog(){
  const N=DB.results.length;
  $('#resN').textContent=N;
  const done=DB.t24.filter(e=>e.hit!==null);
  $('#hitN').textContent=done.filter(e=>e.hit).length;
  $('#accN').textContent=done.length?Math.round(done.filter(e=>e.hit).length/done.length*100):0;
  // السجل الموحّد: تكرار فوق، (✔/✘ + زوج الـ24 لو فيه)، النتيجة كبيرة، رقم الجولة تحت
  // سجل الـ24 لحاله: ✔/✘ + الزوج (الفاكهة+المقابل) + وش جاء
  $('#dualStrip').innerHTML=DB.t24.slice(0,300).map(e=>{
    const pend=e.pending||e.res===null;
    const mk=pend?'<div class="mk" style="color:var(--gold)">⏳</div>':`<div class="mk" style="color:${e.hit?'var(--blue)':'var(--red)'}">${e.hit?'✔':'✘'}</div>`;
    const res=e.res?FSVG(e.res,24):'<div style="width:24px;height:24px;display:flex;align-items:center;justify-content:center;color:var(--dim);font-weight:900">؟</div>';
    return `<div class="dcol ${pend?'':(e.hit?'hit':'miss')}"${pend?' style="border-color:var(--gold)"':''}>${mk}<div class="s24" style="display:flex;gap:1px">${FSVG(e.f24,13)}${e.opp?FSVG(e.opp,13):''}</div><div class="sr">${res}</div></div>`;
  }).join('')||'<span class="mini" style="padding:6px">—</span>';
  // كل الضربات: تكرار الزوج فوق، الفاكهة بلونها، رقم الجولة تحت
  // التكرار: الضربة من نفس زوج اللي قبلها مباشرة (نفسها أو مقابلها).
  // عند التكرار: نقفل السلسلة بمربع ذهبي على الفاكهة الأولى، واللي بعدها تبدأ من 1
  const num=new Array(N),boxed=new Array(N).fill(false);
  for(let k=N-1;k>=0;k--){
    if(k===N-1){num[k]=1;continue}
    const cur=DB.results[k].id,prev=DB.results[k+1].id;
    if(cur===prev||cur===opp(prev)){boxed[k+1]=true;num[k]=1}
    else num[k]=num[k+1]+1;
  }
  $('#logStrip').innerHTML=DB.results.slice(0,300).map((r,i)=>{
    const srBox=boxed[i]?' style="border:2px solid var(--gold);border-radius:7px;padding:1px"':'';
    return `<div class="dcol"><div class="rep">${num[i]}</div><div class="sr"${srBox}>${FSVG(r.id,24)}</div><div class="rnd">${F[r.id].name}</div></div>`;
  }).join('')||'<span class="mini" style="padding:6px">—</span>';
  // غياب الفواكه: الحالي + الأقصى
  $('#absGrid').innerHTML=FRUITS.map(f=>{
    let cur=null;for(let i=0;i<N;i++){if(DB.results[i].id===f.id){cur=i;break}}
    const curG=cur===null?N:cur;
    let mx=curG,prev=null;
    for(let i=N-1;i>=0;i--){if(DB.results[i].id===f.id){const pos=N-1-i;
      if(prev!==null){const g=pos-prev-1;if(g>mx)mx=g}prev=pos}}
    return `<div class="ab"><div style="display:flex;justify-content:center">${FSVG(f.id,16)}</div><div class="nm">${f.name}</div><div class="g">${N?curG:'—'}</div><div class="mx">أقصى ${N?mx:'—'}</div></div>`;
  }).join('');
}

/* ===== تصدير/استيراد ===== */
function doExport(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({CFG,DB})],{type:'application/json'}));a.download='mustafa_setup.json';a.click()}
$('#expBtn').onclick=doExport;$('#expAll').onclick=doExport;
$('#impBtn').onclick=()=>$('#impFile').click();
$('#impFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);
  if(d.CFG){CFG=d.CFG;saveCFG()}if(d.DB){DB=d.DB;saveDB()}
  refreshStage();alert('تم الاستيراد — '+(CFG.stage>=5?'الإعداد كامل، جاهز للعب':'أكمل من المرحلة '+CFG.stage))}catch(e){alert('ملف غير صالح')}};r.readAsText(f)};
$('#clrLog').onclick=()=>{if(confirm('مسح سجل اللعب؟ (الإعداد يبقى)')){DB.results=[];DB.t24=[];t24F=null;t24O=null;seq='wait24';resBuf.length=0;saveDB();renderLog()}};

/* إقلاع */
refreshStage();
</script>
