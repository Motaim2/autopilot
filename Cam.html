<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>العدسة الذكية — بث حي</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0D10;
    --panel:#14181D;
    --panel2:#1B2128;
    --line:#2A323B;
    --amber:#FFB454;
    --amber-dim:rgba(255,180,84,.35);
    --text:#EDEFF2;
    --muted:#8B96A3;
    --danger:#FF6B6B;
    --live:#FF5252;
    --ok:#7ED9A7;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{background:#000;color:var(--text);font-family:'IBM Plex Sans Arabic',sans-serif}

  /* ===== الكاميرا ملء الشاشة ===== */
  #stage{position:fixed;inset:0;background:#000;overflow:hidden}
  #video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}

  /* طبقة العلامات تطابق مساحة الفيديو الفعلية */
  #markerLayer{position:absolute;z-index:5;pointer-events:none}
  #markerLayer .marker{pointer-events:auto}

  /* ===== الهيدر ===== */
  header{
    position:fixed;top:0;left:0;right:0;z-index:20;
    padding:calc(env(safe-area-inset-top, 0px) + 12px) 18px 22px;
    display:flex;align-items:center;justify-content:space-between;
    background:linear-gradient(to bottom, rgba(0,0,0,.72), transparent);
    pointer-events:none;
  }
  header > *{pointer-events:auto}
  .brand{display:flex;align-items:center;gap:10px}
  .reticle{width:24px;height:24px;border:2px solid var(--amber);border-radius:50%;position:relative;flex-shrink:0}
  .reticle::after{content:'';position:absolute;inset:7px;background:var(--amber);border-radius:50%;animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.6);opacity:.5}}
  h1{font-size:16px;font-weight:700;letter-spacing:.5px;text-shadow:0 1px 6px rgba(0,0,0,.6)}
  .status{
    font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);
    padding:4px 10px;border:1px solid rgba(255,255,255,.2);border-radius:20px;
    direction:ltr;background:rgba(0,0,0,.45);backdrop-filter:blur(6px);
    display:flex;align-items:center;gap:6px;
  }
  .status .rec{width:7px;height:7px;border-radius:50%;background:var(--muted)}
  .status.live{color:var(--live);border-color:rgba(255,82,82,.5)}
  .status.live .rec{background:var(--live);animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.25}}
  .status.think .rec{background:var(--amber);animation:blink .5s infinite}
  .status.think{color:var(--amber);border-color:rgba(255,180,84,.5)}

  /* الزوايا */
  .corner{position:absolute;width:28px;height:28px;border-color:var(--amber);border-style:solid;border-width:0;opacity:.7;pointer-events:none;z-index:6}
  .c-tl{top:calc(env(safe-area-inset-top,0px) + 62px);right:14px;border-top-width:2px;border-right-width:2px;border-radius:0 6px 0 0}
  .c-tr{top:calc(env(safe-area-inset-top,0px) + 62px);left:14px;border-top-width:2px;border-left-width:2px;border-radius:6px 0 0 0}
  .c-bl{bottom:150px;right:14px;border-bottom-width:2px;border-right-width:2px;border-radius:0 0 6px 0}
  .c-br{bottom:150px;left:14px;border-bottom-width:2px;border-left-width:2px;border-radius:0 0 0 6px}

  /* شعاع المسح أثناء التحليل */
  #beam{
    position:absolute;left:0;right:0;height:2px;top:0;
    background:linear-gradient(90deg,transparent,var(--amber),transparent);
    box-shadow:0 0 18px 4px var(--amber-dim);
    display:none;z-index:7;opacity:.55;
  }
  #stage.live #beam{display:block;animation:sweep 2.2s ease-in-out infinite}
  @keyframes sweep{0%{top:0}50%{top:calc(100% - 2px)}100%{top:0}}

  /* ===== العلامات الحية ===== */
  .marker{
    position:absolute;z-index:5;transform:translate(-50%,-50%);cursor:pointer;
    transition:left .8s cubic-bezier(.3,.8,.3,1), top .8s cubic-bezier(.3,.8,.3,1), opacity .4s;
  }
  .marker.gone{opacity:0;pointer-events:none}
  .dot{
    width:15px;height:15px;border-radius:50%;
    background:var(--amber);
    border:2px solid #fff;
    box-shadow:0 0 0 4px var(--amber-dim),0 0 16px var(--amber);
    animation:dotpop .35s ease;
  }
  @keyframes dotpop{from{transform:scale(0)}to{transform:scale(1)}}
  .lead{position:absolute;top:50%;height:2px;background:var(--amber);width:32px}
  .lead.left{right:100%;margin-right:5px}
  .lead.right{left:100%;margin-left:5px}
  .tag{
    position:absolute;top:50%;transform:translateY(-50%);
    white-space:nowrap;
    background:rgba(11,13,16,.85);
    border:1px solid var(--amber);
    color:var(--text);
    font-size:12.5px;font-weight:500;
    padding:5px 10px;border-radius:6px;
    backdrop-filter:blur(4px);
    max-width:46vw;overflow:hidden;text-overflow:ellipsis;
  }
  .tag.left{right:100%;margin-right:39px}
  .tag.right{left:100%;margin-left:39px}
  .tag small{display:block;font-size:10.5px;color:var(--muted);font-weight:400;max-width:100%;overflow:hidden;text-overflow:ellipsis}

  #hint{
    position:fixed;bottom:132px;left:50%;transform:translateX(-50%);
    background:rgba(11,13,16,.75);border:1px solid rgba(255,255,255,.15);
    font-size:11.5px;color:#cfd6dd;padding:6px 16px;border-radius:20px;
    z-index:15;white-space:nowrap;backdrop-filter:blur(6px);
    transition:opacity .4s;
  }
  #hint.hide{opacity:0;pointer-events:none}

  /* ===== أزرار التحكم ===== */
  #controls{
    position:fixed;bottom:0;left:0;right:0;z-index:20;
    display:flex;align-items:center;justify-content:center;gap:26px;
    padding:18px 18px calc(env(safe-area-inset-bottom, 0px) + 22px);
    background:linear-gradient(to top, rgba(0,0,0,.72), transparent);
  }
  .side-btn{
    width:50px;height:50px;border-radius:50%;
    background:rgba(20,24,29,.7);border:1px solid rgba(255,255,255,.2);
    color:#dfe4e9;font-size:20px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    transition:.2s;backdrop-filter:blur(8px);
  }
  .side-btn:active{transform:scale(.92)}
  #liveBtn{
    width:76px;height:76px;border-radius:50%;
    background:var(--amber);
    border:4px solid #fff;
    box-shadow:0 0 0 3px var(--amber-dim),0 6px 24px rgba(255,180,84,.4);
    cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    transition:.15s;
  }
  #liveBtn:active{transform:scale(.93)}
  #liveBtn .lbl{font-size:12px;font-weight:700;color:#1a1205}
  #liveBtn.on{
    background:var(--live);
    box-shadow:0 0 0 3px rgba(255,82,82,.35),0 6px 24px rgba(255,82,82,.45);
    animation:livering 1.6s infinite;
  }
  #liveBtn.on .lbl{color:#fff}
  @keyframes livering{
    0%{box-shadow:0 0 0 3px rgba(255,82,82,.4),0 6px 24px rgba(255,82,82,.45)}
    50%{box-shadow:0 0 0 9px rgba(255,82,82,.12),0 6px 24px rgba(255,82,82,.45)}
    100%{box-shadow:0 0 0 3px rgba(255,82,82,.4),0 6px 24px rgba(255,82,82,.45)}
  }

  /* ===== لوحة التفاصيل المنسدلة ===== */
  #sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:30;
    background:rgba(11,13,16,.94);backdrop-filter:blur(14px);
    border-top:1px solid var(--line);
    border-radius:20px 20px 0 0;
    max-height:52dvh;
    transform:translateY(110%);
    transition:transform .35s cubic-bezier(.2,.9,.3,1);
    display:flex;flex-direction:column;
  }
  #sheet.open{transform:translateY(0)}
  #sheetHead{
    position:relative;display:flex;align-items:center;justify-content:space-between;
    padding:14px 18px 8px;flex-shrink:0;cursor:pointer;
  }
  #sheetHead .grab{position:absolute;top:7px;left:50%;transform:translateX(-50%);width:42px;height:4px;border-radius:4px;background:var(--line)}
  #sheetTitle{font-size:13px;font-weight:700;color:var(--amber)}
  #sheetClose{background:none;border:none;color:var(--muted);font-size:17px;cursor:pointer;padding:4px 8px}
  #sheetBody{overflow-y:auto;padding:4px 16px 26px;display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch}

  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:14px 16px;animation:rise .35s ease both;flex-shrink:0;
  }
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .card.hi{border-color:var(--amber);box-shadow:0 0 0 3px var(--amber-dim)}
  .card-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .cdot{width:12px;height:12px;border-radius:50%;background:var(--amber);border:2px solid #fff;flex-shrink:0}
  .card h3{font-size:16px;font-weight:700}
  .card p{font-size:13.5px;color:var(--muted);line-height:1.7;margin-bottom:12px}
  .actions{display:flex;gap:8px}
  .actions a{
    flex:1;text-align:center;text-decoration:none;
    font-size:13px;font-weight:500;
    padding:9px 6px;border-radius:9px;transition:.15s;
  }
  .g-search{background:var(--amber);color:#1a1205}
  .g-img{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
  .actions a:active{transform:scale(.96)}

  #msg{
    position:fixed;top:calc(env(safe-area-inset-top,0px) + 64px);left:16px;right:16px;z-index:25;
    padding:12px 16px;border-radius:12px;
    font-size:13.5px;line-height:1.7;display:none;backdrop-filter:blur(8px);
  }
  #msg.err{display:block;background:rgba(60,15,15,.85);border:1px solid rgba(255,107,107,.45);color:#ffb3b3}
</style>
</head>
<body>

<div id="stage">
  <video id="video" autoplay playsinline muted></video>
  <div id="markerLayer"></div>
  <div class="corner c-tl"></div><div class="corner c-tr"></div>
  <div class="corner c-bl"></div><div class="corner c-br"></div>
  <div id="beam"></div>
</div>

<header>
  <div class="brand">
    <div class="reticle"></div>
    <h1>العدسة الذكية</h1>
  </div>
  <div class="status" id="camStatus"><span class="rec"></span><span id="statusTxt">OFF</span></div>
</header>

<div id="hint">اضغط الزر لبدء التعرف اللحظي</div>
<div id="msg"></div>

<div id="controls">
  <button class="side-btn" id="flipBtn" title="تبديل الكاميرا">⟳</button>
  <button id="liveBtn"><span class="lbl" id="liveLbl">تشغيل</span></button>
  <button class="side-btn" id="listBtn" title="قائمة الأشياء">☰</button>
</div>

<div id="sheet">
  <div id="sheetHead">
    <div class="grab"></div>
    <div id="sheetTitle">الأشياء المكتشفة</div>
    <button id="sheetClose">✕</button>
  </div>
  <div id="sheetBody"></div>
</div>

<script>
const video   = document.getElementById('video');
const stage   = document.getElementById('stage');
const layer   = document.getElementById('markerLayer');
const liveBtn = document.getElementById('liveBtn');
const liveLbl = document.getElementById('liveLbl');
const flipBtn = document.getElementById('flipBtn');
const listBtn = document.getElementById('listBtn');
const sheet     = document.getElementById('sheet');
const sheetBody = document.getElementById('sheetBody');
const sheetTitle= document.getElementById('sheetTitle');
const msg     = document.getElementById('msg');
const hint    = document.getElementById('hint');
const camStatus = document.getElementById('camStatus');
const statusTxt = document.getElementById('statusTxt');

let stream = null;
let facing = 'environment';
let imgW = 0, imgH = 0;
let liveOn = false;
let inFlight = false;
let cycle = 0;

/* الأشياء الحالية: key = اسم مُطبّع → {name, desc, query, x, y, el, cardEl, miss} */
const objects = new Map();

/* ---------- الكاميرا ---------- */
async function startCam(){
  stopCam();
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      video:{facingMode:facing, width:{ideal:1280}, height:{ideal:720}},
      audio:false
    });
    video.srcObject = stream;
    setStatus('READY','');
    showMsg('');
  }catch(e){
    setStatus('OFF','');
    showMsg('err','ما قدرت أفتح الكاميرا. تأكد من إعطاء إذن الكاميرا للصفحة ثم أعد المحاولة.');
  }
}
function stopCam(){ if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;} }
flipBtn.onclick = ()=>{facing = facing==='environment'?'user':'environment'; startCam();};

function setStatus(txt, mode){
  statusTxt.textContent = txt;
  camStatus.className = 'status' + (mode?(' '+mode):'');
}

/* ---------- مطابقة مساحة الفيديو (object-fit: cover) ---------- */
function coverBox(){
  const cw = stage.clientWidth, ch = stage.clientHeight;
  const iw = video.videoWidth||imgW, ih = video.videoHeight||imgH;
  if(!iw||!ih) return {x:0,y:0,w:cw,h:ch};
  const scale = Math.max(cw/iw, ch/ih);
  const w = iw*scale, h = ih*scale;
  return {x:(cw-w)/2, y:(ch-h)/2, w, h};
}
function syncLayer(){
  const b = coverBox();
  layer.style.left = b.x+'px'; layer.style.top = b.y+'px';
  layer.style.width = b.w+'px'; layer.style.height = b.h+'px';
}
window.addEventListener('resize', syncLayer);
video.addEventListener('loadedmetadata', syncLayer);

/* ---------- التقاط إطار ---------- */
function captureFrame(){
  const c = document.createElement('canvas');
  const w = Math.min(video.videoWidth, 768);
  const scale = w / video.videoWidth;
  c.width = w; c.height = Math.round(video.videoHeight*scale);
  c.getContext('2d').drawImage(video,0,0,c.width,c.height);
  imgW = video.videoWidth; imgH = video.videoHeight;
  return c.toDataURL('image/jpeg',0.7).split(',')[1];
}

/* ---------- Claude API ---------- */
async function askClaude(b64){
  const known = [...objects.values()].map(o=>o.name).slice(0,8).join('، ');
  const instruction =
`انظر لهذه الصورة من كاميرا حية وحدد الأشياء الواضحة فيها (من 1 إلى 5 أشياء رئيسية فقط).
${known ? 'في اللقطة السابقة كانت هذه الأشياء موجودة: ('+known+') — إذا ما زال أي منها ظاهراً استخدم نفس الاسم بالضبط لنفس الشيء.' : ''}
أجب فقط بمصفوفة JSON بدون أي نص إضافي وبدون Markdown بهذا الشكل:
[{"name":"اسم قصير بالعربي","desc":"وصف مختصر بالعربي جملة واحدة","query":"english google search query","x":50,"y":50}]
حيث x و y نسبة مئوية (0-100) لمركز الشيء: x من اليسار و y من الأعلى. كن دقيقاً في المواقع. إذا ما فيه شي واضح أرجع [].`;

  const response = await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      model:"claude-sonnet-4-6",
      max_tokens:1000,
      messages:[{role:"user",content:[
        {type:"image",source:{type:"base64",media_type:"image/jpeg",data:b64}},
        {type:"text",text:instruction}
      ]}]
    })
  });
  const data = await response.json();
  const text = (data.content||[]).filter(i=>i.type==='text').map(i=>i.text).join('\n');
  const clean = text.replace(/```json|```/g,'').trim();
  const start = clean.indexOf('['), end = clean.lastIndexOf(']');
  if(start===-1||end===-1) throw new Error('bad json');
  return JSON.parse(clean.slice(start,end+1));
}

/* ---------- تحديث العلامات لحظياً ---------- */
function normName(s){return String(s||'').trim().replace(/^ال/,'').replace(/\s+/g,' ');}
function esc(s){return String(s??'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));}

function applyDetections(items){
  const seen = new Set();

  items.forEach(it=>{
    if(!it || !it.name) return;
    const key = normName(it.name);
    if(seen.has(key)) return;
    seen.add(key);
    const x = Math.min(97,Math.max(3, +it.x||50));
    const y = Math.min(97,Math.max(3, +it.y||50));

    if(objects.has(key)){
      /* موجود: حرّك النقطة بسلاسة وحدّث الوصف */
      const o = objects.get(key);
      o.x=x; o.y=y; o.miss=0;
      o.desc = it.desc||o.desc; o.query = it.query||o.query;
      o.el.style.left = x+'%'; o.el.style.top = y+'%';
      o.el.classList.remove('gone');
      setSide(o.el, x);
      const d = o.el.querySelector('.tag small');
      if(d) d.textContent = o.desc;
    }else{
      /* جديد: أنشئ نقطة + خط + وسم */
      const o = {name:it.name, desc:it.desc||'', query:it.query||it.name, x, y, miss:0};
      const m = document.createElement('div');
      m.className='marker';
      m.style.left=x+'%'; m.style.top=y+'%';
      m.innerHTML = `<div class="dot"></div>
        <div class="lead"></div>
        <div class="tag">${esc(it.name)}<small>${esc(o.desc)}</small></div>`;
      setSide(m, x);
      m.onclick = e=>{e.stopPropagation(); openSheet(); focusCard(key);};
      layer.appendChild(m);
      o.el = m;
      objects.set(key,o);
      addCard(key,o);
    }
  });

  /* الأشياء اللي اختفت: أعطها فرصة دورة وحدة ثم احذفها */
  for(const [key,o] of objects){
    if(!seen.has(key)){
      o.miss++;
      if(o.miss===1){ o.el.classList.add('gone'); }
      if(o.miss>=2){
        o.el.remove();
        if(o.cardEl) o.cardEl.remove();
        objects.delete(key);
      }
    }
  }
  updateCount();
}

function setSide(m,x){
  const side = x>55 ? 'left' : 'right';
  const other= side==='left' ? 'right':'left';
  m.querySelector('.lead').classList.add(side);
  m.querySelector('.lead').classList.remove(other);
  m.querySelector('.tag').classList.add(side);
  m.querySelector('.tag').classList.remove(other);
}

function addCard(key,o){
  const q = encodeURIComponent(o.query);
  const card = document.createElement('div');
  card.className='card'; card.dataset.key=key;
  card.innerHTML = `
    <div class="card-head"><div class="cdot"></div><h3>${esc(o.name)}</h3></div>
    <p>${esc(o.desc)}</p>
    <div class="actions">
      <a class="g-search" target="_blank" rel="noopener" href="https://www.google.com/search?q=${q}">🔍 بحث قوقل</a>
      <a class="g-img" target="_blank" rel="noopener" href="https://www.google.com/search?tbm=isch&q=${q}">🖼️ صور قوقل</a>
    </div>`;
  sheetBody.appendChild(card);
  o.cardEl = card;
}
function focusCard(key){
  sheetBody.querySelectorAll('.card').forEach(c=>c.classList.remove('hi'));
  const c = sheetBody.querySelector(`.card[data-key="${CSS.escape(key)}"]`);
  if(c){c.classList.add('hi'); c.scrollIntoView({behavior:'smooth',block:'center'});}
}
function updateCount(){
  sheetTitle.textContent = `الأشياء المكتشفة (${objects.size})`;
  listBtn.style.borderColor = objects.size ? 'var(--amber)' : 'rgba(255,255,255,.2)';
}

/* ---------- حلقة التعرف اللحظي ---------- */
async function liveLoop(){
  while(liveOn){
    if(!stream || !video.videoWidth){ await sleep(400); continue; }
    inFlight = true;
    setStatus('LIVE • AI','think');
    try{
      const b64 = captureFrame();
      const items = await askClaude(b64);
      if(!liveOn) break;
      applyDetections(items);
      setStatus('LIVE','live');
    }catch(e){
      if(liveOn) setStatus('LIVE • RETRY','live');
    }
    inFlight = false;
    cycle++;
    await sleep(500); /* استراحة قصيرة بين الدورات */
  }
}
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

liveBtn.onclick = ()=>{
  if(!liveOn){
    if(!stream){ startCam(); }
    liveOn = true;
    liveBtn.classList.add('on');
    liveLbl.textContent='إيقاف';
    stage.classList.add('live');
    hint.classList.add('hide');
    setStatus('LIVE','live');
    liveLoop();
  }else{
    liveOn = false;
    liveBtn.classList.remove('on');
    liveLbl.textContent='تشغيل';
    stage.classList.remove('live');
    setStatus('PAUSED','');
  }
};

listBtn.onclick = ()=>{ sheet.classList.contains('open') ? closeSheet() : openSheet(); };
document.getElementById('sheetClose').onclick = closeSheet;
document.getElementById('sheetHead').onclick = e=>{ if(e.target.id!=='sheetClose') closeSheet(); };
function openSheet(){sheet.classList.add('open');}
function closeSheet(){sheet.classList.remove('open');}

function showMsg(type,text){
  msg.className = type||''; msg.textContent = text||'';
  msg.style.display = type ? 'block':'none';
  if(type==='err') setTimeout(()=>{ if(msg.textContent===text) showMsg(''); }, 6000);
}

/* ---------- التشغيل ---------- */
startCam();
syncLayer();
</script>
</body>
</html>
