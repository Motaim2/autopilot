<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>العدسة الذكية</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0D10;
    --panel:#14181D;
    --panel2:#1B2128;
    --line:#2A323B;
    --amber:#FFB454;
    --amber-dim:rgba(255,180,84,.35);
    --text:#EDEFF2;
    --muted:#8B96A3;
    --danger:#FF6B6B;
    --ok:#7ED9A7;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{
    background:#000;
    color:var(--text);
    font-family:'IBM Plex Sans Arabic',sans-serif;
  }

  /* ===== الكاميرا ملء الشاشة ===== */
  #stage{position:fixed;inset:0;background:#000;overflow:hidden}
  #video,#frozen{
    position:absolute;inset:0;width:100%;height:100%;
    object-fit:cover;display:block;
  }
  #frozen{display:none}
  #stage.frozen #video{display:none}
  #stage.frozen #frozen{display:block}

  /* طبقة العلامات تطابق مساحة الصورة الفعلية */
  #markerLayer{position:absolute;z-index:5;pointer-events:none}
  #markerLayer .marker{pointer-events:auto}

  /* ===== الهيدر العائم ===== */
  header{
    position:fixed;top:0;left:0;right:0;z-index:20;
    padding:calc(env(safe-area-inset-top, 0px) + 12px) 18px 22px;
    display:flex;align-items:center;justify-content:space-between;
    background:linear-gradient(to bottom, rgba(0,0,0,.72), transparent);
    pointer-events:none;
  }
  header > *{pointer-events:auto}
  .brand{display:flex;align-items:center;gap:10px}
  .reticle{
    width:24px;height:24px;border:2px solid var(--amber);border-radius:50%;
    position:relative;flex-shrink:0;
  }
  .reticle::after{content:'';position:absolute;inset:7px;background:var(--amber);border-radius:50%;animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.6);opacity:.5}}
  h1{font-size:16px;font-weight:700;letter-spacing:.5px;text-shadow:0 1px 6px rgba(0,0,0,.6)}
  .status{
    font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);
    padding:4px 10px;border:1px solid rgba(255,255,255,.2);border-radius:20px;
    direction:ltr;background:rgba(0,0,0,.45);backdrop-filter:blur(6px);
  }
  .status.on{color:var(--ok);border-color:rgba(126,217,167,.5)}

  /* الزوايا */
  .corner{position:absolute;width:28px;height:28px;border-color:var(--amber);border-style:solid;border-width:0;opacity:.85;pointer-events:none;z-index:6}
  .c-tl{top:calc(env(safe-area-inset-top,0px) + 62px);right:14px;border-top-width:2px;border-right-width:2px;border-radius:0 6px 0 0}
  .c-tr{top:calc(env(safe-area-inset-top,0px) + 62px);left:14px;border-top-width:2px;border-left-width:2px;border-radius:6px 0 0 0}
  .c-bl{bottom:150px;right:14px;border-bottom-width:2px;border-right-width:2px;border-radius:0 0 6px 0}
  .c-br{bottom:150px;left:14px;border-bottom-width:2px;border-left-width:2px;border-radius:0 0 0 6px}

  /* شعاع المسح */
  #beam{
    position:absolute;left:0;right:0;height:2px;top:0;
    background:linear-gradient(90deg,transparent,var(--amber),transparent);
    box-shadow:0 0 18px 4px var(--amber-dim);
    display:none;z-index:7;
  }
  #stage.scanning #beam{display:block;animation:sweep 1.6s ease-in-out infinite}
  @keyframes sweep{0%{top:0}50%{top:calc(100% - 2px)}100%{top:0}}

  /* العلامات */
  .marker{position:absolute;z-index:5;transform:translate(-50%,-50%);cursor:pointer}
  .dot{
    width:15px;height:15px;border-radius:50%;
    background:var(--amber);
    border:2px solid #fff;
    box-shadow:0 0 0 4px var(--amber-dim),0 0 16px var(--amber);
    animation:dotpop .35s ease;
  }
  @keyframes dotpop{from{transform:scale(0)}to{transform:scale(1)}}
  .lead{position:absolute;top:50%;height:2px;background:var(--amber);width:34px}
  .lead.left{right:100%;margin-right:5px}
  .lead.right{left:100%;margin-left:5px}
  .tag{
    position:absolute;top:50%;transform:translateY(-50%);
    white-space:nowrap;
    background:rgba(11,13,16,.88);
    border:1px solid var(--amber);
    color:var(--text);
    font-size:12.5px;font-weight:500;
    padding:5px 10px;border-radius:6px;
    backdrop-filter:blur(4px);
    max-width:44vw;overflow:hidden;text-overflow:ellipsis;
  }
  .tag.left{right:100%;margin-right:41px}
  .tag.right{left:100%;margin-left:41px}
  .tag b{color:var(--amber);font-family:'IBM Plex Mono',monospace;font-size:10px;margin-inline-end:5px}

  #hint{
    position:fixed;bottom:132px;left:50%;transform:translateX(-50%);
    background:rgba(11,13,16,.75);border:1px solid rgba(255,255,255,.15);
    font-size:11.5px;color:#cfd6dd;padding:6px 16px;border-radius:20px;
    z-index:15;white-space:nowrap;backdrop-filter:blur(6px);
  }

  /* ===== أزرار التحكم العائمة ===== */
  #controls{
    position:fixed;bottom:0;left:0;right:0;z-index:20;
    display:flex;align-items:center;justify-content:center;gap:26px;
    padding:18px 18px calc(env(safe-area-inset-bottom, 0px) + 22px);
    background:linear-gradient(to top, rgba(0,0,0,.72), transparent);
  }
  .side-btn{
    width:50px;height:50px;border-radius:50%;
    background:rgba(20,24,29,.7);border:1px solid rgba(255,255,255,.2);
    color:#dfe4e9;font-size:20px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    transition:.2s;backdrop-filter:blur(8px);
  }
  .side-btn:active{transform:scale(.92)}
  #shutter{
    width:76px;height:76px;border-radius:50%;
    background:var(--amber);
    border:4px solid #fff;
    box-shadow:0 0 0 3px var(--amber-dim),0 6px 24px rgba(255,180,84,.4);
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:.15s;
  }
  #shutter:active{transform:scale(.93)}
  #shutter:disabled{opacity:.5}
  #shutter .lbl{font-size:12px;font-weight:700;color:#1a1205}

  /* ===== لوحة النتائج (منسدلة فوق الكاميرا) ===== */
  #sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:30;
    background:rgba(11,13,16,.94);backdrop-filter:blur(14px);
    border-top:1px solid var(--line);
    border-radius:20px 20px 0 0;
    max-height:52dvh;
    transform:translateY(110%);
    transition:transform .35s cubic-bezier(.2,.9,.3,1);
    display:flex;flex-direction:column;
  }
  #sheet.open{transform:translateY(0)}
  #sheetHead{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 18px 8px;flex-shrink:0;cursor:pointer;
  }
  #sheetHead .grab{
    position:absolute;top:7px;left:50%;transform:translateX(-50%);
    width:42px;height:4px;border-radius:4px;background:var(--line);
  }
  #sheetTitle{font-size:13px;font-weight:700;color:var(--amber);padding-top:6px}
  #sheetToggle{
    background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;padding:6px;padding-top:10px;
  }
  #sheetBody{overflow-y:auto;padding:4px 16px 26px;display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch}
  #sheet.min{max-height:none}
  #sheet.min #sheetBody{display:none}

  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:14px 16px;
    animation:rise .4s ease both;flex-shrink:0;
  }
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .card.hi{border-color:var(--amber);box-shadow:0 0 0 3px var(--amber-dim)}
  .card-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .num{
    font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:500;
    color:#1a1205;background:var(--amber);
    width:22px;height:22px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .card h3{font-size:16px;font-weight:700}
  .card p{font-size:13.5px;color:var(--muted);line-height:1.7;margin-bottom:12px}
  .actions{display:flex;gap:8px}
  .actions a{
    flex:1;text-align:center;text-decoration:none;
    font-size:13px;font-weight:500;
    padding:9px 6px;border-radius:9px;
    transition:.15s;
  }
  .g-search{background:var(--amber);color:#1a1205}
  .g-img{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
  .actions a:active{transform:scale(.96)}

  .empty{text-align:center;padding:26px 20px;color:var(--muted);font-size:13.5px;line-height:1.9}
  .empty .big{font-size:32px;margin-bottom:8px}

  /* رسائل وتحميل عائمة */
  #msg{
    position:fixed;top:calc(env(safe-area-inset-top,0px) + 64px);left:16px;right:16px;z-index:25;
    padding:12px 16px;border-radius:12px;
    font-size:13.5px;line-height:1.7;display:none;
    backdrop-filter:blur(8px);
  }
  #msg.err{display:block;background:rgba(60,15,15,.85);border:1px solid rgba(255,107,107,.45);color:#ffb3b3}
  #loadingCard{
    position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:25;
    display:none;padding:20px 26px;border-radius:16px;
    background:rgba(11,13,16,.9);border:1px solid var(--line);backdrop-filter:blur(10px);
    text-align:center;font-size:13.5px;color:var(--muted);max-width:80vw;
  }
  #loadingCard.show{display:block}
  .spin{
    width:24px;height:24px;border:3px solid var(--line);border-top-color:var(--amber);
    border-radius:50%;margin:0 auto 10px;animation:rot 1s linear infinite;
  }
  @keyframes rot{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="stage">
  <video id="video" autoplay playsinline muted></video>
  <img id="frozen" alt="">
  <div id="markerLayer"></div>
  <div class="corner c-tl"></div><div class="corner c-tr"></div>
  <div class="corner c-bl"></div><div class="corner c-br"></div>
  <div id="beam"></div>
</div>

<header>
  <div class="brand">
    <div class="reticle"></div>
    <h1>العدسة الذكية</h1>
  </div>
  <div class="status" id="camStatus">CAM OFF</div>
</header>

<div id="hint">وجّه الكاميرا واضغط زر المسح</div>

<div id="msg"></div>
<div id="loadingCard"><div class="spin"></div><span id="loadTxt">جاري تحليل الصورة…</span></div>

<div id="controls">
  <button class="side-btn" id="flipBtn" title="تبديل الكاميرا">⟳</button>
  <button id="shutter"><span class="lbl">مسح</span></button>
  <button class="side-btn" id="backBtn" title="رجوع للكاميرا" style="display:none">✕</button>
</div>

<div id="sheet">
  <div id="sheetHead">
    <div class="grab"></div>
    <div id="sheetTitle">النتائج</div>
    <button id="sheetToggle">▾</button>
  </div>
  <div id="sheetBody"></div>
</div>

<script>
const video   = document.getElementById('video');
const frozen  = document.getElementById('frozen');
const stage   = document.getElementById('stage');
const layer   = document.getElementById('markerLayer');
const shutter = document.getElementById('shutter');
const flipBtn = document.getElementById('flipBtn');
const backBtn = document.getElementById('backBtn');
const sheet     = document.getElementById('sheet');
const sheetBody = document.getElementById('sheetBody');
const sheetTitle= document.getElementById('sheetTitle');
const sheetToggle=document.getElementById('sheetToggle');
const msg     = document.getElementById('msg');
const loading = document.getElementById('loadingCard');
const loadTxt = document.getElementById('loadTxt');
const hint    = document.getElementById('hint');
const camStatus = document.getElementById('camStatus');

let stream = null;
let facing = 'environment';
let capturedB64 = null;
let imgW = 0, imgH = 0;   // أبعاد الصورة الملتقطة
let busy = false;

/* ---------- الكاميرا ---------- */
async function startCam(){
  stopCam();
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      video:{facingMode:facing, width:{ideal:1280}, height:{ideal:720}},
      audio:false
    });
    video.srcObject = stream;
    camStatus.textContent = 'CAM ON';
    camStatus.classList.add('on');
    showMsg('');
  }catch(e){
    camStatus.textContent = 'CAM OFF';
    camStatus.classList.remove('on');
    showMsg('err','ما قدرت أفتح الكاميرا. تأكد من إعطاء إذن الكاميرا للصفحة ثم أعد المحاولة.');
  }
}
function stopCam(){
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
}
flipBtn.onclick = ()=>{facing = facing==='environment'?'user':'environment'; if(!stage.classList.contains('frozen')) startCam();};

/* ---------- حساب مساحة الصورة الفعلية داخل الشاشة (object-fit: cover) ---------- */
function coverBox(){
  const cw = stage.clientWidth, ch = stage.clientHeight;
  if(!imgW || !imgH) return {x:0,y:0,w:cw,h:ch};
  const scale = Math.max(cw/imgW, ch/imgH);
  const w = imgW*scale, h = imgH*scale;
  return {x:(cw-w)/2, y:(ch-h)/2, w, h};
}
function syncLayer(){
  const b = coverBox();
  layer.style.left = b.x+'px';
  layer.style.top  = b.y+'px';
  layer.style.width  = b.w+'px';
  layer.style.height = b.h+'px';
}
window.addEventListener('resize', syncLayer);

/* ---------- التقاط الإطار ---------- */
function captureFrame(){
  const c = document.createElement('canvas');
  const w = Math.min(video.videoWidth, 1024);
  const scale = w / video.videoWidth;
  c.width  = w;
  c.height = Math.round(video.videoHeight * scale);
  c.getContext('2d').drawImage(video,0,0,c.width,c.height);
  imgW = c.width; imgH = c.height;
  return c.toDataURL('image/jpeg',0.85).split(',')[1];
}

/* ---------- أدوات الواجهة ---------- */
function showMsg(type,text){
  msg.className = type||''; msg.textContent = text||'';
  msg.style.display = type ? 'block':'none';
  if(type==='err') setTimeout(()=>{ if(msg.textContent===text) showMsg(''); }, 6000);
}
function clearMarkers(){layer.innerHTML='';}
function openSheet(){sheet.classList.add('open');sheet.classList.remove('min');sheetToggle.textContent='▾';}
function closeSheet(){sheet.classList.remove('open');}
sheetToggle.onclick = toggleSheet;
document.getElementById('sheetHead').onclick = toggleSheet;
function toggleSheet(){
  sheet.classList.toggle('min');
  sheetToggle.textContent = sheet.classList.contains('min') ? '▴' : '▾';
}
function resetToLive(){
  stage.classList.remove('frozen','scanning');
  clearMarkers();
  sheetBody.innerHTML='';
  closeSheet();
  showMsg('');
  backBtn.style.display='none';
  hint.style.display='block';
  hint.textContent='وجّه الكاميرا واضغط زر المسح';
  capturedB64=null;
  startCam();
}
backBtn.onclick = resetToLive;

/* ---------- Claude API ---------- */
async function askClaude(b64, tapPoint){
  const instruction = tapPoint
    ? `انظر للصورة وحدد ما هو الشيء الموجود بالضبط عند النقطة (${tapPoint.x}% من اليسار، ${tapPoint.y}% من الأعلى). أجب فقط بمصفوفة JSON فيها عنصر واحد بهذا الشكل بدون أي نص إضافي وبدون Markdown:
[{"name":"اسم الشيء بالعربي","desc":"وصف مختصر بالعربي جملة أو جملتين","query":"english search query","x":${tapPoint.x},"y":${tapPoint.y}}]`
    : `انظر للصورة وحدد أوضح الأشياء الظاهرة فيها (من 1 إلى 6 أشياء مميزة فقط، الأشياء الرئيسية الواضحة). أجب فقط بمصفوفة JSON بدون أي نص إضافي وبدون Markdown بهذا الشكل:
[{"name":"اسم الشيء بالعربي","desc":"وصف مختصر ومفيد بالعربي جملة أو جملتين عن هذا الشيء","query":"english google search query for this object","x":50,"y":50}]
حيث x و y هما نسبة مئوية (0-100) لموقع مركز الشيء في الصورة: x من اليسار و y من الأعلى. كن دقيقاً في تحديد المواقع.`;

  const response = await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      model:"claude-sonnet-4-6",
      max_tokens:1000,
      messages:[{role:"user",content:[
        {type:"image",source:{type:"base64",media_type:"image/jpeg",data:b64}},
        {type:"text",text:instruction}
      ]}]
    })
  });
  const data = await response.json();
  const text = (data.content||[]).filter(i=>i.type==='text').map(i=>i.text).join('\n');
  const clean = text.replace(/```json|```/g,'').trim();
  const start = clean.indexOf('['), end = clean.lastIndexOf(']');
  if(start===-1||end===-1) throw new Error('bad json');
  return JSON.parse(clean.slice(start,end+1));
}

/* ---------- عرض النتائج ---------- */
function renderItems(items, append){
  if(!append){clearMarkers(); sheetBody.innerHTML='';}
  const baseIndex = sheetBody.querySelectorAll('.card').length;

  if(items.length===0 && !append){
    sheetBody.innerHTML = `<div class="empty"><div class="big">🤔</div>ما قدرت أميّز شي واضح في الصورة.<br>جرّب تقرّب الكاميرا أو حسّن الإضاءة وامسح مرة ثانية.</div>`;
    sheetTitle.textContent='النتائج';
    openSheet();
    return;
  }

  items.forEach((it,i)=>{
    const n = baseIndex + i + 1;
    const x = Math.min(97,Math.max(3, +it.x||50));
    const y = Math.min(97,Math.max(3, +it.y||50));
    const side = x > 55 ? 'left' : 'right';

    const m = document.createElement('div');
    m.className='marker'; m.style.left=x+'%'; m.style.top=y+'%';
    m.dataset.card='c'+n;
    m.innerHTML = `<div class="dot"></div>
      <div class="lead ${side}"></div>
      <div class="tag ${side}"><b>${String(n).padStart(2,'0')}</b>${esc(it.name)}</div>`;
    m.onclick = e=>{e.stopPropagation(); openSheet(); focusCard('c'+n);};
    layer.appendChild(m);

    const q = encodeURIComponent(it.query || it.name);
    const card = document.createElement('div');
    card.className='card'; card.id='c'+n;
    card.style.animationDelay = (i*0.08)+'s';
    card.innerHTML = `
      <div class="card-head"><div class="num">${n}</div><h3>${esc(it.name)}</h3></div>
      <p>${esc(it.desc||'')}</p>
      <div class="actions">
        <a class="g-search" target="_blank" rel="noopener" href="https://www.google.com/search?q=${q}">🔍 بحث قوقل</a>
        <a class="g-img" target="_blank" rel="noopener" href="https://www.google.com/search?tbm=isch&q=${q}">🖼️ صور قوقل</a>
      </div>`;
    sheetBody.appendChild(card);
  });

  const total = sheetBody.querySelectorAll('.card').length;
  sheetTitle.textContent = `النتائج (${total})`;
  openSheet();
}
function focusCard(id){
  sheetBody.querySelectorAll('.card').forEach(c=>c.classList.remove('hi'));
  const c = document.getElementById(id);
  if(c){c.classList.add('hi'); c.scrollIntoView({behavior:'smooth',block:'center'});}
}
function esc(s){return String(s??'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));}

/* ---------- المسح ---------- */
shutter.onclick = async ()=>{
  if(busy) return;
  if(stage.classList.contains('frozen')){resetToLive();return;}
  if(!stream || !video.videoWidth){showMsg('err','الكاميرا غير جاهزة بعد.');return;}
  busy = true; shutter.disabled = true;

  capturedB64 = captureFrame();
  frozen.src = 'data:image/jpeg;base64,'+capturedB64;
  stage.classList.add('frozen','scanning');
  syncLayer();
  stopCam();
  camStatus.textContent='ANALYZING'; camStatus.classList.add('on');
  backBtn.style.display='flex';
  hint.style.display='none';
  sheetBody.innerHTML=''; clearMarkers(); closeSheet(); showMsg('');
  loadTxt.textContent='جاري تحليل الصورة والتعرف على الأشياء…';
  loading.classList.add('show');

  try{
    const items = await askClaude(capturedB64,null);
    renderItems(items,false);
    hint.style.display='block';
    hint.textContent='اضغط على أي مكان بالصورة لتحديد شي معيّن';
    setTimeout(()=>{hint.style.display='none';},4500);
  }catch(e){
    showMsg('err','صار خطأ أثناء التحليل. اضغط ✕ للرجوع للكاميرا وحاول مرة ثانية.');
  }
  loading.classList.remove('show');
  stage.classList.remove('scanning');
  camStatus.textContent='FROZEN';
  busy=false; shutter.disabled=false;
};

/* الضغط على الصورة المجمدة لتحديد نقطة معينة */
frozen.addEventListener('click', async (e)=>{
  if(busy || !capturedB64) return;
  const b = coverBox();
  const x = Math.round((e.clientX - b.x)/b.w*100);
  const y = Math.round((e.clientY - b.y)/b.h*100);
  if(x<0||x>100||y<0||y>100) return;
  busy = true;
  stage.classList.add('scanning');
  loadTxt.textContent='جاري التعرف على الشي اللي أشرت عليه…';
  loading.classList.add('show');
  try{
    const items = await askClaude(capturedB64,{x,y});
    renderItems(items,true);
    const last = sheetBody.querySelector('.card:last-child');
    if(last) focusCard(last.id);
  }catch(err){
    showMsg('err','ما قدرت أحدد هذي النقطة، جرّب مرة ثانية.');
  }
  loading.classList.remove('show');
  stage.classList.remove('scanning');
  busy=false;
});

/* ---------- التشغيل ---------- */
startCam();
syncLayer();
</script>
</body>
</html>
