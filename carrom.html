<body>

    <p>AUTO ⌖ يكتشف حدود اللوحة تلقائيًا من الإطار البرتقالي والحفر الأربع. إذا تحرك الجوال اضغطه مرة ثانية. وللضبط اليدوي: ADJUST أو اسحب الإطار بإصبعك</p>
  </div>

<script>
'use strict';

const BOARD = 400;               // internal board space
/* Geometry measured from the reference board screenshot (walls = 884px):
   piece Ø49px → r=11 @400 · striker r≈13.6 · pocket r≈25
   inner drawn frame inset ≈ 8.8% · baseline inset ≈ 10.3% */
const STRIKER_R = 13.5;
const PIECE_R = 11;
const POCKET_R = 20.5;           // pocket r (45.5px @886 span)
// real walls sit OUTSIDE the pocket-center square; per-side margins in
// board units, drag any edge to tune, saved forever (board never changes)
let WALLS = { t:7.5, r:4, b:4.5, l:6.5 };
try { const s=localStorage.getItem('carrom_walls'); if (s) WALLS=JSON.parse(s); } catch(e){}
function saveWalls(){ try{ localStorage.setItem('carrom_walls', JSON.stringify(WALLS)); }catch(e){} }

/* Pure-JS perspective transform (no OpenCV needed) — solves the 8x8
   system for the homography mapping src[4] -> dst[4]. Lets calibration
   and warping run the instant the page loads. */
function computeHomographyJS(src, dst) {
  const A=[], b=[];
  for (let i=0;i<4;i++){
    const {x,y}=src[i], {x:X,y:Y}=dst[i];
    A.push([x,y,1,0,0,0,-X*x,-X*y]); b.push(X);
    A.push([0,0,0,x,y,1,-Y*x,-Y*y]); b.push(Y);
  }
  const hv=solve8(A,b);                       // [a b c d e f g h]
  return new Float64Array([hv[0],hv[1],hv[2], hv[3],hv[4],hv[5], hv[6],hv[7],1]);
}
function invertHomographyJS(H) {
  const m=[[H[0],H[1],H[2]],[H[3],H[4],H[5]],[H[6],H[7],H[8]]];
  const inv=inv3(m);
  return new Float64Array([inv[0][0],inv[0][1],inv[0][2],
                           inv[1][0],inv[1][1],inv[1][2],
                           inv[2][0],inv[2][1],inv[2][2]]);
}
function solve8(A,b){                          // Gaussian elimination 8x8
  const n=8, M=A.map((r,i)=>[...r,b[i]]);
  for (let col=0;col<n;col++){
    let piv=col;
    for (let r=col+1;r<n;r++) if (Math.abs(M[r][col])>Math.abs(M[piv][col])) piv=r;
    [M[col],M[piv]]=[M[piv],M[col]];
    const d=M[col][col]||1e-9;
    for (let c=col;c<=n;c++) M[col][c]/=d;
    for (let r=0;r<n;r++){ if (r===col) continue;
      const f=M[r][col];
      for (let c=col;c<=n;c++) M[r][c]-=f*M[col][c];
    }
  }
  return M.map(r=>r[n]);
}
function inv3(m){
  const a=m[0][0],b=m[0][1],c=m[0][2],d=m[1][0],e=m[1][1],f=m[1][2],g=m[2][0],hh=m[2][1],i=m[2][2];
  const A=e*i-f*hh, B=-(d*i-f*g), C=d*hh-e*g,
        D=-(b*i-c*hh), E=a*i-c*g, F=-(a*hh-b*g),
        G=b*f-c*e, H2=-(a*f-c*d), I=a*e-b*d;
  const det=a*A+b*B+c*C||1e-9, s=1/det;
  return [[A*s,D*s,G*s],[B*s,E*s,H2*s],[C*s,F*s,I*s]];
}
function warpPointsJS(H, srcCanvas, sw, sh, outW, outH) {
  // maps SOURCE pixels through H(video->board) inverse to sample board
  return null; // (unused placeholder)
}
const T_RECT = 35;               // inner frame rect inset
const T_BASE = 41;               // baseline distance from wall
const T_BEND1 = 76, T_BEND2 = 324; // baseline endpoints

/* ============================================================ UI */
const UI = (() => {
  const msg = document.getElementById('msg');
  let t = null;
  return {
    showMsg(text, autoHide) {
      msg.textContent = text; msg.classList.add('show');
      clearTimeout(t);
      if (autoHide) t = setTimeout(()=>msg.classList.remove('show'), autoHide);
    },
    hideMsg(){ msg.classList.remove('show'); }
  };
})();

/* ============================================================ SOURCE + ZOOM */
const Source = (() => {
  const video = document.getElementById('cam');
  const overlay = document.getElementById('overlay');
  const wrap = document.getElementById('zoomWrap');
  let viewRect = { left:0, top:0, width:0, height:0 };
  let track = null;
  let hwZoom = null;               // {min,max,step} if camera supports optical/sensor zoom
  let zoom = 1;                    // current zoom (hw value or digital scale)

  async function startScreen() {
    const s = await navigator.mediaDevices.getDisplayMedia({ video:{ frameRate:{ideal:30} }, audio:false });
    return attach(s);
  }
  async function startCamera() {
    const s = await navigator.mediaDevices.getUserMedia({
      audio:false,
      video:{ facingMode:{ideal:'environment'}, width:{ideal:1280}, height:{ideal:720}, frameRate:{ideal:30} }
    });
    return attach(s);
  }
  async function attach(stream) {
    video.srcObject = stream;
    track = stream.getVideoTracks()[0];
    try {
      const caps = track.getCapabilities ? track.getCapabilities() : {};
      if (caps.zoom) { hwZoom = caps.zoom; zoom = track.getSettings().zoom || caps.zoom.min || 1; }
    } catch(e){}
    await new Promise(res => { if (video.readyState>=2) return res(); video.onloadedmetadata=()=>res(); });
    await video.play();
    fitOverlay();
    return { w: video.videoWidth, h: video.videoHeight };
  }

  function fitOverlay() {
    const vw=video.videoWidth, vh=video.videoHeight;
    if (!vw||!vh) return;
    const sw=window.innerWidth, sh=window.innerHeight;
    const s=Math.min(sw/vw, sh/vh);
    viewRect={ width:vw*s, height:vh*s, left:(sw-vw*s)/2, top:(sh-vh*s)/2 };
    overlay.width=vw; overlay.height=vh;
    overlay.style.left=viewRect.left+'px'; overlay.style.top=viewRect.top+'px';
    overlay.style.width=viewRect.width+'px'; overlay.style.height=viewRect.height+'px';
  }

  async function setZoom(z) {
    if (hwZoom) {
      zoom = Math.max(hwZoom.min, Math.min(hwZoom.max, z));
      try { await track.applyConstraints({ advanced:[{ zoom }] }); } catch(e){}
    } else {
      zoom = Math.max(1, Math.min(4, z));
      wrap.style.transform = zoom===1 ? '' : 'scale('+zoom+')';
    }
    document.getElementById('zoomVal').textContent = zoom.toFixed(1)+'x';
    return zoom;
  }
  function getZoom(){ return zoom; }
  function zoomStep(){ return hwZoom ? Math.max((hwZoom.max-hwZoom.min)/10, hwZoom.step||0.1) : 0.25; }

  // screen -> video px (accounts for digital zoom transform around screen center)
  function toVideoCoords(cx, cy) {
    if (!hwZoom && zoom !== 1) {
      const sw=window.innerWidth/2, sh=window.innerHeight/2;
      cx = (cx-sw)/zoom + sw;
      cy = (cy-sh)/zoom + sh;
    }
    return {
      x:(cx-viewRect.left)*(video.videoWidth/viewRect.width),
      y:(cy-viewRect.top)*(video.videoHeight/viewRect.height)
    };
  }

  window.addEventListener('resize', fitOverlay);
  window.addEventListener('orientationchange', ()=>setTimeout(fitOverlay,300));

  return { video, overlay, startScreen, startCamera, toVideoCoords, setZoom, getZoom, zoomStep };
})();

/* ============================================================ CALIBRATION (quad + homography) */
const Calib = (() => {
  let quad=null, editing=false, locked=false;
  let H=null, Hinv=null, drag=null;
  const HANDLE_R = 36;
  let onQuadChanged = null;        // callback -> rebuild warp

  function defaultQuad() {
    const v=Source.video, w=v.videoWidth, h=v.videoHeight;
    const size=Math.min(w,h)*0.62, cx=w/2, cy=h/2;
    return [ {x:cx-size/2,y:cy-size/2},{x:cx+size/2,y:cy-size/2},
             {x:cx+size/2,y:cy+size/2},{x:cx-size/2,y:cy+size/2} ];
  }

  function setQuad(q) {            // used by AUTO fit
    quad = q; editing=false;
    computeH(); locked=true;
    if (onQuadChanged) onQuadChanged();
  }

  function startEdit() {
    if (!quad) quad = defaultQuad();
    editing=true; locked=false;
    UI.showMsg('ضع المقابض على مراكز الحفر الأربع ثم اضغط OK');
  }
  function confirm() {
    editing=false; computeH(); locked=true;
    if (onQuadChanged) onQuadChanged();
    UI.showMsg('تم حفظ الحدود ✓', 1400);
  }
  function reset(){ quad=null; editing=false; locked=false; H=Hinv=null; drag=null; UI.hideMsg(); }

  function computeH() {
    const dst=[{x:0,y:0},{x:BOARD,y:0},{x:BOARD,y:BOARD},{x:0,y:BOARD}];
    H=computeHomographyJS(quad, dst);
    Hinv=invertHomographyJS(H);
  }
  function apply(M,p){ const w=M[6]*p.x+M[7]*p.y+M[8];
    return {x:(M[0]*p.x+M[1]*p.y+M[2])/w, y:(M[3]*p.x+M[4]*p.y+M[5])/w}; }

  function inside(p) {
    let c=false;
    for (let i=0,j=3;i<4;j=i++)
      if ((quad[i].y>p.y)!==(quad[j].y>p.y) &&
          p.x<(quad[j].x-quad[i].x)*(p.y-quad[i].y)/(quad[j].y-quad[i].y)+quad[i].x) c=!c;
    return c;
  }

  // drag: corner handles only while editing; whole-quad move works even when locked
  function onDown(p) {
    if (!quad) return false;
    if (editing) {
      for (let i=0;i<4;i++)
        if (Math.hypot(p.x-quad[i].x,p.y-quad[i].y)<HANDLE_R) { drag={idx:i}; return true; }
    }
    if (inside(p)) { drag={move:true,start:p,orig:quad.map(q=>({...q}))}; return true; }
    return false;
  }
  function onMove(p) {
    if (!drag) return;
    if (drag.move) {
      const dx=p.x-drag.start.x, dy=p.y-drag.start.y;
      quad = drag.orig.map(q=>({x:q.x+dx,y:q.y+dy}));
    } else quad[drag.idx]=p;
  }
  function onUp() {
    if (drag && locked) {          // moved whole quad while locked -> re-lock at new place
      computeH();
      if (onQuadChanged) onQuadChanged();
    }
    drag=null;
  }

  return {
    get quad(){return quad;}, get editing(){return editing;}, get locked(){return locked;},
    set onChanged(f){ onQuadChanged=f; },
    setQuad, startEdit, confirm, reset, onDown, onMove, onUp,
    boardToVideo:p=>apply(Hinv,p),
    videoToBoard:p=>apply(H,p)
  };
})();

/* ============================================================ AUTO FIT
   Verified on the user's real iPhone screenshot (99.4% square match):
   1. Approximate quad from the tan WOOD field (largest component)
   2. Lock each corner to its POCKET CENTER using a matched filter:
      "dark disk surrounded by bright ring" — only the pockets look
      like that (UI circles / frame / background all fail the ring)
   3. Validate: near-square sides+diagonals, red queen at the center
   Works at any camera distance/zoom since everything is relative. */
const AutoFit = (() => {
  const AW = 640;
  const c = document.createElement('canvas');
  const cx2 = c.getContext('2d', { willReadFrequently:true });
  const R_POCKET = 0.0513;      // pocket radius / wall span (measured)

  function run() {
    const v = Source.video;
    const scale = AW / v.videoWidth;
    c.width = AW; c.height = Math.round(v.videoHeight*scale);
    cx2.drawImage(v, 0, 0, c.width, c.height);
    const img = cx2.getImageData(0, 0, c.width, c.height);

    const woodQuadV = fitWood();     // VIDEO coords
    if (!woodQuadV) return fail('ما لقيت اللوحة — قرّب الكاميرا أو حسّن الإضاءة');

    const scl=AW/Source.video.videoVideoW||AW/Source.video.videoWidth;
    const s=AW/Source.video.videoWidth;
    const woodQuad = woodQuadV.map(p=>({x:p.x*s, y:p.y*s}));  // proc coords

    // dark map
    const W=img.width, H=img.height, d=img.data;
    const dark=new Uint8Array(W*H);
    for (let i=0,p=0;i<W*H;i++,p+=4) {
      const mx=Math.max(d[p],d[p+1],d[p+2]), mn=Math.min(d[p],d[p+1],d[p+2]);
      if (mx<85 || (mx<108 && mx-mn<42)) dark[i]=1;
    }

    const span=(dist(woodQuad[0],woodQuad[1])+dist(woodQuad[1],woodQuad[2])+
                dist(woodQuad[2],woodQuad[3])+dist(woodQuad[3],woodQuad[0]))/4;
    const rExp=span*R_POCKET, wr=Math.max(8,span*0.075);

    const refined=[]; let good=0;
    for (const corner of woodQuad) {
      const f=findPocket(dark,W,H,Math.round(corner.x),Math.round(corner.y),rExp,wr);
      if (f.score>0.35){ refined.push({x:f.x,y:f.y}); good++; }
      else refined.push(corner);
    }

    let quad=woodQuad, mode='wood';
    if (good>=3 && squareOK(refined)) { quad=refined; mode='pockets'; }

    Calib.setQuad(quad.map(p=>({x:p.x/s, y:p.y/s})));

    if (mode==='pockets') {
      const queen=queenOK(img, quad);
      UI.showMsg(queen
        ? 'مطابقة بالحفر '+good+'/4 + الحجر الأحمر ✓ — اسحب أي حافة لضبط الجدار'
        : 'مطابقة بالحفر '+good+'/4 ✓ — اسحب أي حافة لضبط الجدار', 3200);
    } else {
      UI.showMsg('مطابقة عبر الخشب ✓ (الحفر غير واضحة — عدّل الإضاءة)', 2600);
    }
    return true;
  }

  // matched filter: maximize (dark inside disk) - (dark inside ring)
  function findPocket(dark,W,H,cx,cy,rExp,wr) {
    const rOut=rExp*1.55, rIn=rExp*1.12, k=Math.ceil(rOut);
    function score(px,py,step) {
      let din=0,nin=0,dout=0,nout=0;
      for (let oy=-k;oy<=k;oy+=step) for (let ox=-k;ox<=k;ox+=step) {
        const x=px+ox, y=py+oy;
        if (x<0||y<0||x>=W||y>=H) continue;
        const dd=Math.hypot(ox,oy);
        if (dd<=rExp){ nin++; din+=dark[y*W+x]; }
        else if (dd>rIn&&dd<=rOut){ nout++; dout+=dark[y*W+x]; }
      }
      if (!nin||!nout) return -1;
      return din/nin - dout/nout;
    }
    // coarse then fine
    let best={x:cx,y:cy,score:-1};
    for (let py=cy-wr;py<=cy+wr;py+=3) for (let px=cx-wr;px<=cx+wr;px+=3) {
      const s=score(Math.round(px),Math.round(py),2);
      if (s>best.score) best={x:Math.round(px),y:Math.round(py),score:s};
    }
    for (let py=best.y-3;py<=best.y+3;py++) for (let px=best.x-3;px<=best.x+3;px++) {
      const s=score(px,py,1);
      if (s>best.score) best={x:px,y:py,score:s};
    }
    return best;
  }

  function squareOK(q) {
    const s=[dist(q[0],q[1]),dist(q[1],q[2]),dist(q[2],q[3]),dist(q[3],q[0])];
    const d1=dist(q[0],q[2]), d2=dist(q[1],q[3]);
    const sMin=Math.min(...s), sMax=Math.max(...s);
    if (sMin<30 || sMax/sMin>1.45) return false;
    if (Math.abs(d1-d2)/Math.max(d1,d2)>0.16) return false;
    const dr=(d1+d2)/2/((sMin+sMax)/2);
    return dr>1.2 && dr<1.62;
  }

  function queenOK(img, q) {
    const W=img.width, d=img.data;
    const cx=(q[0].x+q[1].x+q[2].x+q[3].x)/4, cy=(q[0].y+q[1].y+q[2].y+q[3].y)/4;
    const span=(dist(q[0],q[2])+dist(q[1],q[3]))/4;
    const lim=Math.round(span*0.2);
    let n=0,sx=0,sy=0;
    for (let oy=-lim;oy<=lim;oy+=2) for (let ox=-lim;ox<=lim;ox+=2) {
      const px=Math.round(cx+ox), py=Math.round(cy+oy);
      if (px<0||py<0||px>=W||py>=img.height) continue;
      const i=(py*W+px)*4;
      if (d[i]>170 && d[i+1]<95 && d[i+2]<95){ n++; sx+=px; sy+=py; }
    }
    return n>6 && Math.hypot(sx/n-cx, sy/n-cy)<span*0.15;
  }

  function dist(a,b){ return Math.hypot(a.x-b.x,a.y-b.y); }

  // wood field -> approximate 4 corners, PURE JS (no OpenCV)
  function fitWood() {
    const v=Source.video, scale=AW/v.videoWidth;
    const W=c.width, H=c.height, d=cx2.getImageData(0,0,W,H).data;
    // wood bitmap
    const bit=new Uint8Array(W*H);
    let minx=W,maxx=0,miny=H,maxy=0,cnt=0;
    for (let y=0;y<H;y++){ const row=y*W;
      for (let x=0;x<W;x++){ const i=(row+x)*4, r=d[i],g=d[i+1],b=d[i+2];
        if (r>135&&g>90&&b>40&&r-b>28&&r-b<170&&r>=g&&g>=b){
          bit[row+x]=1; cnt++;
          if(x<minx)minx=x; if(x>maxx)maxx=x; if(y<miny)miny=y; if(y>maxy)maxy=y;
        } } }
    if (cnt < W*H*0.06) return null;
    // extreme corners: for each of TL/TR/BR/BL, the wood pixel that
    // minimizes/maximizes (x±y) — robust to the rounded board corners
    let TL=null,TR=null,BR=null,BL=null,
        tl=1e9,tr=-1e9,br=-1e9,bl=1e9;
    for (let y=miny;y<=maxy;y++){ const row=y*W;
      for (let x=minx;x<=maxx;x++){ if(!bit[row+x]) continue;
        const s=x+y, dgn=x-y;
        if (s<tl){tl=s;TL={x,y};} if (s>br){br=s;BR={x,y};}
        if (dgn>tr){tr=dgn;TR={x,y};} if (dgn<bl){bl=dgn;BL={x,y};}
      } }
    if(!TL||!TR||!BR||!BL) return null;
    return [ {x:TL.x/scale,y:TL.y/scale},{x:TR.x/scale,y:TR.y/scale},
             {x:BR.x/scale,y:BR.y/scale},{x:BL.x/scale,y:BL.y/scale} ];
  }

  function order(pts) {
    const p=[...pts].sort((a,b)=>(a.x+a.y)-(b.x+b.y));
    const TL=p[0], BR=p[3];
    const [m1,m2]=[p[1],p[2]];
    const TR=m1.x-m1.y>m2.x-m2.y?m1:m2;
    const BL=TR===m1?m2:m1;
    return [TL,TR,BR,BL];
  }

  function fail(m){ UI.showMsg(m,3000); return false; }
  return { run };
})();

/* ============================================================ DETECTOR
   One pixel pass over the warped board builds masks:
   white (dots / pieces / striker ring), red (striker mandala + queen),
   black (pieces), orange (in-game arrow). Blobs via grid flood-fill. */
const Detector = (() => {
  const PROC_W = 480;
  const pc = document.createElement('canvas');
  const pctx = pc.getContext('2d', { willReadFrequently:true });
  let srcMat=null, warped=null, warpM=null, procScale=1, ready=false;

  let aim=null, lastSeen=0;
  let striker=null, strikerSeen=0, strikerR=STRIKER_R;
  let pieces=[];
  const HOLD_MS=700, STRIKER_HOLD=1500;
  const SMOOTH=0.5, DEAD_ANG=0.006, DEAD_POS=1.5;

  // board->video homography (pure JS); warp samples the source frame
  let boardToProc=null, warpBuf=null, procData=null;
  function initMats(vw,vh) {
    procScale=PROC_W/vw;
    pc.width=PROC_W; pc.height=Math.round(vh*procScale);
    warpBuf=new Uint8ClampedArray(BOARD*BOARD*4);
    ready=true;
  }
  function dispose(){ ready=false; boardToProc=null; warpBuf=null; procData=null; }

  function buildWarp(quad) {
    // src = board corners -> dst = quad in PROC pixels, so for each board
    // pixel we know exactly where to sample in the downscaled frame
    const src=[{x:0,y:0},{x:BOARD,y:0},{x:BOARD,y:BOARD},{x:0,y:BOARD}];
    const dst=quad.map(p=>({x:p.x*procScale, y:p.y*procScale}));
    boardToProc=computeHomographyJS(src, dst);
  }

  const CELL=4, GW=BOARD/CELL;
  const gWhite=new Float32Array(GW*GW*3), gRed=new Float32Array(GW*GW*3),
        gBlack=new Float32Array(GW*GW*3), gYellow=new Float32Array(GW*GW*3);

  function blobs(grid, minCellCnt) {
    const out=[], seen=new Uint8Array(GW*GW);
    for (let idx=0; idx<GW*GW; idx++) {
      if (seen[idx] || grid[idx*3]<minCellCnt) continue;
      let cnt=0,sx=0,sy=0,minx=1e9,maxx=-1e9,miny=1e9,maxy=-1e9;
      const st=[idx]; seen[idx]=1;
      while (st.length) {
        const cIdx=st.pop(), gx=cIdx%GW, gy=(cIdx/GW)|0;
        cnt+=grid[cIdx*3]; sx+=grid[cIdx*3+1]; sy+=grid[cIdx*3+2];
        const px=grid[cIdx*3+1]/grid[cIdx*3], py=grid[cIdx*3+2]/grid[cIdx*3];
        if(px<minx)minx=px; if(px>maxx)maxx=px; if(py<miny)miny=py; if(py>maxy)maxy=py;
        for (const [ox,oy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
          const nx=gx+ox, ny=gy+oy;
          if (nx<0||ny<0||nx>=GW||ny>=GW) continue;
          const n=ny*GW+nx;
          if (!seen[n] && grid[n*3]>=minCellCnt){ seen[n]=1; st.push(n); }
        }
      }
      const spanX=maxx-minx, spanY=maxy-miny;
      const span=Math.max(spanX,spanY);
      out.push({ x:sx/cnt, y:sy/cnt, cnt, span, spanX, spanY,
                 round: Math.min(spanX,spanY)/Math.max(spanX,spanY,1),
                 fill: cnt/(Math.PI*Math.pow(span/2+CELL,2)) });
    }
    return out;
  }

  function nearPocket(x,y){
    for (const [px,py] of [[0,0],[BOARD,0],[BOARD,BOARD],[0,BOARD]])
      if (Math.hypot(x-px,y-py)<48) return true;
    return false;
  }

  function detect(video) {
    if (!ready||!boardToProc) return output();

    pctx.drawImage(video,0,0,pc.width,pc.height);
    procData=pctx.getImageData(0,0,pc.width,pc.height);
    const sd=procData.data, sw=pc.width, sh=pc.height, H0=boardToProc;
    const d=warpBuf;
    // nearest-neighbour warp with incremental homography (no per-pixel
    // multiply for the linear terms — only the row start is recomputed)
    for (let by=0; by<BOARD; by++) {
      let nx=H0[1]*by+H0[2], ny=H0[4]*by+H0[5], nw=H0[7]*by+H0[8];
      const o0=by*BOARD*4;
      for (let bx=0, o=o0; bx<BOARD; bx++, o+=4) {
        const sx=(nx/nw)|0, sy=(ny/nw)|0;
        nx+=H0[0]; ny+=H0[3]; nw+=H0[6];
        if (sx<0||sy<0||sx>=sw||sy>=sh){ d[o]=d[o+1]=d[o+2]=0; continue; }
        const si=(sy*sw+sx)*4;
        d[o]=sd[si]; d[o+1]=sd[si+1]; d[o+2]=sd[si+2];
      }
    }

    gWhite.fill(0); gRed.fill(0); gBlack.fill(0); gYellow.fill(0);
    let arrowX=0,arrowY=0,arrowN=0;

    for (let y=6;y<BOARD-6;y++) {
      const row=y*BOARD*4;
      for (let x=6;x<BOARD-6;x++) {
        const i=row+x*4, r=d[i],g=d[i+1],b=d[i+2];
        const mn=Math.min(r,g,b), mx=Math.max(r,g,b);
        const ci=(((y/CELL)|0)*GW+((x/CELL)|0))*3;
        if (mn>200 && mx-mn<42) { gWhite[ci]++; gWhite[ci+1]+=x; gWhite[ci+2]+=y; }
        else if (r>175 && g<100 && b<130 && r-g>90) {
          // STRICT red: queen + striker mandala only — the orange
          // artwork circles on the wood fail the r-g>90 test
          gRed[ci]++; gRed[ci+1]+=x; gRed[ci+2]+=y;
        }
        else if (r>215 && g>170 && b<120 && g-b>75) {
          // yellow selection glow around the striker
          gYellow[ci]++; gYellow[ci+1]+=x; gYellow[ci+2]+=y;
        }
        else if (r>210 && g>55 && g<160 && b<75 && r-b>150) {
          arrowX+=x; arrowY+=y; arrowN++;      // vivid aim arrow (fallback)
        }
        else if (mx<92) { gBlack[ci]++; gBlack[ci+1]+=x; gBlack[ci+2]+=y; }
      }
    }

    const wb=blobs(gWhite,2), rb=blobs(gRed,2), bb=blobs(gBlack,3), yb=blobs(gYellow,2);

    // classify — real pieces are ROUND and FILLED; the artwork on the
    // wood (arrows, arcs, thin circles) is thin lines and fails both
    const dots=[], whitePieces=[];
    let strikerCand=null;
    for (const w of wb) {
      if (w.cnt>=4 && w.cnt<=90 && w.span<14) { dots.push({x:w.x,y:w.y,w:w.cnt}); continue; }
      if (w.span>=13 && w.span<=42 && w.cnt>90 && w.round>0.55) {
        // striker = white disc with the red mandala inside OR wrapped
        // by the yellow selection glow
        const red = rb.find(r=>r.span<22 && Math.hypot(r.x-w.x,r.y-w.y) < w.span*0.6);
        const glow = yb.find(yy=>yy.cnt>15 && Math.hypot(yy.x-w.x,yy.y-w.y) < w.span*0.9);
        if (red || glow) strikerCand={ x:w.x, y:w.y, r:Math.max(11,Math.min(16,w.span/2+2)) };
        else if (w.fill>0.4) whitePieces.push({ x:w.x, y:w.y, r:PIECE_R, color:'white' });
      }
    }
    const queen = rb.filter(r=>r.cnt>50 && r.span>=8 && r.span<=24 && r.round>0.55 &&
      (!strikerCand || Math.hypot(r.x-strikerCand.x,r.y-strikerCand.y)>strikerCand.r*1.5))
      .map(r=>({x:r.x,y:r.y,r:PIECE_R,color:'red'}));
    const blackPieces = bb.filter(b=>b.cnt>50 && b.span>=8 && b.span<=26 &&
      b.round>0.6 && b.fill>0.4 && !nearPocket(b.x,b.y))
      .map(b=>({x:b.x,y:b.y,r:PIECE_R,color:'black'}));

    pieces = whitePieces.concat(queen, blackPieces);

    if (strikerCand) {
      if (striker) {
        striker.x += (strikerCand.x-striker.x)*0.6;
        striker.y += (strikerCand.y-striker.y)*0.6;
      } else striker = strikerCand;
      strikerR = strikerCand.r;
      strikerSeen = performance.now();
    } else if (striker && performance.now()-strikerSeen>STRIKER_HOLD) striker=null;

    // aim line, ORIGIN LOCKED TO STRIKER CENTER
    if (striker && dots.length>=2) {
      // most stable: mean unit-vector from the striker to each dot —
      // correct sign automatically + rejects scattered highlights
      let dx=0,dy=0,Wsum=0;
      for (const p of dots) {
        const vx=p.x-striker.x, vy=p.y-striker.y;
        const L=Math.hypot(vx,vy);
        if (L<striker.r*0.9 || L>BOARD) continue;
        dx+=p.w*vx/L; dy+=p.w*vy/L; Wsum+=p.w;
      }
      const n=Math.hypot(dx,dy);
      if (Wsum>0 && n/Wsum>0.85) {          // dots well-aligned, not glints
        update({x:striker.x,y:striker.y}, {x:dx/n,y:dy/n});
        return output();
      }
    }
    if (dots.length>=3) {
      const fit=fitLine(dots);
      if (fit) {
        let dir=fit.dir, origin=null;
        if (striker) {
          const cx=dots.reduce((s,p)=>s+p.x,0)/dots.length,
                cy=dots.reduce((s,p)=>s+p.y,0)/dots.length;
          const toDots={x:cx-striker.x, y:cy-striker.y};
          if (dir.x*toDots.x+dir.y*toDots.y<0) dir={x:-dir.x,y:-dir.y};
          origin={x:striker.x, y:striker.y};
        } else if (arrowN>25) {
          const A={x:arrowX/arrowN,y:arrowY/arrowN};
          const t=dots.map(p=>(p.x-fit.c.x)*dir.x+(p.y-fit.c.y)*dir.y);
          const pMin=ext(fit,Math.min(...t)), pMax=ext(fit,Math.max(...t));
          if (Math.hypot(A.x-pMin.x,A.y-pMin.y)<=Math.hypot(A.x-pMax.x,A.y-pMax.y)) {
            origin=pMin;
            if ((pMax.x-pMin.x)*dir.x+(pMax.y-pMin.y)*dir.y<0) dir={x:-dir.x,y:-dir.y};
          } else { origin=pMax; dir={x:-dir.x,y:-dir.y}; }
        } else if (aim) {
          if (dir.x*aim.dir.x+dir.y*aim.dir.y<0) dir={x:-dir.x,y:-dir.y};
          origin=aim.origin;
        }
        if (origin) update(origin,dir);
      }
    }
    return output();
  }

  function ext(fit,t){ return {x:fit.c.x+fit.dir.x*t, y:fit.c.y+fit.dir.y*t}; }

  function fitLine(pts) {
    let W=0,mx=0,my=0;
    for (const p of pts){ W+=p.w; mx+=p.x*p.w; my+=p.y*p.w; }
    mx/=W; my/=W;
    let sxx=0,sxy=0,syy=0;
    for (const p of pts){ const dx=p.x-mx,dy=p.y-my;
      sxx+=dx*dx*p.w; sxy+=dx*dy*p.w; syy+=dy*dy*p.w; }
    const th=0.5*Math.atan2(2*sxy,sxx-syy);
    const dir={x:Math.cos(th),y:Math.sin(th)};
    let err=0;
    for (const p of pts){ const dx=p.x-mx,dy=p.y-my;
      err+=Math.abs(dx*-dir.y+dy*dir.x)*p.w; }
    if (err/W>6) return null;
    return { c:{x:mx,y:my}, dir };
  }

  function update(origin,dir) {
    const n=Math.hypot(dir.x,dir.y)||1; dir={x:dir.x/n,y:dir.y/n};
    if (aim) {
      const aN=Math.atan2(dir.y,dir.x), aO=Math.atan2(aim.dir.y,aim.dir.x);
      let dA=aN-aO;
      while(dA>Math.PI)dA-=2*Math.PI; while(dA<-Math.PI)dA+=2*Math.PI;
      const dP=Math.hypot(origin.x-aim.origin.x,origin.y-aim.origin.y);
      if (Math.abs(dA)<DEAD_ANG && dP<DEAD_POS){ lastSeen=performance.now(); return; }
      const ang=aO+dA*SMOOTH;
      aim={ origin:{ x:aim.origin.x+(origin.x-aim.origin.x)*SMOOTH,
                     y:aim.origin.y+(origin.y-aim.origin.y)*SMOOTH },
            dir:{x:Math.cos(ang),y:Math.sin(ang)} };
    } else aim={origin,dir};
    lastSeen=performance.now();
  }

  function output() {
    if (aim && performance.now()-lastSeen>HOLD_MS) aim=null;
    return { aim, pieces, striker, strikerR };
  }

  return { initMats, buildWarp, detect, resetAim(){ aim=null; striker=null; pieces=[]; } };
})();

/* ============================================================ PHYSICS
   Board space: pockets at 0/400, real WALLS at -WALL_M..400+WALL_M.
   Simple pro view: striker line + at most ONE bounce; if a piece is
   hit: stop there, highlight the piece, ONE line for where it goes. */
const Physics = (() => {
  const EPS=0.001;

  function cast(o,d) {
    const xLo=-WALLS.l, xHi=BOARD+WALLS.r, yLo=-WALLS.t, yHi=BOARD+WALLS.b;
    let tMin=Infinity, best=null;
    const chk=(t,wall)=>{ if(t<=EPS||t>=tMin)return;
      const x=o.x+d.x*t, y=o.y+d.y*t;
      if (x<xLo-1||x>xHi+1||y<yLo-1||y>yHi+1) return;
      tMin=t; best={x:Math.max(xLo,Math.min(xHi,x)),y:Math.max(yLo,Math.min(yHi,y)),wall,t}; };
    if (d.x<-EPS) chk((xLo-o.x)/d.x,'left');
    if (d.x> EPS) chk((xHi-o.x)/d.x,'right');
    if (d.y<-EPS) chk((yLo-o.y)/d.y,'top');
    if (d.y> EPS) chk((yHi-o.y)/d.y,'bottom');
    return best;
  }

  function circleHit(o, d, len, pieces, rStriker) {
    let best=null;
    for (const pc of pieces) {
      const rSum=rStriker+pc.r;
      const ox=o.x-pc.x, oy=o.y-pc.y;
      const b=ox*d.x+oy*d.y;
      const c=ox*ox+oy*oy-rSum*rSum;
      const disc=b*b-c;
      if (disc<0) continue;
      const t=-b-Math.sqrt(disc);
      if (t>2 && t<len && (!best||t<best.t)) best={t,piece:pc};
    }
    return best;
  }

  function compute(origin, dir, pieces, rStriker) {
    const out={ main:[], mainBounces:[], hit:null, pieceSegs:null };
    let o={...origin}, d={...dir};

    for (let s=0; s<2; s++) {                    // direct + ONE bounce max
      const wall=cast(o,d);
      if (!wall) break;
      const ch=circleHit(o,d,wall.t,pieces,rStriker);
      if (ch) {
        const S={x:o.x+d.x*ch.t, y:o.y+d.y*ch.t};
        out.main.push({a:{...o}, b:S});
        const P=ch.piece;
        let nx=P.x-S.x, ny=P.y-S.y;
        const nl=Math.hypot(nx,ny)||1; nx/=nl; ny/=nl;
        // piece line: one continuous line WITH its wall bounce
        out.pieceSegs=[];
        let po={x:P.x,y:P.y}, pd={x:nx,y:ny};
        for (let k=0;k<2;k++) {
          const pw=cast(po,pd);
          if (!pw) break;
          out.pieceSegs.push({a:{...po}, b:{x:pw.x,y:pw.y}});
          if (pw.wall==='left'||pw.wall==='right') pd={x:-pd.x,y:pd.y}; else pd={x:pd.x,y:-pd.y};
          po={x:pw.x+pd.x*EPS, y:pw.y+pd.y*EPS};
        }
        out.hit={ point:S, piece:P };
        return out;
      }
      out.main.push({a:{...o}, b:{x:wall.x,y:wall.y}});
      if (s===0) out.mainBounces.push({x:wall.x,y:wall.y});
      if (wall.wall==='left'||wall.wall==='right') d={x:-d.x,y:d.y}; else d={x:d.x,y:-d.y};
      o={x:wall.x+d.x*EPS, y:wall.y+d.y*EPS};
    }
    return out;
  }

  return { compute };
})();

/* ============================================================ DRAW */
const Draw = (() => {
  const canvas=document.getElementById('overlay');
  const ctx=canvas.getContext('2d');

  function clear(){ ctx.clearRect(0,0,canvas.width,canvas.height); }

  function quad(q, editing) {
    ctx.save();
    if (editing) {
      ctx.fillStyle='rgba(0,0,0,0.5)';
      ctx.beginPath();
      ctx.rect(0,0,canvas.width,canvas.height);
      ctx.moveTo(q[0].x,q[0].y);
      for (let i=3;i>=0;i--) ctx.lineTo(q[i].x,q[i].y);
      ctx.closePath(); ctx.fill('evenodd');
      ctx.strokeStyle='#ffb347'; ctx.lineWidth=3; path(q); ctx.stroke();
      for (const p of q) {
        ctx.fillStyle='rgba(255,179,71,0.25)';
        ctx.beginPath(); ctx.arc(p.x,p.y,26,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='#ffb347';
        ctx.beginPath(); ctx.arc(p.x,p.y,9,0,Math.PI*2); ctx.fill();
        ctx.strokeStyle='#05080c'; ctx.lineWidth=2;
        ctx.beginPath(); ctx.arc(p.x,p.y,9,0,Math.PI*2); ctx.stroke();
      }
    } else {
      ctx.strokeStyle='rgba(0,0,0,0.55)'; ctx.lineWidth=2.5; path(q); ctx.stroke();
      ctx.strokeStyle='rgba(109,255,158,0.35)'; ctx.lineWidth=1; path(q); ctx.stroke();
    }
    ctx.restore();
  }
  function path(q){ ctx.beginPath(); ctx.moveTo(q[0].x,q[0].y);
    for (let i=1;i<4;i++) ctx.lineTo(q[i].x,q[i].y); ctx.closePath(); }

  // ghost: ONLY the 4 pocket arcs (verified tracker) + the real wall
  // border drawn slightly OUTSIDE the pocket-center square
  function template(b2v) {
    ctx.save();
    const stroke=(fn)=>{ ctx.strokeStyle='rgba(0,0,0,0.5)'; ctx.lineWidth=4.5; fn();
                         ctx.strokeStyle='rgba(120,255,170,0.75)'; ctx.lineWidth=2; fn(); };
    // FULL pocket circles at the 4 corners — big clear anchors for
    // judging the calibration and tuning the wall edges
    stroke(()=>{ ctx.beginPath();
      const R=POCKET_R*1.18, steps=26;
      for (const [cx,cy] of [[0,0],[BOARD,0],[BOARD,BOARD],[0,BOARD]]) {
        for (let s=0;s<=steps;s++) {
          const a=(s/steps)*Math.PI*2;
          const v=b2v({ x:cx+Math.cos(a)*R, y:cy+Math.sin(a)*R });
          if (s===0) ctx.moveTo(v.x,v.y); else ctx.lineTo(v.x,v.y);
        }
      }
      ctx.stroke(); });
    // small cross at each pocket center (the exact lock point)
    stroke(()=>{ ctx.beginPath();
      for (const [cx,cy] of [[0,0],[BOARD,0],[BOARD,BOARD],[0,BOARD]]) {
        const c=b2v({x:cx,y:cy});
        const s=Math.max(5, POCKET_R*0.35 * (Math.hypot(b2v({x:BOARD,y:0}).x-b2v({x:0,y:0}).x, b2v({x:BOARD,y:0}).y-b2v({x:0,y:0}).y)/BOARD));
        ctx.moveTo(c.x-s,c.y); ctx.lineTo(c.x+s,c.y);
        ctx.moveTo(c.x,c.y-s); ctx.lineTo(c.x,c.y+s);
      }
      ctx.stroke(); });
    // wall border (behind the pockets)
    stroke(()=>{ ctx.beginPath();
      const cs=[{x:-WALLS.l,y:-WALLS.t},{x:BOARD+WALLS.r,y:-WALLS.t},
                {x:BOARD+WALLS.r,y:BOARD+WALLS.b},{x:-WALLS.l,y:BOARD+WALLS.b}];
      cs.forEach((p,i)=>{ const v=b2v(p); i?ctx.lineTo(v.x,v.y):ctx.moveTo(v.x,v.y); });
      ctx.closePath(); ctx.stroke(); });
    ctx.restore();
  }

  // dotted path — measured from the real game video:
  // dot Ø ≈ 3 board-units, spacing ≈ 10.4, dots taper toward the end,
  // each dot has a small drop-shadow offset downward
  function dotPath(segs, b2v, color, baseR, gap) {
    if (!segs || !segs.length) return;
    ctx.save();
    // pixels-per-board-unit from the current homography
    const o0=b2v({x:0,y:0}), o1=b2v({x:BOARD,y:0});
    const scale=Math.hypot(o1.x-o0.x,o1.y-o0.y)/BOARD;
    const totalLen = segs.reduce((s,seg)=>s+Math.hypot(seg.b.x-seg.a.x,seg.b.y-seg.a.y),0)||1;
    let walked=0;
    for (const s of segs) {
      const dx=s.b.x-s.a.x, dy=s.b.y-s.a.y;
      const len=Math.hypot(dx,dy);
      if (len<0.5) continue;
      const ux=dx/len, uy=dy/len;
      for (let t=0; t<=len; t+=gap) {
        const taper = 1.15 - 0.4*((walked+t)/totalLen);   // shrink like the game
        const rr = Math.max(2, baseR*scale*taper);
        const v=b2v({x:s.a.x+ux*t, y:s.a.y+uy*t});
        ctx.fillStyle='rgba(45,28,12,0.4)';                // drop shadow
        ctx.beginPath(); ctx.arc(v.x, v.y+rr*0.8, rr, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle=color;
        ctx.beginPath(); ctx.arc(v.x, v.y, rr, 0, Math.PI*2); ctx.fill();
      }
      walked+=len;
    }
    // arrowhead at the very end, scaled
    const l=segs[segs.length-1], a=b2v(l.a), b=b2v(l.b);
    const ang=Math.atan2(b.y-a.y,b.x-a.x);
    const ah=Math.max(9, 5.5*scale);
    ctx.fillStyle=color;
    ctx.beginPath();
    ctx.moveTo(b.x+ah*0.7*Math.cos(ang), b.y+ah*0.7*Math.sin(ang));
    ctx.lineTo(b.x-ah*Math.cos(ang-0.45), b.y-ah*Math.sin(ang-0.45));
    ctx.lineTo(b.x-ah*Math.cos(ang+0.45), b.y-ah*Math.sin(ang+0.45));
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function line(segs, b2v, color, glow, width, dash) {
    if (!segs || !segs.length) return;
    ctx.save(); ctx.lineCap='round';
    if (glow){ ctx.strokeStyle=glow; ctx.lineWidth=width+4.5; sp(segs,b2v); }
    ctx.strokeStyle=color; ctx.lineWidth=width;
    if (dash) ctx.setLineDash(dash);
    sp(segs,b2v);
    ctx.setLineDash([]);
    // arrowhead
    const l=segs[segs.length-1], a=b2v(l.a), b=b2v(l.b);
    const ang=Math.atan2(b.y-a.y,b.x-a.x);
    ctx.fillStyle=color;
    ctx.beginPath();
    ctx.moveTo(b.x,b.y);
    ctx.lineTo(b.x-13*Math.cos(ang-0.4), b.y-13*Math.sin(ang-0.4));
    ctx.lineTo(b.x-13*Math.cos(ang+0.4), b.y-13*Math.sin(ang+0.4));
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  function sp(segs,b2v){ ctx.beginPath();
    segs.forEach((s,i)=>{ const a=b2v(s.a), b=b2v(s.b);
      if(i===0) ctx.moveTo(a.x,a.y); else ctx.lineTo(a.x,a.y);
      ctx.lineTo(b.x,b.y); });
    ctx.stroke(); }

  function dots(pts,b2v,color) {
    ctx.save(); ctx.fillStyle=color;
    for (const p of pts){ const v=b2v(p);
      ctx.beginPath(); ctx.arc(v.x,v.y,4.5,0,Math.PI*2); ctx.fill(); }
    ctx.restore();
  }

  function ring(p,b2v,r,color) {
    const v=b2v(p);
    ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.arc(v.x,v.y,r,0,Math.PI*2); ctx.stroke();
    ctx.restore();
  }

  return { canvas, clear, quad, template, dotPath, line, dots, ring };
})();

/* ============================================================ APP */
(() => {
  const ANALYZE_MS=28;
  const fpsEl=document.getElementById('fps'), latEl=document.getElementById('lat'),
        cvEl=document.getElementById('cvStatus'),
        btnCal=document.getElementById('btnCalibrate'),
        btnLines=document.getElementById('btnLines'),
        picker=document.getElementById('picker');

  let cvReady=true, camReady=false, linesOn=true;   // no OpenCV — ready at once
  let lastAnalyze=0, latency=0, frames=0, fpsTime=performance.now();
  let result=null, paths=null, dispAim=null;
  let edgeDrag=null;               // wall-edge tuning drag
  let mode='hit';                  // 'wall' = striker + bounce line only, 'hit' = piece targeting
  try { const m=localStorage.getItem('carrom_mode'); if (m==='wall'||m==='hit') mode=m; } catch(e){}

  Calib.onChanged = () => { Detector.buildWarp(Calib.quad); Detector.resetAim(); };

  // engine is pure JS — mark ready straight away
  cvEl.textContent='READY'; cvEl.classList.add('ok');

  function begin(promise) {
    promise.then(({w,h})=>{
      picker.style.display='none'; camReady=true;
      Detector.initMats(w,h);
      UI.showMsg('اضغط AUTO ⌖ للمطابقة الذاتية', 3500);
      requestAnimationFrame(loop);
    }).catch(err=>{ UI.showMsg('ERROR: '+err.name,4000); console.error(err); });
  }
  document.getElementById('pickCamera').addEventListener('click',()=>begin(Source.startCamera()));
  document.getElementById('pickScreen').addEventListener('click',()=>begin(Source.startScreen()));

  // AUTO FIT — pure JS, instant
  document.getElementById('btnAuto').addEventListener('click',()=>{
    if (!camReady){ UI.showMsg('افتح المصدر أول',1500); return; }
    UI.showMsg('جاري المطابقة...');
    setTimeout(()=>{
      if (AutoFit.run()) { btnCal.textContent='ADJUST'; btnCal.classList.remove('ok'); }
    }, 20);
  });

  // manual adjust
  btnCal.addEventListener('click',()=>{
    if (!camReady){ UI.showMsg('افتح المصدر أول',1500); return; }
    if (Calib.editing){ Calib.confirm(); btnCal.textContent='ADJUST'; btnCal.classList.remove('ok'); }
    else { Calib.startEdit(); btnCal.textContent='OK ✓'; btnCal.classList.add('ok'); }
  });

  document.getElementById('btnReset').addEventListener('click',()=>{
    Calib.reset(); Detector.resetAim(); result=null; paths=null;
    btnCal.textContent='ADJUST'; btnCal.classList.remove('ok');
    UI.showMsg('RESET',900);
  });

  btnLines.addEventListener('click',()=>{
    linesOn=!linesOn;
    btnLines.classList.toggle('active',linesOn);
  });

  const mW=document.getElementById('modeWall'), mH=document.getElementById('modeHit');
  function setMode(m){
    mode=m;
    mW.classList.toggle('active',m==='wall');
    mH.classList.toggle('active',m==='hit');
    try{ localStorage.setItem('carrom_mode',m); }catch(e){}
  }
  mW.addEventListener('click',()=>setMode('wall'));
  mH.addEventListener('click',()=>setMode('hit'));
  setMode(mode);

  // zoom buttons
  document.getElementById('zoomIn').addEventListener('click',()=>Source.setZoom(Source.getZoom()+Source.zoomStep()));
  document.getElementById('zoomOut').addEventListener('click',()=>Source.setZoom(Source.getZoom()-Source.zoomStep()));

  // pointer: quad drag (1 finger) + pinch zoom (2 fingers)
  const ov=Draw.canvas;
  const ptrs=new Map();
  let pinchStart=null;

  ov.addEventListener('pointerdown', e=>{
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if (ptrs.size===2) {
      const [a,b]=[...ptrs.values()];
      pinchStart={ dist:Math.hypot(a.x-b.x,a.y-b.y), zoom:Source.getZoom() };
      edgeDrag=null; Calib.onUp();
      return;
    }
    if (!Calib.quad) return;
    e.preventDefault();
    const vp = Source.toVideoCoords(e.clientX,e.clientY);
    // wall-edge tuning: grab a border edge while locked
    if (Calib.locked && !Calib.editing) {
      const bp = Calib.videoToBoard(vp);
      const near = 16;
      if (Math.abs(bp.x-(-WALLS.l))<near && bp.y>-40 && bp.y<BOARD+40) edgeDrag='l';
      else if (Math.abs(bp.x-(BOARD+WALLS.r))<near && bp.y>-40 && bp.y<BOARD+40) edgeDrag='r';
      else if (Math.abs(bp.y-(-WALLS.t))<near && bp.x>-40 && bp.x<BOARD+40) edgeDrag='t';
      else if (Math.abs(bp.y-(BOARD+WALLS.b))<near && bp.x>-40 && bp.x<BOARD+40) edgeDrag='b';
      if (edgeDrag){ ov.setPointerCapture(e.pointerId); return; }
    }
    if (Calib.onDown(vp)) ov.setPointerCapture(e.pointerId);
  });
  ov.addEventListener('pointermove', e=>{
    if (!ptrs.has(e.pointerId)) return;
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if (ptrs.size===2 && pinchStart) {
      const [a,b]=[...ptrs.values()];
      const dist=Math.hypot(a.x-b.x,a.y-b.y);
      Source.setZoom(pinchStart.zoom * dist/pinchStart.dist);
      return;
    }
    if (edgeDrag) {
      const bp = Calib.videoToBoard(Source.toVideoCoords(e.clientX,e.clientY));
      const clamp=v=>Math.max(0,Math.min(28,v));
      if (edgeDrag==='l') WALLS.l=clamp(-bp.x);
      else if (edgeDrag==='r') WALLS.r=clamp(bp.x-BOARD);
      else if (edgeDrag==='t') WALLS.t=clamp(-bp.y);
      else if (edgeDrag==='b') WALLS.b=clamp(bp.y-BOARD);
      return;
    }
    if (Calib.quad) Calib.onMove(Source.toVideoCoords(e.clientX,e.clientY));
  });
  const endPtr = e=>{
    ptrs.delete(e.pointerId);
    if (ptrs.size<2) pinchStart=null;
    if (edgeDrag){ saveWalls(); edgeDrag=null; UI.showMsg('انحفظ ضبط الجدار ✓',1200); }
    Calib.onUp();
  };
  ov.addEventListener('pointerup',endPtr);
  ov.addEventListener('pointercancel',endPtr);

  function pieceRadiusPx(b2v, rBoard) {
    const a=b2v({x:0,y:0}), b=b2v({x:BOARD,y:0});
    return Math.hypot(b.x-a.x,b.y-a.y)/BOARD * rBoard;
  }

  function loop(now) {
    if (Calib.locked && now-lastAnalyze>=ANALYZE_MS) {
      lastAnalyze=now;
      const t0=performance.now();
      try { result = Detector.detect(Source.video); }
      catch(e){ console.error(e); }
      latency=Math.round(performance.now()-t0);
    }

    // silky line motion: displayed aim glides toward the detected aim
    const target = result && result.aim;
    if (target && Calib.locked) {
      const tAng=Math.atan2(target.dir.y,target.dir.x);
      if (!dispAim) dispAim={x:target.origin.x,y:target.origin.y,ang:tAng};
      else {
        let dA=tAng-dispAim.ang;
        while(dA>Math.PI)dA-=2*Math.PI; while(dA<-Math.PI)dA+=2*Math.PI;
        // snap fast when the change is large (live tracking), smooth when tiny (kill jitter)
        const mag=Math.abs(dA);
        const k = mag>0.05 ? 0.6 : 0.3;
        dispAim.ang+=dA*k;
        dispAim.x+=(target.origin.x-dispAim.x)*0.5;
        dispAim.y+=(target.origin.y-dispAim.y)*0.5;
      }
      paths=Physics.compute({x:dispAim.x,y:dispAim.y},
        {x:Math.cos(dispAim.ang),y:Math.sin(dispAim.ang)},
        mode==='wall' ? [] : result.pieces, result.strikerR);
    } else { dispAim=null; paths=null; }

    Draw.clear();
    if (Calib.quad && Calib.editing) Draw.quad(Calib.quad, true);
    if (Calib.locked && !Calib.editing) Draw.template(Calib.boardToVideo);

    if (linesOn && paths && Calib.locked) {
      const b2v=Calib.boardToVideo;
      if (mode==='wall') {
        // WALL mode: striker line white + its reflection as a SECOND
        // gold line stopping at the opposite wall
        Draw.dotPath([paths.main[0]], b2v, '#ffffff', 1.9, 10.4);
        if (paths.main[1]) Draw.dotPath([paths.main[1]], b2v, '#ffb347', 1.9, 10.4);
        Draw.dots(paths.mainBounces, b2v, '#ffffff');
      } else {
        // HIT mode: striker line to the piece, circle the piece,
        // one gold line (with its bounce) for where the piece goes
        Draw.dotPath(paths.main, b2v, '#ffffff', 1.9, 10.4);
        Draw.dots(paths.mainBounces, b2v, '#ffb347');
        if (paths.hit) {
          const pr = Math.max(8, pieceRadiusPx(b2v, paths.hit.piece.r));
          Draw.ring({x:paths.hit.piece.x, y:paths.hit.piece.y}, b2v, pr,
            paths.hit.piece.color==='red' ? '#ff4d4d' :
            paths.hit.piece.color==='black' ? '#b8f7ff' : '#ffe9a8');
          if (paths.pieceSegs) Draw.dotPath(paths.pieceSegs, b2v, '#ffb347', 1.9, 10.4);
        }
      }
      if (result && result.striker)
        Draw.ring({x:result.striker.x,y:result.striker.y}, b2v,
          pieceRadiusPx(b2v, result.strikerR), '#35b6ff');
    }

    frames++;
    if (now-fpsTime>=1000){ fpsEl.textContent=frames; latEl.textContent=latency; frames=0; fpsTime=now; }
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
