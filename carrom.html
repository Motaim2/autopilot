<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#05080c">
<title>MOTAIM Carrom Line PRO</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  width:100%; height:100%; background:#05080c; overflow:hidden;
  font-family:"SF Mono","Roboto Mono",Consolas,monospace;
  -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;
}
#stage { position:fixed; inset:0; overflow:hidden; }
#zoomWrap { position:absolute; inset:0; transform-origin:50% 50%; }
#cam { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; background:#05080c; }
#overlay { position:absolute; touch-action:none; }

#picker {
  position:absolute; inset:0; z-index:50; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:18px;
  background:radial-gradient(ellipse at center,#0c1420 0%,#05080c 70%);
}
#picker h1 { color:#e8f4ff; font-size:17px; letter-spacing:2px; font-weight:700; }
#picker p { color:#8fa3b8; font-size:11px; max-width:300px; text-align:center; line-height:1.7; direction:rtl; }
.srcBtn {
  width:240px; padding:16px; border-radius:10px; cursor:pointer;
  border:1px solid rgba(53,182,255,.5); background:rgba(10,18,28,.9);

}

.srcBtn:active { background:rgba(53,182,255,.2); }

  position:absolute; top:0; left:0; right:0; display:flex; gap:12px;

}
.hud-item b { color:#fff; font-weight:600; }

  position:absolute; top:46px; left:50%; transform:translateX(-50%);

}

</style>
</head>
<body>

<div id="stage">
  <div id="zoomWrap">
    <video id="cam" autoplay playsinline muted></video>

  <div id="hud">

  </div>

  <div id="picker">
    <h1>MOTAIM CARROM PRO</h1>
    <button class="srcBtn" id="pickCamera">CAMERA
      <small>صوّر شاشة الآيفون — ثم اضغط AUTO للمطابقة الذاتية</small>
    </button>
    <button class="srcBtn" id="pickScreen">SCREEN CAPTURE
      <small>للكمبيوتر — نافذة LDPlayer أو انعكاس الآيفون</small>
    </button>
    <p>AUTO ⌖ يكتشف حدود اللوحة تلقائيًا من الإطار البرتقالي والحفر الأربع. إذا تحرك الجوال اضغطه مرة ثانية. وللضبط اليدوي: ADJUST أو اسحب الإطار بإصبعك</p>
  </div>

<script>
var Module = { onRuntimeInitialized: function(){ window.dispatchEvent(new Event('opencv-ready')); } };
</script>
<script async src="https://docs.opencv.org/4.9.0/opencv.js"></script>

<script>
'use strict';

const BOARD = 400;               // internal board space
const STRIKER_R = 13;            // radii in board units (auto-refined from detection)
const PIECE_R = 10;

/* ============================================================ UI */
const UI = (() => {
  const msg = document.getElementById('msg');
  let t = null;
  return {
    showMsg(text, autoHide) {
      msg.textContent = text; msg.classList.add('show');
      clearTimeout(t);
      if (autoHide) t = setTimeout(()=>msg.classList.remove('show'), autoHide);
    },
    hideMsg(){ msg.classList.remove('show'); }
  };
})();

/* ============================================================ SOURCE + ZOOM */
const Source = (() => {
  const video = document.getElementById('cam');
  const overlay = document.getElementById('overlay');
  const wrap = document.getElementById('zoomWrap');
  let viewRect = { left:0, top:0, width:0, height:0 };
  let track = null;
  let hwZoom = null;               // {min,max,step} if camera supports optical/sensor zoom
  let zoom = 1;                    // current zoom (hw value or digital scale)

  async function startScreen() {
    const s = await navigator.mediaDevices.getDisplayMedia({ video:{ frameRate:{ideal:30} }, audio:false });
    return attach(s);
  }
  async function startCamera() {
    const s = await navigator.mediaDevices.getUserMedia({
      audio:false,
      video:{ facingMode:{ideal:'environment'}, width:{ideal:1280}, height:{ideal:720}, frameRate:{ideal:30} }
    });
    return attach(s);
  }
  async function attach(stream) {
    video.srcObject = stream;
    track = stream.getVideoTracks()[0];
    try {
      const caps = track.getCapabilities ? track.getCapabilities() : {};
      if (caps.zoom) { hwZoom = caps.zoom; zoom = track.getSettings().zoom || caps.zoom.min || 1; }
    } catch(e){}
    await new Promise(res => { if (video.readyState>=2) return res(); video.onloadedmetadata=()=>res(); });
    await video.play();
    fitOverlay();
    return { w: video.videoWidth, h: video.videoHeight };
  }

  function fitOverlay() {
    const vw=video.videoWidth, vh=video.videoHeight;
    if (!vw||!vh) return;
    const sw=window.innerWidth, sh=window.innerHeight;
    const s=Math.min(sw/vw, sh/vh);
    viewRect={ width:vw*s, height:vh*s, left:(sw-vw*s)/2, top:(sh-vh*s)/2 };
    overlay.width=vw; overlay.height=vh;
    overlay.style.left=viewRect.left+'px'; overlay.style.top=viewRect.top+'px';
    overlay.style.width=viewRect.width+'px'; overlay.style.height=viewRect.height+'px';
  }

  async function setZoom(z) {
    if (hwZoom) {
      zoom = Math.max(hwZoom.min, Math.min(hwZoom.max, z));
      try { await track.applyConstraints({ advanced:[{ zoom }] }); } catch(e){}
    } else {
      zoom = Math.max(1, Math.min(4, z));
      wrap.style.transform = zoom===1 ? '' : 'scale('+zoom+')';
    }
    document.getElementById('zoomVal').textContent = zoom.toFixed(1)+'x';
    return zoom;
  }
  function getZoom(){ return zoom; }
  function zoomStep(){ return hwZoom ? Math.max((hwZoom.max-hwZoom.min)/10, hwZoom.step||0.1) : 0.25; }

  // screen -> video px (accounts for digital zoom transform around screen center)
  function toVideoCoords(cx, cy) {
    if (!hwZoom && zoom !== 1) {
      const sw=window.innerWidth/2, sh=window.innerHeight/2;
      cx = (cx-sw)/zoom + sw;
      cy = (cy-sh)/zoom + sh;
    }
    return {
      x:(cx-viewRect.left)*(video.videoWidth/viewRect.width),
      y:(cy-viewRect.top)*(video.videoHeight/viewRect.height)
    };
  }

  window.addEventListener('resize', fitOverlay);
  window.addEventListener('orientationchange', ()=>setTimeout(fitOverlay,300));

  return { video, overlay, startScreen, startCamera, toVideoCoords, setZoom, getZoom, zoomStep };
})();

/* ============================================================ CALIBRATION (quad + homography) */
const Calib = (() => {
  let quad=null, editing=false, locked=false;
  let H=null, Hinv=null, drag=null;
  const HANDLE_R = 36;
  let onQuadChanged = null;        // callback -> rebuild warp

  function defaultQuad() {
    const v=Source.video, w=v.videoWidth, h=v.videoHeight;
    const size=Math.min(w,h)*0.62, cx=w/2, cy=h/2;
    return [ {x:cx-size/2,y:cy-size/2},{x:cx+size/2,y:cy-size/2},
             {x:cx+size/2,y:cy+size/2},{x:cx-size/2,y:cy+size/2} ];
  }

  function setQuad(q) {            // used by AUTO fit
    quad = q; editing=false;
    computeH(); locked=true;
    if (onQuadChanged) onQuadChanged();
  }

  function startEdit() {
    if (!quad) quad = defaultQuad();
    editing=true; locked=false;
    UI.showMsg('اسحب المقابض أو حرّك الإطار كامل ثم اضغط OK');
  }
  function confirm() {
    editing=false; computeH(); locked=true;
    if (onQuadChanged) onQuadChanged();
    UI.showMsg('تم حفظ الحدود ✓', 1400);
  }
  function reset(){ quad=null; editing=false; locked=false; H=Hinv=null; drag=null; UI.hideMsg(); }

  function computeH() {
    const src=cv.matFromArray(4,1,cv.CV_32FC2,[
      quad[0].x,quad[0].y, quad[1].x,quad[1].y, quad[2].x,quad[2].y, quad[3].x,quad[3].y]);
    const dst=cv.matFromArray(4,1,cv.CV_32FC2,[0,0,BOARD,0,BOARD,BOARD,0,BOARD]);
    const M=cv.getPerspectiveTransform(src,dst), Mi=cv.getPerspectiveTransform(dst,src);
    H=new Float64Array(M.data64F); Hinv=new Float64Array(Mi.data64F);
    src.delete(); dst.delete(); M.delete(); Mi.delete();
  }
  function apply(M,p){ const w=M[6]*p.x+M[7]*p.y+M[8];
    return {x:(M[0]*p.x+M[1]*p.y+M[2])/w, y:(M[3]*p.x+M[4]*p.y+M[5])/w}; }

  function inside(p) {
    let c=false;
    for (let i=0,j=3;i<4;j=i++)
      if ((quad[i].y>p.y)!==(quad[j].y>p.y) &&
          p.x<(quad[j].x-quad[i].x)*(p.y-quad[i].y)/(quad[j].y-quad[i].y)+quad[i].x) c=!c;
    return c;
  }

  // drag: corner handles only while editing; whole-quad move works even when locked
  function onDown(p) {
    if (!quad) return false;
    if (editing) {
      for (let i=0;i<4;i++)
        if (Math.hypot(p.x-quad[i].x,p.y-quad[i].y)<HANDLE_R) { drag={idx:i}; return true; }
    }
    if (inside(p)) { drag={move:true,start:p,orig:quad.map(q=>({...q}))}; return true; }
    return false;
  }
  function onMove(p) {
    if (!drag) return;
    if (drag.move) {
      const dx=p.x-drag.start.x, dy=p.y-drag.start.y;
      quad = drag.orig.map(q=>({x:q.x+dx,y:q.y+dy}));
    } else quad[drag.idx]=p;
  }
  function onUp() {
    if (drag && locked) {          // moved whole quad while locked -> re-lock at new place
      computeH();
      if (onQuadChanged) onQuadChanged();
    }
    drag=null;
  }

  return {
    get quad(){return quad;}, get editing(){return editing;}, get locked(){return locked;},
    set onChanged(f){ onQuadChanged=f; },
    setQuad, startEdit, confirm, reset, onDown, onMove, onUp,
    boardToVideo:p=>apply(Hinv,p)
  };
})();

/* ============================================================ AUTO FIT
   Detects the board from its ORANGE frame; the inner hole of the
   orange ring = playing-field walls. Corners refined to sub-pixel,
   then validated against the 4 dark corner pockets. */
const AutoFit = (() => {
  const AW = 640;
  const c = document.createElement('canvas');
  const cx2 = c.getContext('2d', { willReadFrequently:true });

  function run() {
    const v = Source.video;
    const scale = AW / v.videoWidth;
    c.width = AW; c.height = Math.round(v.videoHeight*scale);
    cx2.drawImage(v, 0, 0, c.width, c.height);

    let src=null, hsv=null, mask=null, kernel=null, contours=null, hier=null, gray=null;
    try {
      src = cv.imread(c);
      hsv = new cv.Mat();
      cv.cvtColor(src, hsv, cv.COLOR_RGBA2RGB);
      cv.cvtColor(hsv, hsv, cv.COLOR_RGB2HSV);

      // orange frame mask
      mask = new cv.Mat();
      const lo = new cv.Mat(hsv.rows, hsv.cols, hsv.type(), [5,110,110,0]);
      const hi = new cv.Mat(hsv.rows, hsv.cols, hsv.type(), [26,255,255,255]);
      cv.inRange(hsv, lo, hi, mask);
      lo.delete(); hi.delete();

      kernel = cv.getStructuringElement(cv.MORPH_ELLIPSE, new cv.Size(7,7));
      cv.morphologyEx(mask, mask, cv.MORPH_CLOSE, kernel);

      // outer contour + its inner hole
      contours = new cv.MatVector(); hier = new cv.Mat();
      cv.findContours(mask, contours, hier, cv.RETR_CCOMP, cv.CHAIN_APPROX_SIMPLE);

      let outerIdx=-1, outerArea=0;
      for (let i=0;i<contours.size();i++) {
        if (hier.data32S[i*4+3] !== -1) continue;          // only top-level
        const a = cv.contourArea(contours.get(i));
        if (a>outerArea) { outerArea=a; outerIdx=i; }
      }
      if (outerIdx<0 || outerArea < c.width*c.height*0.08) return fail('ما لقيت الإطار البرتقالي — قرّب الكاميرا');

      // biggest hole inside the orange ring = playing field
      let holeIdx=-1, holeArea=0;
      for (let i=0;i<contours.size();i++) {
        if (hier.data32S[i*4+3] !== outerIdx) continue;
        const a = cv.contourArea(contours.get(i));
        if (a>holeArea) { holeArea=a; holeIdx=i; }
      }
      if (holeIdx<0 || holeArea < outerArea*0.4) return fail('حدود اللوحة غير واضحة — عدّل الإضاءة أو الزاوية');

      // approximate hole to 4 corners
      const hole = contours.get(holeIdx);
      const peri = cv.arcLength(hole, true);
      const approx = new cv.Mat();
      cv.approxPolyDP(hole, approx, 0.02*peri, true);
      let pts;
      if (approx.rows === 4) {
        pts = [];
        for (let i=0;i<4;i++) pts.push({ x:approx.data32S[i*2], y:approx.data32S[i*2+1] });
      } else {
        const rr = cv.minAreaRect(hole);
        const vs = cv.RotatedRect.points(rr);
        pts = vs.map(p=>({x:p.x,y:p.y}));
      }
      approx.delete();

      // order TL,TR,BR,BL
      pts.sort((a,b)=>(a.x+a.y)-(b.x+b.y));
      const TL=pts[0], BR=pts[3];
      const [p1,p2]=[pts[1],pts[2]];
      const TR = p1.x-p1.y > p2.x-p2.y ? p1 : p2;
      const BL = TR===p1 ? p2 : p1;
      let quad=[TL,TR,BR,BL];

      // sub-pixel refine on grayscale
      gray = new cv.Mat();
      cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
      const cm = cv.matFromArray(4,1,cv.CV_32FC2,
        [TL.x,TL.y, TR.x,TR.y, BR.x,BR.y, BL.x,BL.y]);
      try {
        cv.cornerSubPix(gray, cm, new cv.Size(6,6), new cv.Size(-1,-1),
          new cv.TermCriteria(cv.TermCriteria_EPS + cv.TermCriteria_MAX_ITER, 20, 0.03));
        quad = [0,1,2,3].map(i=>({ x:cm.data32F[i*2], y:cm.data32F[i*2+1] }));
      } catch(e){}
      cm.delete();

      // validate with dark corner pockets (sample just inside each corner)
      const d = src.data, W = src.cols;
      let darkCorners = 0;
      for (const [ci,di] of [[0,2],[1,3],[2,0],[3,1]]) {   // corner, its diagonal
        const cP=quad[ci], dP=quad[di];
        const ux=(dP.x-cP.x), uy=(dP.y-cP.y);
        const L=Math.hypot(ux,uy)||1;
        const sx=cP.x+ux/L*L*0.055, sy=cP.y+uy/L*L*0.055; // ~5.5% toward center
        let dark=0, tot=0;
        for (let oy=-4;oy<=4;oy++) for (let ox=-4;ox<=4;ox++) {
          const px=Math.round(sx+ox), py=Math.round(sy+oy);
          if (px<0||py<0||px>=W||py>=src.rows) continue;
          const i=(py*W+px)*4;
          if (Math.max(d[i],d[i+1],d[i+2])<95) dark++;
          tot++;
        }
        if (tot && dark/tot>0.45) darkCorners++;
      }
      if (darkCorners < 2) return fail('الزوايا ما تطابق حفر الكيرم — جرب ثبّت الكاميرا واضغط AUTO مرة ثانية');

      // scale back to video coords + apply
      const q = quad.map(p=>({ x:p.x/scale, y:p.y/scale }));
      Calib.setQuad(q);
      UI.showMsg('تمت المطابقة تلقائيًا ✓ (حفر مطابقة: '+darkCorners+'/4)', 2200);
      return true;

    } catch(err) {
      console.error(err);
      return fail('خطأ أثناء المطابقة — جرب مرة ثانية');
    } finally {
      [src,hsv,mask,kernel,hier,gray].forEach(m=>{ if(m) m.delete(); });
      if (contours) contours.delete();
    }
  }

  function fail(msg){ UI.showMsg(msg, 3000); return false; }
  return { run };
})();

/* ============================================================ DETECTOR
   One pixel pass over the warped board builds masks:
   white (dots / pieces / striker ring), red (striker mandala + queen),
   black (pieces), orange (in-game arrow). Blobs via grid flood-fill. */
const Detector = (() => {
  const PROC_W = 480;
  const pc = document.createElement('canvas');
  const pctx = pc.getContext('2d', { willReadFrequently:true });
  let srcMat=null, warped=null, warpM=null, procScale=1, ready=false;

  let aim=null, lastSeen=0;
  let striker=null, strikerSeen=0, strikerR=STRIKER_R;
  let pieces=[];
  const HOLD_MS=700, STRIKER_HOLD=1500;
  const SMOOTH=0.25, DEAD_ANG=0.018, DEAD_POS=3;

  function initMats(vw,vh) {
    dispose();
    procScale=PROC_W/vw;
    pc.width=PROC_W; pc.height=Math.round(vh*procScale);
    srcMat=new cv.Mat(pc.height,pc.width,cv.CV_8UC4);
    warped=new cv.Mat(BOARD,BOARD,cv.CV_8UC4);
    ready=true;
  }
  function dispose(){ [srcMat,warped,warpM].forEach(m=>{if(m)m.delete();}); srcMat=warped=warpM=null; ready=false; }

  function buildWarp(quad) {
    if (warpM){ warpM.delete(); warpM=null; }
    const src=cv.matFromArray(4,1,cv.CV_32FC2,[
      quad[0].x*procScale,quad[0].y*procScale, quad[1].x*procScale,quad[1].y*procScale,
      quad[2].x*procScale,quad[2].y*procScale, quad[3].x*procScale,quad[3].y*procScale]);
    const dst=cv.matFromArray(4,1,cv.CV_32FC2,[0,0,BOARD,0,BOARD,BOARD,0,BOARD]);
    warpM=cv.getPerspectiveTransform(src,dst);
    src.delete(); dst.delete();
  }

  const CELL=4, GW=BOARD/CELL;
  const gWhite=new Float32Array(GW*GW*3), gRed=new Float32Array(GW*GW*3), gBlack=new Float32Array(GW*GW*3);

  function blobs(grid, minCellCnt) {
    const out=[], seen=new Uint8Array(GW*GW);
    for (let idx=0; idx<GW*GW; idx++) {
      if (seen[idx] || grid[idx*3]<minCellCnt) continue;
      let cnt=0,sx=0,sy=0,minx=1e9,maxx=-1e9,miny=1e9,maxy=-1e9;
      const st=[idx]; seen[idx]=1;
      while (st.length) {
        const cIdx=st.pop(), gx=cIdx%GW, gy=(cIdx/GW)|0;
        cnt+=grid[cIdx*3]; sx+=grid[cIdx*3+1]; sy+=grid[cIdx*3+2];
        const px=grid[cIdx*3+1]/grid[cIdx*3], py=grid[cIdx*3+2]/grid[cIdx*3];
        if(px<minx)minx=px; if(px>maxx)maxx=px; if(py<miny)miny=py; if(py>maxy)maxy=py;
        for (const [ox,oy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
          const nx=gx+ox, ny=gy+oy;
          if (nx<0||ny<0||nx>=GW||ny>=GW) continue;
          const n=ny*GW+nx;
          if (!seen[n] && grid[n*3]>=minCellCnt){ seen[n]=1; st.push(n); }
        }
      }
      out.push({ x:sx/cnt, y:sy/cnt, cnt, span:Math.max(maxx-minx,maxy-miny) });
    }
    return out;
  }

  function nearPocket(x,y){
    for (const [px,py] of [[0,0],[BOARD,0],[BOARD,BOARD],[0,BOARD]])
      if (Math.hypot(x-px,y-py)<48) return true;
    return false;
  }

  function detect(video) {
    if (!ready||!warpM) return output();

    pctx.drawImage(video,0,0,pc.width,pc.height);
    srcMat.data.set(pctx.getImageData(0,0,pc.width,pc.height).data);
    cv.warpPerspective(srcMat,warped,warpM,new cv.Size(BOARD,BOARD),
      cv.INTER_LINEAR,cv.BORDER_CONSTANT,new cv.Scalar());

    gWhite.fill(0); gRed.fill(0); gBlack.fill(0);
    const d=warped.data;
    let arrowX=0,arrowY=0,arrowN=0;

    for (let y=6;y<BOARD-6;y++) {
      const row=y*BOARD*4;
      for (let x=6;x<BOARD-6;x++) {
        const i=row+x*4, r=d[i],g=d[i+1],b=d[i+2];
        const mn=Math.min(r,g,b), mx=Math.max(r,g,b);
        const ci=(((y/CELL)|0)*GW+((x/CELL)|0))*3;
        if (mn>200 && mx-mn<42) { gWhite[ci]++; gWhite[ci+1]+=x; gWhite[ci+2]+=y; }
        else if (r>165 && g<115 && b<130 && r-g>70) {
          gRed[ci]++; gRed[ci+1]+=x; gRed[ci+2]+=y;
          if (g>55 && b<95) { arrowX+=x; arrowY+=y; arrowN++; }   // orange arrow overlaps red-ish
        }
        else if (mx<92) { gBlack[ci]++; gBlack[ci+1]+=x; gBlack[ci+2]+=y; }
      }
    }

    const wb=blobs(gWhite,2), rb=blobs(gRed,2), bb=blobs(gBlack,3);

    // classify
    const dots=[], whitePieces=[];
    let strikerCand=null;
    for (const w of wb) {
      if (w.cnt>=4 && w.cnt<=90 && w.span<14) { dots.push({x:w.x,y:w.y,w:w.cnt}); continue; }
      if (w.span>=13 && w.span<=40 && w.cnt>90) {
        // striker = white disc with red mandala inside
        const red = rb.find(r=>r.span<22 && Math.hypot(r.x-w.x,r.y-w.y) < w.span*0.6);
        if (red) strikerCand={ x:w.x, y:w.y, r:Math.max(11,Math.min(16,w.span/2+2)) };
        else whitePieces.push({ x:w.x, y:w.y, r:PIECE_R, color:'white' });
      }
    }
    const queen = rb.filter(r=>r.cnt>50 && r.span>=8 && r.span<=24 &&
      (!strikerCand || Math.hypot(r.x-strikerCand.x,r.y-strikerCand.y)>strikerCand.r*1.5))
      .map(r=>({x:r.x,y:r.y,r:PIECE_R,color:'red'}));
    const blackPieces = bb.filter(b=>b.cnt>50 && b.span>=8 && b.span<=26 && !nearPocket(b.x,b.y))
      .map(b=>({x:b.x,y:b.y,r:PIECE_R,color:'black'}));

    pieces = whitePieces.concat(queen, blackPieces);

    if (strikerCand) {
      if (striker) {
        striker.x += (strikerCand.x-striker.x)*0.4;
        striker.y += (strikerCand.y-striker.y)*0.4;
      } else striker = strikerCand;
      strikerR = strikerCand.r;
      strikerSeen = performance.now();
    } else if (striker && performance.now()-strikerSeen>STRIKER_HOLD) striker=null;

    // aim line from dots, ORIGIN LOCKED TO STRIKER CENTER
    if (dots.length>=3) {
      const fit=fitLine(dots);
      if (fit) {
        let dir=fit.dir, origin=null;
        if (striker) {
          const cx=dots.reduce((s,p)=>s+p.x,0)/dots.length,
                cy=dots.reduce((s,p)=>s+p.y,0)/dots.length;
          const toDots={x:cx-striker.x, y:cy-striker.y};
          if (dir.x*toDots.x+dir.y*toDots.y<0) dir={x:-dir.x,y:-dir.y};
          origin={x:striker.x, y:striker.y};
        } else if (arrowN>25) {
          const A={x:arrowX/arrowN,y:arrowY/arrowN};
          const t=dots.map(p=>(p.x-fit.c.x)*dir.x+(p.y-fit.c.y)*dir.y);
          const pMin=ext(fit,Math.min(...t)), pMax=ext(fit,Math.max(...t));
          if (Math.hypot(A.x-pMin.x,A.y-pMin.y)<=Math.hypot(A.x-pMax.x,A.y-pMax.y)) {
            origin=pMin;
            if ((pMax.x-pMin.x)*dir.x+(pMax.y-pMin.y)*dir.y<0) dir={x:-dir.x,y:-dir.y};
          } else { origin=pMax; dir={x:-dir.x,y:-dir.y}; }
        } else if (aim) {
          if (dir.x*aim.dir.x+dir.y*aim.dir.y<0) dir={x:-dir.x,y:-dir.y};
          origin=aim.origin;
        }
        if (origin) update(origin,dir);
      }
    }
    return output();
  }

  function ext(fit,t){ return {x:fit.c.x+fit.dir.x*t, y:fit.c.y+fit.dir.y*t}; }

  function fitLine(pts) {
    let W=0,mx=0,my=0;
    for (const p of pts){ W+=p.w; mx+=p.x*p.w; my+=p.y*p.w; }
    mx/=W; my/=W;
    let sxx=0,sxy=0,syy=0;
    for (const p of pts){ const dx=p.x-mx,dy=p.y-my;
      sxx+=dx*dx*p.w; sxy+=dx*dy*p.w; syy+=dy*dy*p.w; }
    const th=0.5*Math.atan2(2*sxy,sxx-syy);
    const dir={x:Math.cos(th),y:Math.sin(th)};
    let err=0;
    for (const p of pts){ const dx=p.x-mx,dy=p.y-my;
      err+=Math.abs(dx*-dir.y+dy*dir.x)*p.w; }
    if (err/W>6) return null;
    return { c:{x:mx,y:my}, dir };
  }

  function update(origin,dir) {
    const n=Math.hypot(dir.x,dir.y)||1; dir={x:dir.x/n,y:dir.y/n};
    if (aim) {
      const aN=Math.atan2(dir.y,dir.x), aO=Math.atan2(aim.dir.y,aim.dir.x);
      let dA=aN-aO;
      while(dA>Math.PI)dA-=2*Math.PI; while(dA<-Math.PI)dA+=2*Math.PI;
      const dP=Math.hypot(origin.x-aim.origin.x,origin.y-aim.origin.y);
      if (Math.abs(dA)<DEAD_ANG && dP<DEAD_POS){ lastSeen=performance.now(); return; }
      const ang=aO+dA*SMOOTH;
      aim={ origin:{ x:aim.origin.x+(origin.x-aim.origin.x)*SMOOTH,
                     y:aim.origin.y+(origin.y-aim.origin.y)*SMOOTH },
            dir:{x:Math.cos(ang),y:Math.sin(ang)} };
    } else aim={origin,dir};
    lastSeen=performance.now();
  }

  function output() {
    if (aim && performance.now()-lastSeen>HOLD_MS) aim=null;
    return { aim, pieces, striker, strikerR };
  }

  return { initMats, buildWarp, detect, resetAim(){ aim=null; striker=null; pieces=[]; } };
})();

/* ============================================================ PHYSICS
   Striker ray vs walls + circle collision with pieces.
   On impact: piece flies along center line, striker deflects on
   the tangent. Both continue with wall reflections r = d-2(d·n)n */
const Physics = (() => {
  const EPS=0.001;

  function wallPath(o, dv, maxSeg) {
    const segs=[], bounces=[];
    let p={...o}, d={...dv};
    for (let s=0;s<maxSeg;s++) {
      const hit=cast(p,d);
      if (!hit) break;
      segs.push({a:{...p}, b:{x:hit.x,y:hit.y}});
      if (s<maxSeg-1) bounces.push({x:hit.x,y:hit.y});
      if (hit.wall==='left'||hit.wall==='right') d={x:-d.x,y:d.y}; else d={x:d.x,y:-d.y};
      p={x:hit.x+d.x*EPS, y:hit.y+d.y*EPS};
    }
    return { segs, bounces };
  }

  function cast(o,d) {
    let tMin=Infinity, best=null;
    const chk=(t,wall)=>{ if(t<=EPS||t>=tMin)return;
      const x=o.x+d.x*t, y=o.y+d.y*t;
      if (x<-1||x>BOARD+1||y<-1||y>BOARD+1) return;
      tMin=t; best={x:Math.max(0,Math.min(BOARD,x)),y:Math.max(0,Math.min(BOARD,y)),wall,t}; };
    if (d.x<-EPS) chk((0-o.x)/d.x,'left');
    if (d.x> EPS) chk((BOARD-o.x)/d.x,'right');
    if (d.y<-EPS) chk((0-o.y)/d.y,'top');
    if (d.y> EPS) chk((BOARD-o.y)/d.y,'bottom');
    return best;
  }

  // earliest piece hit along a segment: |O+tD-C| = rSum
  function circleHit(o, d, len, pieces, rStriker, skip) {
    let best=null;
    for (const pc of pieces) {
      if (pc===skip) continue;
      const rSum=rStriker+pc.r;
      const ox=o.x-pc.x, oy=o.y-pc.y;
      const b=ox*d.x+oy*d.y;
      const c=ox*ox+oy*oy-rSum*rSum;
      const disc=b*b-c;
      if (disc<0) continue;
      const t=-b-Math.sqrt(disc);
      if (t>2 && t<len && (!best||t<best.t)) best={t,piece:pc};
    }
    return best;
  }

  function compute(origin, dir, pieces, rStriker) {
    const out={ main:[], mainBounces:[], hit:null, piecePath:null, strikerPost:null };
    let o={...origin}, d={...dir};

    for (let s=0;s<4;s++) {
      const wall=cast(o,d);
      if (!wall) break;
      const ch=circleHit(o,d,wall.t,pieces,rStriker,null);
      if (ch) {
        const S={x:o.x+d.x*ch.t, y:o.y+d.y*ch.t};      // striker center at impact
        out.main.push({a:{...o}, b:S});
        const P=ch.piece;
        let nx=P.x-S.x, ny=P.y-S.y;
        const nl=Math.hypot(nx,ny)||1; nx/=nl; ny/=nl;   // impact normal (toward piece)
        // piece departs along center line
        out.piecePath = wallPath({x:P.x,y:P.y},{x:nx,y:ny},3);
        out.hit={ point:S, piece:P };
        // striker keeps tangential component
        const dot=d.x*nx+d.y*ny;
        let tx=d.x-dot*nx, ty=d.y-dot*ny;
        const tl=Math.hypot(tx,ty);
        if (tl>0.18) out.strikerPost = wallPath(S,{x:tx/tl,y:ty/tl},2);
        return out;
      }
      out.main.push({a:{...o}, b:{x:wall.x,y:wall.y}});
      if (s<3) out.mainBounces.push({x:wall.x,y:wall.y});
      if (wall.wall==='left'||wall.wall==='right') d={x:-d.x,y:d.y}; else d={x:d.x,y:-d.y};
      o={x:wall.x+d.x*EPS, y:wall.y+d.y*EPS};
    }
    return out;
  }

  return { compute };
})();

/* ============================================================ DRAW */
const Draw = (() => {
  const canvas=document.getElementById('overlay');
  const ctx=canvas.getContext('2d');

  function clear(){ ctx.clearRect(0,0,canvas.width,canvas.height); }

  function quad(q, editing) {
    ctx.save();
    if (editing) {
      ctx.fillStyle='rgba(0,0,0,0.5)';
      ctx.beginPath();
      ctx.rect(0,0,canvas.width,canvas.height);
      ctx.moveTo(q[0].x,q[0].y);
      for (let i=3;i>=0;i--) ctx.lineTo(q[i].x,q[i].y);
      ctx.closePath(); ctx.fill('evenodd');
      ctx.strokeStyle='#ffb347'; ctx.lineWidth=3; path(q); ctx.stroke();
      for (const p of q) {
        ctx.fillStyle='rgba(255,179,71,0.25)';
        ctx.beginPath(); ctx.arc(p.x,p.y,26,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='#ffb347';
        ctx.beginPath(); ctx.arc(p.x,p.y,9,0,Math.PI*2); ctx.fill();
        ctx.strokeStyle='#05080c'; ctx.lineWidth=2;
        ctx.beginPath(); ctx.arc(p.x,p.y,9,0,Math.PI*2); ctx.stroke();
      }
    } else {
      ctx.strokeStyle='rgba(0,0,0,0.55)'; ctx.lineWidth=2.5; path(q); ctx.stroke();
      ctx.strokeStyle='rgba(109,255,158,0.35)'; ctx.lineWidth=1; path(q); ctx.stroke();
    }
    ctx.restore();
  }
  function path(q){ ctx.beginPath(); ctx.moveTo(q[0].x,q[0].y);
    for (let i=1;i<4;i++) ctx.lineTo(q[i].x,q[i].y); ctx.closePath(); }

  function line(segs, b2v, color, glow, width, dash) {
    if (!segs || !segs.length) return;
    ctx.save(); ctx.lineCap='round';
    if (glow){ ctx.strokeStyle=glow; ctx.lineWidth=width+4.5; sp(segs,b2v); }
    ctx.strokeStyle=color; ctx.lineWidth=width;
    if (dash) ctx.setLineDash(dash);
    sp(segs,b2v);
    ctx.setLineDash([]);
    // arrowhead
    const l=segs[segs.length-1], a=b2v(l.a), b=b2v(l.b);
    const ang=Math.atan2(b.y-a.y,b.x-a.x);
    ctx.fillStyle=color;
    ctx.beginPath();
    ctx.moveTo(b.x,b.y);
    ctx.lineTo(b.x-13*Math.cos(ang-0.4), b.y-13*Math.sin(ang-0.4));
    ctx.lineTo(b.x-13*Math.cos(ang+0.4), b.y-13*Math.sin(ang+0.4));
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  function sp(segs,b2v){ ctx.beginPath();
    segs.forEach((s,i)=>{ const a=b2v(s.a), b=b2v(s.b);
      if(i===0) ctx.moveTo(a.x,a.y); else ctx.lineTo(a.x,a.y);
      ctx.lineTo(b.x,b.y); });
    ctx.stroke(); }

  function dots(pts,b2v,color) {
    ctx.save(); ctx.fillStyle=color;
    for (const p of pts){ const v=b2v(p);
      ctx.beginPath(); ctx.arc(v.x,v.y,4.5,0,Math.PI*2); ctx.fill(); }
    ctx.restore();
  }

  function ring(p,b2v,r,color) {
    const v=b2v(p);
    ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.arc(v.x,v.y,r,0,Math.PI*2); ctx.stroke();
    ctx.restore();
  }

  return { canvas, clear, quad, line, dots, ring };
})();

/* ============================================================ APP */
(() => {
  const ANALYZE_MS=45;
  const fpsEl=document.getElementById('fps'), latEl=document.getElementById('lat'),
        cvEl=document.getElementById('cvStatus'),
        btnCal=document.getElementById('btnCalibrate'),
        btnLines=document.getElementById('btnLines'),
        picker=document.getElementById('picker');

  let cvReady=false, camReady=false, linesOn=true;
  let lastAnalyze=0, latency=0, frames=0, fpsTime=performance.now();
  let result=null, paths=null;

  Calib.onChanged = () => { Detector.buildWarp(Calib.quad); Detector.resetAim(); };

  window.addEventListener('opencv-ready', () => {
    cvReady=true; cvEl.textContent='CV READY'; cvEl.classList.add('ok');
    if (camReady) Detector.initMats(Source.video.videoWidth, Source.video.videoHeight);
  });

  function begin(promise) {
    promise.then(({w,h})=>{
      picker.style.display='none'; camReady=true;
      if (cvReady) Detector.initMats(w,h);
      UI.showMsg('اضغط AUTO ⌖ للمطابقة الذاتية', 3500);
      requestAnimationFrame(loop);
    }).catch(err=>{ UI.showMsg('ERROR: '+err.name,4000); console.error(err); });
  }
  document.getElementById('pickCamera').addEventListener('click',()=>begin(Source.startCamera()));
  document.getElementById('pickScreen').addEventListener('click',()=>begin(Source.startScreen()));

  // AUTO FIT
  document.getElementById('btnAuto').addEventListener('click',()=>{
    if (!cvReady){ UI.showMsg('WAIT — CV LOADING',1500); return; }
    UI.showMsg('جاري المطابقة...');
    setTimeout(()=>{
      if (AutoFit.run()) { btnCal.textContent='ADJUST'; btnCal.classList.remove('ok'); }
    }, 30);
  });

  // manual adjust
  btnCal.addEventListener('click',()=>{
    if (!cvReady){ UI.showMsg('WAIT — CV LOADING',1500); return; }
    if (Calib.editing){ Calib.confirm(); btnCal.textContent='ADJUST'; btnCal.classList.remove('ok'); }
    else { Calib.startEdit(); btnCal.textContent='OK ✓'; btnCal.classList.add('ok'); }
  });

  document.getElementById('btnReset').addEventListener('click',()=>{
    Calib.reset(); Detector.resetAim(); result=null; paths=null;
    btnCal.textContent='ADJUST'; btnCal.classList.remove('ok');
    UI.showMsg('RESET',900);
  });

  btnLines.addEventListener('click',()=>{
    linesOn=!linesOn;
    btnLines.classList.toggle('active',linesOn);
  });

  // zoom buttons
  document.getElementById('zoomIn').addEventListener('click',()=>Source.setZoom(Source.getZoom()+Source.zoomStep()));
  document.getElementById('zoomOut').addEventListener('click',()=>Source.setZoom(Source.getZoom()-Source.zoomStep()));

  // pointer: quad drag (1 finger) + pinch zoom (2 fingers)
  const ov=Draw.canvas;
  const ptrs=new Map();
  let pinchStart=null;

  ov.addEventListener('pointerdown', e=>{
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if (ptrs.size===2) {
      const [a,b]=[...ptrs.values()];
      pinchStart={ dist:Math.hypot(a.x-b.x,a.y-b.y), zoom:Source.getZoom() };
      Calib.onUp();
      return;
    }
    if (Calib.quad) {
      e.preventDefault();
      if (Calib.onDown(Source.toVideoCoords(e.clientX,e.clientY))) ov.setPointerCapture(e.pointerId);
    }
  });
  ov.addEventListener('pointermove', e=>{
    if (!ptrs.has(e.pointerId)) return;
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if (ptrs.size===2 && pinchStart) {
      const [a,b]=[...ptrs.values()];
      const dist=Math.hypot(a.x-b.x,a.y-b.y);
      Source.setZoom(pinchStart.zoom * dist/pinchStart.dist);
      return;
    }
    if (Calib.quad) Calib.onMove(Source.toVideoCoords(e.clientX,e.clientY));
  });
  const endPtr = e=>{
    ptrs.delete(e.pointerId);
    if (ptrs.size<2) pinchStart=null;
    Calib.onUp();
  };
  ov.addEventListener('pointerup',endPtr);
  ov.addEventListener('pointercancel',endPtr);

  function loop(now) {
    if (cvReady && Calib.locked && now-lastAnalyze>=ANALYZE_MS) {
      lastAnalyze=now;
      const t0=performance.now();
      try {
        result = Detector.detect(Source.video);
        paths = result.aim
          ? Physics.compute(result.aim.origin, result.aim.dir, result.pieces, result.strikerR)
          : null;
      } catch(e){ console.error(e); }
      latency=Math.round(performance.now()-t0);
    }

    Draw.clear();
    if (Calib.quad) Draw.quad(Calib.quad, Calib.editing);

    if (linesOn && paths && Calib.locked) {
      const b2v=Calib.boardToVideo;
      // striker main path — white dashed with blue glow (like the in-game dotted guide)
      Draw.line(paths.main, b2v, '#ffffff', 'rgba(53,182,255,0.45)', 2.5, [3,11]);
      Draw.dots(paths.mainBounces, b2v, '#ffb347');
      if (paths.hit) {
        Draw.ring(paths.hit.point, b2v, 9, '#ffffff');                  // impact
        // struck piece path — gold
        if (paths.piecePath) {
          Draw.line(paths.piecePath.segs, b2v, '#ffb347', 'rgba(255,179,71,0.35)', 2.5, [8,6]);
          Draw.dots(paths.piecePath.bounces, b2v, '#ffdca0');
        }
        // striker after impact — cyan
        if (paths.strikerPost) {
          Draw.line(paths.strikerPost.segs, b2v, '#35e0ff', 'rgba(53,224,255,0.3)', 2, [4,7]);
          Draw.dots(paths.strikerPost.bounces, b2v, '#aef2ff');
        }
      }
      if (result && result.striker)
        Draw.ring({x:result.striker.x,y:result.striker.y}, b2v, 11, '#35b6ff');
    }

    frames++;
    if (now-fpsTime>=1000){ fpsEl.textContent=frames; latEl.textContent=latency; frames=0; fpsTime=now; }
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
