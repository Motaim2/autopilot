<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>توقع الفواكه — جاكبوت كونز</title>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<style>
  :root{
    --bg1:#3d1145;
    --bg2:#1b0a2e;
    --machine:#7b5cc9;
    --machine-dark:#4a3086;
    --cell:#3a2470;
    --cell-border:#8f7ad4;
    --gold:#ffd54a;
    --gold2:#ffab2e;
    --text:#fff;
    --muted:#c9b8f0;
    --green:#3ecf8e;
    --red-frame:#e8365f;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:
      radial-gradient(900px 500px at 50% -5%, #6a1d78 0%, transparent 60%),
      linear-gradient(180deg, var(--bg1), var(--bg2) 70%);
    color:var(--text);
    font-family:"Segoe UI", Tahoma, Arial, sans-serif;
    overflow-x:hidden;
    user-select:none;
    min-height:100%;
  }
  .wrap{max-width:480px;margin:0 auto;padding:10px 12px 60px}

  /* ===== العنوان ===== */
  .jackpot-title{
    text-align:center;
    font-size:1.9rem;font-weight:900;letter-spacing:2px;
    background:linear-gradient(180deg,#fff6c9 0%, var(--gold) 40%, var(--gold2) 75%, #b0650b 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 3px 4px rgba(0,0,0,.55));
    margin:2px 0 0;
  }
  .sub{text-align:center;color:var(--muted);font-size:.7rem;margin-bottom:8px}

  /* ===== شريط الكاميرا ===== */
  .cam-bar{
    display:flex;align-items:center;gap:10px;
    background:rgba(30,16,58,.75);
    border:1px solid #5d43a8;
    border-radius:16px;
    padding:7px 10px;margin-bottom:10px;
  }
  #camPreview{
    width:76px;height:56px;border-radius:10px;object-fit:cover;
    transform:scaleX(-1);background:#000;border:1px solid #6a4fc0;display:none;
  }
  .cam-info{flex:1;font-size:.68rem;color:var(--muted);line-height:1.5}
  .cam-status{font-size:.75rem;font-weight:700}
  .cam-status.on{color:var(--green)}
  .btn{
    border:none;cursor:pointer;font-family:inherit;font-weight:800;
    border-radius:13px;padding:9px 13px;font-size:.78rem;color:#3a2405;
    background:linear-gradient(180deg,#ffe27a,var(--gold2));
    box-shadow:0 3px 0 #9a5d0c, 0 5px 10px rgba(0,0,0,.35);
    transition:transform .1s, filter .12s;
  }
  .btn:active{transform:translateY(2px);box-shadow:0 1px 0 #9a5d0c}
  .btn-ghost{background:linear-gradient(180deg,#6b52b5,#4a3390);color:#fff;box-shadow:0 3px 0 #2c1c60, 0 5px 10px rgba(0,0,0,.35)}
  .btn-red{background:linear-gradient(180deg,#ff7a95,#d92a52);color:#fff;box-shadow:0 3px 0 #7c1030, 0 5px 10px rgba(0,0,0,.35)}

  /* ===== جسم الآلة ===== */
  .machine{
    background:linear-gradient(180deg,#8d6fdb, #6748b8 20%, #4f349a 80%);
    border:2px solid #a98ff0;
    border-radius:22px;
    padding:12px;
    box-shadow:
      inset 0 2px 8px rgba(255,255,255,.25),
      inset 0 -8px 16px rgba(0,0,0,.35),
      0 12px 30px rgba(0,0,0,.5);
    position:relative;
  }
  .machine::before, .machine::after{
    content:"";position:absolute;top:20px;bottom:20px;width:6px;border-radius:4px;
    background:repeating-linear-gradient(180deg, #ff9de2 0 6px, transparent 6px 22px);
    opacity:.7;
  }
  .machine::before{right:3px}
  .machine::after{left:3px}

  .inner{
    background:linear-gradient(180deg,#241348,#1a0d38);
    border:1.5px solid #6a4fc0;
    border-radius:16px;
    padding:10px;
  }

  /* ===== شبكة 3×3 ===== */
  .board{
    display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
  }
  .cell{
    aspect-ratio:1/1.08;
    background:linear-gradient(180deg,#43297e,#311c62);
    border:1.5px solid #5d43a8;
    border-radius:13px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    position:relative;cursor:pointer;
    transition:transform .12s, border-color .15s, box-shadow .2s;
  }
  .cell .fe{font-size:2.15rem;line-height:1;filter:drop-shadow(0 3px 5px rgba(0,0,0,.5))}
  .cell .fx{
    font-size:.72rem;font-weight:800;color:#fff;margin-top:5px;
    text-shadow:0 1px 3px rgba(0,0,0,.7);
  }
  .cell .fn{font-size:.6rem;color:var(--muted)}
  .cell:active{transform:scale(.94)}
  .cell.hover-cam{
    border-color:var(--gold);
    box-shadow:0 0 0 3px rgba(255,213,74,.35), 0 0 18px rgba(255,213,74,.3);
    transform:scale(1.04);
  }
  .cell.picked{animation:pop .35s}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}

  /* علامات التوقع على الفواكه */
  .mark{
    position:absolute;top:-8px;right:-8px;
    width:26px;height:26px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:.7rem;font-weight:900;
    opacity:0;transform:scale(.4);transition:.25s;
    z-index:3;
  }
  .mark.show{opacity:1;transform:scale(1)}
  .mark.r1{background:linear-gradient(180deg,#ffe27a,var(--gold2));color:#4a2c00;box-shadow:0 0 12px rgba(255,213,74,.8);width:30px;height:30px;font-size:.8rem}
  .mark.r2{background:linear-gradient(180deg,#e8e8f5,#a8a8c8);color:#2c2c45;box-shadow:0 0 8px rgba(200,200,230,.6)}
  .mark.r3{background:linear-gradient(180deg,#e8a06a,#b0642c);color:#3d1e00;box-shadow:0 0 8px rgba(220,140,70,.5)}
  .pct{
    position:absolute;bottom:-7px;left:50%;transform:translateX(-50%) scale(.6);
    background:#12082a;border:1px solid #6a4fc0;
    color:var(--gold);font-size:.58rem;font-weight:800;
    padding:1px 7px;border-radius:8px;white-space:nowrap;
    opacity:0;transition:.25s;z-index:3;
  }
  .pct.show{opacity:1;transform:translateX(-50%) scale(1)}
  .cell.top1{
    border-color:var(--gold);
    box-shadow:0 0 4px rgba(255,213,74,.5), 0 0 20px rgba(255,213,74,.45);
    animation:glow 1.6s ease-in-out infinite;
  }
  @keyframes glow{
    0%,100%{box-shadow:0 0 4px rgba(255,213,74,.5), 0 0 16px rgba(255,213,74,.35)}
    50%{box-shadow:0 0 8px rgba(255,213,74,.8), 0 0 28px rgba(255,213,74,.6)}
  }
  .cell.top2{border-color:#c8c8e8;box-shadow:0 0 12px rgba(200,200,230,.3)}
  .cell.top3{border-color:#d0854a;box-shadow:0 0 10px rgba(220,140,70,.25)}

  /* الخلية الوسطى (شاشة التوقع) */
  .center{
    background:linear-gradient(180deg,#3d0b1e,#2a0614);
    border:2.5px solid var(--red-frame);
    border-radius:13px;
    cursor:default;
    box-shadow:0 0 14px rgba(232,54,95,.45), inset 0 0 20px rgba(0,0,0,.6);
    position:relative;overflow:hidden;
  }
  .center::before{
    content:"";position:absolute;inset:3px;border-radius:9px;
    border:1px dotted rgba(255,155,180,.5);pointer-events:none;
  }
  .center .clabel{font-size:.55rem;color:#ff8fa8;letter-spacing:1px;margin-bottom:2px}
  .center .cfruit{font-size:2rem;filter:drop-shadow(0 0 8px rgba(255,213,74,.6));line-height:1.1}
  .center .cpct{
    font-family:"Courier New",monospace;font-weight:900;font-size:.95rem;color:var(--gold);
    text-shadow:0 0 8px rgba(255,213,74,.8);
  }
  .center .cwait{font-size:.62rem;color:#ff8fa8;text-align:center;padding:0 6px;line-height:1.6}
  .center:active{transform:none}

  /* ===== شريط آخر ٨ ضربات ===== */
  .strip{
    display:flex;align-items:center;gap:5px;
    background:linear-gradient(180deg,#1c0e3a,#140929);
    border:1.5px solid #5d43a8;
    border-radius:12px;
    padding:7px 9px;margin-top:9px;
  }
  .strip .slabel{
    font-size:.68rem;color:var(--muted);font-weight:700;
    margin-left:3px;white-space:nowrap;
  }
  .strip .slots{display:flex;gap:5px;flex:1;justify-content:space-between}
  .slot{
    width:34px;height:34px;border-radius:9px;flex:1;max-width:38px;
    background:#2c1a58;border:1px solid #4a3390;
    display:flex;align-items:center;justify-content:center;
    font-size:1.15rem;position:relative;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.4));
  }
  .slot.empty{opacity:.25;font-size:.8rem}
  .slot .new{
    position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);
    background:linear-gradient(180deg,#6fb8ff,#2e6fd9);
    color:#fff;font-size:.45rem;font-weight:900;letter-spacing:.5px;
    padding:1px 5px;border-radius:6px;
  }
  .slot.newest{border-color:var(--gold);box-shadow:0 0 8px rgba(255,213,74,.5)}

  /* ===== الذاكرة والأدوات ===== */
  .memory-bar{
    display:flex;justify-content:space-between;align-items:center;
    margin:10px 2px 8px;font-size:.7rem;color:var(--muted);
  }
  .memory-bar b{color:var(--gold);font-size:.85rem}
  .actions{display:flex;gap:8px;margin-top:8px}
  .actions .btn{flex:1}

  .stats{
    margin-top:10px;
    background:rgba(30,16,58,.75);border:1px solid #5d43a8;
    border-radius:14px;padding:10px;
    display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;font-size:.62rem;
  }
  .stat b{display:block;font-size:.92rem;color:var(--gold);margin-bottom:1px}
  .stat span{color:var(--muted)}

  /* عدادات كل فاكهة */
  .fcounts{
    margin-top:8px;
    display:grid;grid-template-columns:repeat(8,1fr);gap:4px;
  }
  .fcount{
    background:rgba(30,16,58,.6);border:1px solid #4a3390;border-radius:9px;
    text-align:center;padding:4px 0 3px;font-size:.85rem;
  }
  .fcount i{display:block;font-style:normal;font-size:.58rem;color:var(--gold);font-weight:800;margin-top:1px}

  /* ===== مؤشر اليد ===== */
  #cursor{
    position:fixed;z-index:9999;pointer-events:none;
    width:34px;height:34px;margin:-17px 0 0 -17px;display:none;
  }
  #cursor .ring{
    position:absolute;inset:0;border-radius:50%;
    border:2.5px solid var(--gold);
    box-shadow:0 0 12px rgba(255,213,74,.6);transition:transform .1s;
  }
  #cursor .dot{
    position:absolute;top:50%;left:50%;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;
    border-radius:50%;background:var(--gold);
  }
  #cursor.pinching .ring{transform:scale(.55);border-color:var(--green);box-shadow:0 0 14px rgba(62,207,142,.7)}
  #cursor.pinching .dot{background:var(--green)}

  .toast{
    position:fixed;bottom:16px;left:50%;transform:translateX(-50%) translateY(80px);
    background:#2c1a58;border:1px solid var(--gold);
    color:#fff;padding:9px 18px;border-radius:13px;
    font-size:.75rem;z-index:10000;transition:transform .3s;
    box-shadow:0 8px 24px rgba(0,0,0,.6);
  }
  .toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="wrap">

  <div class="jackpot-title">JACKPOT 🔮</div>
  <div class="sub">توقع الفواكه — العلامات تطلع على اللوحة نفسها | القرصة = تسجيل</div>

  <!-- الكاميرا -->
  <div class="cam-bar">
    <video id="camPreview" autoplay playsinline muted></video>
    <div class="cam-info">
      <div class="cam-status" id="camStatus">الكاميرا مطفية</div>
      <div id="camHint">سبابتك = المؤشر، القرصة = ضغطة</div>
    </div>
    <button class="btn" id="camBtn">📷 تشغيل</button>
  </div>

  <!-- الآلة -->
  <div class="machine">
    <div class="inner">
      <div class="board" id="board"></div>

      <!-- شريط آخر ٨ ضربات -->
      <div class="strip">
        <span class="slabel">نتيجة</span>
        <div class="slots" id="strip"></div>
      </div>
    </div>
  </div>

  <!-- الذاكرة -->
  <div class="memory-bar">
    <span>🧠 الذاكرة الكاملة: <b id="memTotal">0</b> ضربة محفوظة</span>
    <span>ما ينسى شي أبداً</span>
  </div>

  <div class="actions">
    <button class="btn btn-ghost" id="undoBtn">↩️ تراجع</button>
    <button class="btn btn-red" id="clearBtn">🗑️ مسح الذاكرة</button>
  </div>

  <!-- إحصائيات -->
  <div class="stats">
    <div class="stat"><b id="stTotal">0</b><span>ضربة</span></div>
    <div class="stat"><b id="stHit">—</b><span>دقة الأول</span></div>
    <div class="stat"><b id="stTop3">—</b><span>دقة أفضل ٣</span></div>
    <div class="stat"><b id="stStreak">0</b><span>إصابات متتالية</span></div>
  </div>

  <div class="fcounts" id="fcounts"></div>

</div>

<div id="cursor"><div class="ring"></div><div class="dot"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ================== الفواكه (نفس ترتيب اللوحة بالصورة) ================== */
/* الصف الأول: ليمون - توت - كيوي | الثاني: كرز - [شاشة] - برقوق | الثالث: بطيخ - موز - فراولة */
const FRUITS = [
  {id:0, e:"🍋", n:"ليمون",   x:5},
  {id:1, e:"🫐", n:"توت",     x:5},
  {id:2, e:"🥝", n:"كيوي",    x:5},
  {id:3, e:"🍒", n:"كرز",     x:40},
  {id:4, e:"🍇", n:"برقوق",   x:5},
  {id:5, e:"🍉", n:"بطيخ",    x:20},
  {id:6, e:"🍌", n:"موز",     x:10},
  {id:7, e:"🍓", n:"فراولة",  x:10},
];
/* ترتيب الخلايا في الشبكة 3×3 (null = الشاشة الوسطى) */
const LAYOUT = [0, 1, 2, 3, null, 4, 5, 6, 7];

/* ================== الذاكرة الدائمة ================== */
const MEM_KEY = "knuzFruitMemory_v2";
let mem = JSON.parse(localStorage.getItem(MEM_KEY) || "null") || {
  history: [],          // كل الضربات من أول يوم — ما تنمسح إلا يدوي
  h1:0, h3:0, judged:0, // دقة التوقعات
  streak:0
};
let lastPrediction = null;

function saveMem(){ localStorage.setItem(MEM_KEY, JSON.stringify(mem)); }

/* ================== بناء اللوحة ================== */
const board = document.getElementById("board");
LAYOUT.forEach(fid=>{
  if(fid === null){
    const c = document.createElement("div");
    c.className = "cell center";
    c.id = "centerCell";
    c.innerHTML = `<div class="cwait">سجّل ٣ ضربات<br>ويبدأ التخمين 🔮</div>`;
    board.appendChild(c);
    return;
  }
  const f = FRUITS[fid];
  const c = document.createElement("div");
  c.className = "cell";
  c.dataset.id = f.id;
  c.innerHTML = `
    <span class="mark" id="mark${f.id}"></span>
    <span class="fe">${f.e}</span>
    <span class="fx">${f.x} times</span>
    <span class="fn">${f.n}</span>
    <span class="pct" id="pct${f.id}"></span>`;
  c.addEventListener("click", ()=>pickFruit(f.id, c));
  board.appendChild(c);
});

/* عدادات الفواكه تحت */
const fcountsEl = document.getElementById("fcounts");
FRUITS.forEach(f=>{
  const d = document.createElement("div");
  d.className = "fcount";
  d.innerHTML = `${f.e}<i id="cnt${f.id}">0</i>`;
  fcountsEl.appendChild(d);
});

/* ================== تسجيل ضربة ================== */
function pickFruit(id, el){
  // قياس دقة التوقع اللي كان معروض
  if(lastPrediction){
    mem.judged++;
    if(lastPrediction[0].id === id){ mem.h1++; mem.streak++; }
    else mem.streak = 0;
    if(lastPrediction.slice(0,3).some(p=>p.id===id)) mem.h3++;
  }
  mem.history.push(id);           // الذاكرة الكاملة — ما نحذف شي
  saveMem();
  el.classList.add("picked");
  setTimeout(()=>el.classList.remove("picked"), 400);
  showToast(`${FRUITS[id].e} انسجلت — ${FRUITS[id].n}`);
  render();
}

/* ================== محرك التخمين (5 نماذج على كامل الذاكرة) ================== */
function predict(){
  const h = mem.history;
  const n = h.length;
  if(n < 3) return null;
  const K = FRUITS.length;
  const scores = new Array(K).fill(0);

  // 1) التكرار على كامل الذاكرة
  const freq = new Array(K).fill(0);
  h.forEach(v=>freq[v]++);
  const maxF = Math.max(...freq,1);
  for(let i=0;i<K;i++) scores[i] += (freq[i]/maxF) * 1.0;

  // 2) الوزن الزمني — الأحدث أثقل
  const rec = new Array(K).fill(0);
  h.forEach((v,idx)=>{ rec[v] += Math.pow(1.05, idx - n); });
  const maxR = Math.max(...rec, 1e-9);
  for(let i=0;i<K;i++) scores[i] += (rec[i]/maxR) * 1.3;

  // 3) تحليل الغياب — الفاكهة اللي اختفت من زمان ترجع أقرب
  const lastSeen = new Array(K).fill(-1);
  h.forEach((v,idx)=>lastSeen[v]=idx);
  for(let i=0;i<K;i++){
    const gap = lastSeen[i]===-1 ? n : (n-1-lastSeen[i]);
    const expected = n / K;
    if(gap > expected) scores[i] += Math.min((gap-expected)/expected, 1.5) * 0.9;
  }

  // 4) ماركوف — وش يجي عادة بعد آخر ضربة
  if(n >= 6){
    const last = h[n-1];
    const trans = new Array(K).fill(0); let tot=0;
    for(let i=0;i<n-1;i++) if(h[i]===last){ trans[h[i+1]]++; tot++; }
    if(tot>0) for(let i=0;i<K;i++) scores[i] += (trans[i]/tot) * 1.6;
  }

  // 5) مطابقة نمط آخر ٣ ضربات مع كل التاريخ
  if(n >= 8){
    const pat = h.slice(n-3).join(",");
    const nxt = new Array(K).fill(0); let tot=0;
    for(let i=0;i<n-4;i++)
      if(h.slice(i,i+3).join(",")===pat){ nxt[h[i+3]]++; tot++; }
    if(tot>0) for(let i=0;i<K;i++) scores[i] += (nxt[i]/tot) * 2.0;
  }

  const sum = scores.reduce((a,b)=>a+b,0) || 1;
  return FRUITS.map((f,i)=>({...f, p:scores[i]/sum})).sort((a,b)=>b.p-a.p);
}

/* ================== الرسم ================== */
function render(){
  const h = mem.history;

  /* شريط آخر ٨ ضربات — الأحدث أول شي بجنب "نتيجة" */
  const stripEl = document.getElementById("strip");
  const last8 = h.slice(-8).reverse();   // الأحدث أولاً
  let stripHTML = "";
  for(let i=0;i<8;i++){
    if(i < last8.length){
      const f = FRUITS[last8[i]];
      stripHTML += `<div class="slot ${i===0?'newest':''}">${f.e}${i===0?'<span class="new">NEW</span>':''}</div>`;
    } else {
      stripHTML += `<div class="slot empty">·</div>`;
    }
  }
  stripEl.innerHTML = stripHTML;

  /* الذاكرة والعدادات */
  document.getElementById("memTotal").textContent = h.length;
  document.getElementById("stTotal").textContent  = h.length;
  const freq = new Array(FRUITS.length).fill(0);
  h.forEach(v=>freq[v]++);
  FRUITS.forEach(f=>document.getElementById("cnt"+f.id).textContent = freq[f.id]);

  document.getElementById("stHit").textContent   = mem.judged? Math.round(mem.h1/mem.judged*100)+"%" : "—";
  document.getElementById("stTop3").textContent  = mem.judged? Math.round(mem.h3/mem.judged*100)+"%" : "—";
  document.getElementById("stStreak").textContent= mem.streak;

  /* التخمين + العلامات على الفواكه */
  const preds = predict();
  lastPrediction = preds;

  // نظّف كل العلامات
  FRUITS.forEach(f=>{
    const cell = document.querySelector(`.cell[data-id="${f.id}"]`);
    cell.classList.remove("top1","top2","top3");
    const m = document.getElementById("mark"+f.id);
    const p = document.getElementById("pct"+f.id);
    m.className = "mark"; m.textContent = "";
    p.className = "pct";  p.textContent = "";
  });

  const center = document.getElementById("centerCell");
  if(!preds){
    center.innerHTML = `<div class="cwait">سجّل ٣ ضربات<br>ويبدأ التخمين 🔮</div>`;
    return;
  }

  // علامات على أفضل ٣ فواكه
  preds.slice(0,3).forEach((p,rank)=>{
    const cell = document.querySelector(`.cell[data-id="${p.id}"]`);
    cell.classList.add("top"+(rank+1));
    const m = document.getElementById("mark"+p.id);
    m.classList.add("r"+(rank+1), "show");
    m.textContent = rank+1;
    const pc = document.getElementById("pct"+p.id);
    pc.classList.add("show");
    pc.textContent = (p.p*100).toFixed(0)+"%";
  });

  // الشاشة الوسطى: التوقع الأقوى
  const top = preds[0];
  center.innerHTML = `
    <div class="clabel">التوقع القادم</div>
    <div class="cfruit">${top.e}</div>
    <div class="cpct">${(top.p*100).toFixed(1)}%</div>`;
}

/* ================== أدوات ================== */
document.getElementById("undoBtn").addEventListener("click", ()=>{
  if(!mem.history.length) return;
  mem.history.pop();
  saveMem();
  showToast("↩️ انحذفت آخر ضربة");
  render();
});
document.getElementById("clearBtn").addEventListener("click", ()=>{
  if(!confirm("متأكد؟ بتنمسح كل الذاكرة (" + mem.history.length + " ضربة)")) return;
  mem = {history:[], h1:0, h3:0, judged:0, streak:0};
  lastPrediction = null;
  saveMem();
  showToast("🗑️ انمسحت الذاكرة كاملة");
  render();
});

let toastTimer;
function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove("show"), 1500);
}

/* ================== تتبع اليد (زي الكيرم) ================== */
const cursor=document.getElementById("cursor"),
      camBtn=document.getElementById("camBtn"),
      camPrev=document.getElementById("camPreview"),
      camStatus=document.getElementById("camStatus"),
      camHint=document.getElementById("camHint");

let camera=null, hands=null, camOn=false;
let smoothX=0, smoothY=0, first=true;
let pinching=false, lastClickTime=0, hoverEl=null;

camBtn.addEventListener("click", async ()=>{
  if(camOn){ stopCam(); return; }
  try{
    camBtn.textContent="⏳ ...";
    hands = new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});
    hands.setOptions({maxNumHands:1, modelComplexity:0, minDetectionConfidence:0.6, minTrackingConfidence:0.5});
    hands.onResults(onHand);
    camera = new Camera(camPrev, {onFrame:async()=>{await hands.send({image:camPrev});}, width:480, height:360});
    await camera.start();
    camOn=true;
    camPrev.style.display="block";
    camStatus.textContent="الكاميرا شغالة ✋";
    camStatus.classList.add("on");
    camHint.textContent="وجّه للفاكهة واقرص عشان تسجلها";
    camBtn.textContent="⏹️ إيقاف";
    camBtn.className="btn btn-ghost";
    cursor.style.display="block";
    first=true;
    showToast("✋ حرّك يدك قدام الكاميرا");
  }catch(err){
    camBtn.textContent="📷 تشغيل";
    showToast("⚠️ ما قدرت أفتح الكاميرا — اسمح بالإذن");
    console.error(err);
  }
});

function stopCam(){
  if(camera){camera.stop();camera=null;}
  camOn=false;
  camPrev.style.display="none";
  cursor.style.display="none";
  camStatus.textContent="الكاميرا مطفية";
  camStatus.classList.remove("on");
  camHint.textContent="سبابتك = المؤشر، القرصة = ضغطة";
  camBtn.textContent="📷 تشغيل";
  camBtn.className="btn";
  clearHover();
}

function onHand(results){
  if(!results.multiHandLandmarks || !results.multiHandLandmarks.length) return;
  const lm=results.multiHandLandmarks[0];
  const tip=lm[8], thumb=lm[4];

  const nx = 1 - tip.x;
  const zoom = 1.45;
  let px = ((nx - .5)*zoom + .5)*window.innerWidth;
  let py = ((tip.y - .5)*zoom + .5)*window.innerHeight;
  px=Math.max(0,Math.min(window.innerWidth,px));
  py=Math.max(0,Math.min(window.innerHeight,py));

  const a = first?1:.35;
  smoothX += (px-smoothX)*a;
  smoothY += (py-smoothY)*a;
  first=false;

  cursor.style.left=smoothX+"px";
  cursor.style.top=smoothY+"px";
  updateHover(smoothX,smoothY);

  const palm = dist(lm[0],lm[9]) || .1;
  const pd = dist(tip,thumb)/palm;
  if(pd < .32 && !pinching){
    pinching=true;
    cursor.classList.add("pinching");
    const now=Date.now();
    if(now-lastClickTime>450){
      lastClickTime=now;
      camClick(smoothX,smoothY);
    }
  } else if(pd > .45 && pinching){
    pinching=false;
    cursor.classList.remove("pinching");
  }
}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}

function updateHover(x,y){
  const el=document.elementFromPoint(x,y);
  const t=el?el.closest(".cell:not(.center), .btn"):null;
  if(t!==hoverEl){
    clearHover();
    hoverEl=t;
    if(hoverEl&&hoverEl.classList.contains("cell")) hoverEl.classList.add("hover-cam");
    if(hoverEl&&hoverEl.classList.contains("btn")) hoverEl.style.filter="brightness(1.3)";
  }
}
function clearHover(){
  if(hoverEl){
    hoverEl.classList.remove("hover-cam");
    hoverEl.style.filter="";
    hoverEl=null;
  }
}
function camClick(x,y){
  const el=document.elementFromPoint(x,y);
  if(!el)return;
  const t=el.closest(".cell:not(.center), .btn");
  if(t){
    t.click();
    if(navigator.vibrate)navigator.vibrate(30);
  }
}

render();
</script>
